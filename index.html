  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r:hover{background:var(--surf2);border-radius:8px;padding-left:6px;margin-left:-6px}\n\n/* font size scale */\n:root{--task-fs:13px}\nbody.fs-sm{--task-fs:11px}\nbody.fs-lg{--task-fs:15px}\nbody.fs-xl{--task-fs:17px}\n.fs-ctrl{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;background:var(--surf2)}\n.fs-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}\n.fs-btn:hover{background:var(--acc);color:#fff;border-color:var(--acc)}\n.fs-lbl{font-size:10px;color:var(--text3);min-width:20px;text-align:center}\n\n/* tab menu */\n.tab-menu-wrap{position:relative;display:inline-block}\n.tab-menu-btn{padding:5px 10px;border-radius:999px;border:1px solid var(--brd2);background:var(--surf);font-size:11px;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:4px}\n.tab-menu-btn:hover{background:var(--surf2)}\n.tab-menu-panel{display:none;position:absolute;top:calc(100%+6px);left:0;z-index:50;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--brd2);min-width:220px;box-shadow:0 8px 32px rgba(0,0,0,.18)}\n.tab-menu-panel.open{display:block}\n.tmenu-section{font-size:10px;color:var(--text3);font-weight:700;margin:8px 0 4px;text-transform:uppercase;letter-spacing:.5px}\n.tmenu-section:first-child{margin-top:0}\n.tmenu-row{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:7px;cursor:pointer;transition:background .12s}\n.tmenu-row:hover{background:var(--surf2)}\n.tmenu-row label{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text2);cursor:pointer;flex:1}\n.tmenu-row input{accent-color:var(--acc);width:14px;height:14px;flex-shrink:0}\n.tmenu-divider{height:1px;background:var(--brd);margin:8px 0}\n.tmenu-action{padding:5px 8px;border-radius:8px;border:1px solid var(--brd2);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;width:100%;text-align:left;transition:background .12s}\n.tmenu-action:hover{background:var(--surf2);color:var(--text)}\n\n<\u002Fstyle>\n<style id=\"ga-reskin\">\n/* ============================================================\n   GO AHEAD — reskin layer (warm \"paper\" prototype aesthetic)\n   Redefines theme palettes + soft-card polish. No HTML/JS deps.\n   ============================================================ */\n\n/* ---- THEME PALETTES (warm, soft) ---- */\nbody.th-light{--bg:#f3f0e8;--surf:#fffdf7;--surf2:#ece7db;--text:#2b2620;--text2:#7a7268;--text3:#aaa194;--brd:rgba(43,38,32,.07);--brd2:rgba(43,38,32,.13);--acc:#6d63d6;--acc2:#8b82e6;--card:#fffdf7;--inp:#f4f0e7;--hp:linear-gradient(90deg,#e0584e,#ef7a64);--xp:linear-gradient(90deg,#5aac6d,#7cc88a);--bar:rgba(43,38,32,.06);--danger:#cf5a4e;--shadow:0 1px 2px rgba(43,38,32,.05),0 8px 22px rgba(43,38,32,.06);--shadow-lg:0 14px 40px rgba(43,38,32,.14)}\nbody.th-mint{--bg:#eef4ef;--surf:#fbfdfb;--surf2:#e2ece4;--text:#1f2b26;--text2:#5e7068;--text3:#9bb0a6;--brd:rgba(26,48,40,.07);--brd2:rgba(26,48,40,.13);--acc:#3f9e7c;--acc2:#54b894;--card:#fbfdfb;--inp:#eef5f0;--hp:linear-gradient(90deg,#e0584e,#ef7a64);--xp:linear-gradient(90deg,#3f9e7c,#54b894);--bar:rgba(26,48,40,.06);--danger:#cf5a4e;--shadow:0 1px 2px rgba(26,48,40,.05),0 8px 22px rgba(26,48,40,.06);--shadow-lg:0 14px 40px rgba(26,48,40,.13)}\nbody.th-lavender{--bg:#f2f0fb;--surf:#fffdff;--surf2:#e9e5f7;--text:#272050;--text2:#6a629a;--text3:#aaa2cf;--brd:rgba(40,32,80,.07);--brd2:rgba(40,32,80,.13);--acc:#7c63c6;--acc2:#9d83e0;--card:#fffdff;--inp:#f1eefb;--hp:linear-gradient(90deg,#e0584e,#ef7a64);--xp:linear-gradient(90deg,#7c63c6,#9d83e0);--bar:rgba(40,32,80,.06);--danger:#cf5a4e;--shadow:0 1px 2px rgba(40,32,80,.05),0 8px 22px rgba(40,32,80,.07);--shadow-lg:0 14px 40px rgba(40,32,80,.14)}\nbody.th-sand{--bg:#f5efe3;--surf:#fffdf6;--surf2:#ece3d2;--text:#3a2e1a;--text2:#7a6848;--text3:#b8a888;--brd:rgba(58,46,26,.08);--brd2:rgba(58,46,26,.14);--acc:#c79134;--acc2:#dca94e;--card:#fffdf6;--inp:#f5efe1;--hp:linear-gradient(90deg,#e0584e,#ef7a64);--xp:linear-gradient(90deg,#c79134,#dca94e);--bar:rgba(58,46,26,.07);--danger:#cf5a4e;--shadow:0 1px 2px rgba(58,46,26,.05),0 8px 22px rgba(58,46,26,.07);--shadow-lg:0 14px 40px rgba(58,46,26,.14)}\nbody.th-rose{--bg:#f9eef0;--surf:#fffafb;--surf2:#f1e2e6;--text:#3a1c24;--text2:#8a5d66;--text3:#c8a5ad;--brd:rgba(58,28,36,.08);--brd2:rgba(58,28,36,.14);--acc:#d05f7a;--acc2:#e87f97;--card:#fffafb;--inp:#f9edf0;--hp:linear-gradient(90deg,#e0584e,#ef7a64);--xp:linear-gradient(90deg,#d05f7a,#e87f97);--bar:rgba(58,28,36,.06);--danger:#d04040;--shadow:0 1px 2px rgba(58,28,36,.05),0 8px 22px rgba(58,28,36,.07);--shadow-lg:0 14px 40px rgba(58,28,36,.14)}\nbody.th-sakura{--bg:#f8eef1;--surf:#fffafb;--surf2:#f0e2e7;--text:#3a2030;--text2:#8a5870;--text3:#c4a0b0;--brd:rgba(58,32,48,.08);--brd2:rgba(58,32,48,.14);--acc:#d96f93;--acc2:#ec8caa;--card:#fffafb;--inp:#f8edf0;--hp:linear-gradient(90deg,#e0584e,#ef7a64);--xp:linear-gradient(90deg,#d96f93,#ec8caa);--bar:rgba(58,32,48,.06);--danger:#d04060;--shadow:0 1px 2px rgba(58,32,48,.05),0 8px 22px rgba(58,32,48,.07);--shadow-lg:0 14px 40px rgba(58,32,48,.14)}\nbody.th-ocean{--bg:#0e1c2b;--surf:#15293c;--surf2:#102232;--text:#d3e6f3;--text2:#8aa8bf;--text3:#5a7287;--brd:rgba(180,210,235,.09);--brd2:rgba(180,210,235,.17);--acc:#3d9bd6;--acc2:#62b8ef;--card:#15293c;--inp:#102232;--hp:linear-gradient(90deg,#d4544a,#ef7a64);--xp:linear-gradient(90deg,#2f86c4,#62b8ef);--bar:rgba(180,210,235,.07);--danger:#ef7a64;--shadow:0 1px 2px rgba(0,0,0,.25),0 10px 26px rgba(0,0,0,.32);--shadow-lg:0 16px 44px rgba(0,0,0,.4)}\nbody.th-forest{--bg:#16241a;--surf:#1f3024;--surf2:#1a2a1e;--text:#d4e8c8;--text2:#8fb083;--text3:#5f7a54;--brd:rgba(212,232,200,.08);--brd2:rgba(212,232,200,.16);--acc:#5cb87c;--acc2:#79d49a;--card:#1f3024;--inp:#1a2a1e;--hp:linear-gradient(90deg,#d4544a,#ef7a64);--xp:linear-gradient(90deg,#4ba368,#79d49a);--bar:rgba(212,232,200,.07);--danger:#ef7a64;--shadow:0 1px 2px rgba(0,0,0,.22),0 10px 26px rgba(0,0,0,.3);--shadow-lg:0 16px 44px rgba(0,0,0,.38)}\nbody.th-dark{--bg:#1a1722;--surf:#242031;--surf2:#1f1b29;--text:#ece8f3;--text2:#a8a2bd;--text3:#6f6981;--brd:rgba(255,255,255,.08);--brd2:rgba(255,255,255,.16);--acc:#8b7ff0;--acc2:#a99ef7;--card:#242031;--inp:#1f1b29;--hp:linear-gradient(90deg,#d4544a,#ef7a64);--xp:linear-gradient(90deg,#6f63d6,#a99ef7);--bar:rgba(255,255,255,.06);--danger:#ef7a64;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.36);--shadow-lg:0 16px 44px rgba(0,0,0,.44)}\n\n/* ---- base ---- */\nbody{font-family:'Nunito',-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\n.app{max-width:768px;padding:18px 16px 120px}\n#stars{display:none!important}\n.ga-no-trans *,.ga-no-trans *::before,.ga-no-trans *::after{transition:none!important}\n\n/* ---- pixel type: Press Start 2P (matches the web build) ---- */\n.logo{font-size:10px;letter-spacing:2px;color:var(--acc)}\n.cname{font-size:9px;color:var(--acc)}\n.lvbadge{font-size:6px;padding:3px 8px;background:color-mix(in srgb,var(--acc) 14%,transparent);border-color:var(--acc);color:var(--acc)}\n.pill b{font-size:8px;color:var(--acc)}\n.le-val.pos{color:#3f9e7c}.le-val.neg{color:var(--danger)}\n.sn-val{font-size:14px;color:var(--acc)}\n.ovbox h3{font-size:9px;color:var(--acc)}\n.mbtn{font-size:8px}.lucls{font-size:8px}\n.lubox h2{font-size:13px}.lulv{font-size:16px}\n.toast{font-size:8px}\n.step-caret{display:inline-block;width:13px;color:var(--text3);font-size:10px;margin-right:1px}\n\n/* ---- soft cards: rounding + layered shadow + hairline border ---- */\n.char-card{border-radius:18px;border:1px solid var(--brd);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}\n.char-card::before{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 7%,transparent),transparent 62%)}\n.titem{border-radius:14px;border:1px solid var(--brd);box-shadow:var(--shadow);transition:box-shadow .18s,border-color .18s,transform .12s}\n.titem:hover{border-color:var(--brd2);box-shadow:var(--shadow-lg)}\n.titem.selected{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--card))}\n.titem.mustdo-item{border-left:3px solid #e08a4a}\n.titem.recur-item{border-left:3px solid var(--acc2)}\n.tlist{gap:7px}\n.shop-item,.frag-card,.log-entry,.focus-log-item,.diary-entry,.stat-card,.trash-item,.diary-add-form{border-radius:14px;border:1px solid var(--brd);box-shadow:var(--shadow)}\n.aform,.catpanel,.tab-menu-panel{border-radius:16px;border:1px solid var(--brd);box-shadow:var(--shadow-lg)}\n\n/* ---- pills, chips, tabs, buttons ---- */\n.pill,.hbtn,.cat-toggle,.tab-menu-btn,.multiselect-btn,.fs-btn,.lf-btn,.sub-tab,.day-btn{border-radius:999px}\n.pill{padding:6px 11px;border:1px solid var(--brd2);font-weight:700;box-shadow:var(--shadow)}\n.hbtn,.cat-toggle,.tab-menu-btn,.multiselect-btn{border:1px solid var(--brd2);font-weight:600}\n.tab{border-radius:999px;padding:7px 14px;font-weight:700;border:1px solid var(--brd2)}\n.tab.active{box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 34%,transparent)}\n.sub-tab.active,.lf-btn.on,.catf.active,.multiselect-btn.on{box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 30%,transparent)}\n.abtn,.esave{border-radius:11px;font-weight:800;box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 28%,transparent)}\n.fs-btn,.day-btn{border-radius:9px}\n\n/* inputs */\n.aform input,.aform select,.erow input,.erow select,.ov-inp,.de-add input,.de-add select,.cat-edit-row input,.sarow input{border-radius:10px}\n.aform input:focus,.aform select:focus,.ov-inp:focus,.erow input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 14%,transparent)}\n\n/* progress bars → fully rounded */\n.btrack{height:10px;border-radius:999px;border:none;background:var(--bar)}\n.bfill{border-radius:999px}\n.qtag{border-radius:12px;font-weight:600}\n\n/* quad dots / legend → prototype palette, no harsh glow */\n.qdot{box-shadow:none!important}\n.qdot.red{background:#e0584e}.qdot.yellow{background:#e0a83a}.qdot.blue{background:#4f8fd6}.qdot.green{background:#5aac6d}\n.qtag.qr{background:rgba(224,88,78,.12);border-color:rgba(224,88,78,.3);color:#cf5a4e}\n.qtag.qy{background:rgba(224,168,58,.14);border-color:rgba(224,168,58,.32);color:#b07d16}\n.qtag.qb{background:rgba(79,143,214,.12);border-color:rgba(79,143,214,.3);color:#3f7cc0}\n.qtag.qg{background:rgba(90,172,109,.13);border-color:rgba(90,172,109,.3);color:#3f8f56}\n\n/* checkboxes */\n.chkbox{border-radius:6px;border:1.5px solid var(--brd2)}\n.chkbox.chked,.schk.chked{background:var(--acc);border-color:var(--acc)}\n\n/* FAB → soft squircle */\n.fab{width:54px;height:54px;border-radius:18px;font-size:26px;box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 40%,transparent)}\n.fab:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 12px 30px color-mix(in srgb,var(--acc) 48%,transparent)}\n\n/* modals */\n.ovbox,.lubox{border-radius:20px;box-shadow:var(--shadow-lg)}\n.ovbg,.lubg{background:rgba(28,24,20,.46);backdrop-filter:blur(3px)}\n.mbtn,.lucls{border-radius:999px}\n\n/* toasts */\n.toast{border-radius:999px;border:1px solid var(--brd2);box-shadow:var(--shadow)}\n\n/* tab menu panel rows */\n.tab-menu-panel{box-shadow:var(--shadow-lg)}\n.tpanel{border-radius:14px;box-shadow:var(--shadow-lg)}\n\n/* desktop comfort */\n@media(min-width:880px){\n  .app{padding:26px 20px 120px}\n  .fab{bottom:32px;right:max(32px,calc(50vw - 384px + 20px))}\n}\n/* ---- onboarding tutorial ---- */\n.tut-ov{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(28,24,20,.5);backdrop-filter:blur(4px);padding:20px}\n.tut-ov.show{display:flex}\n@keyframes tutfade{from{opacity:0}to{opacity:1}}\n.tut-card{position:relative;width:min(400px,94vw);background:var(--card);border:1px solid var(--brd2);border-radius:24px;box-shadow:var(--shadow-lg);padding:30px 26px 22px;text-align:center;animation:tutpop .3s cubic-bezier(.2,.9,.2,1)}\n@keyframes tutpop{from{transform:translateY(16px) scale(.97)}to{transform:none}}\n.tut-x{position:absolute;top:13px;right:13px;width:30px;height:30px;border-radius:999px;border:none;background:var(--surf2);color:var(--text3);font-size:14px;cursor:pointer}\n.tut-emoji{font-size:48px;line-height:1;margin-bottom:14px}\n.tut-title{font-size:20px;font-weight:900;color:var(--text);margin-bottom:12px}\n.tut-body{font-size:14.5px;line-height:1.85;color:var(--text2);margin-bottom:20px}\n.tut-body b{color:var(--text);font-weight:800}\n.tut-dots{display:flex;gap:7px;justify-content:center;margin-bottom:18px}\n.tut-dot{width:8px;height:8px;border-radius:999px;background:var(--brd2);cursor:pointer;transition:all .2s}\n.tut-dot.on{background:var(--acc);width:20px}\n.tut-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}\n.tut-skip{border:none;background:none;color:var(--text3);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;padding:8px}\n.tut-next{border:none;background:var(--acc);color:#fff;font-size:15px;font-weight:800;font-family:inherit;padding:12px 26px;border-radius:999px;cursor:pointer;white-space:nowrap;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 34%,transparent)}\n.tut-next:hover{transform:translateY(-1px)}\n/* ---- empty state + first-task nudge ---- */\n.empty-state{text-align:center;padding:46px 20px}\n.empty-emoji{font-size:42px;margin-bottom:12px}\n.empty-title{font-size:17px;font-weight:900;color:var(--text);margin-bottom:6px}\n.empty-sub{font-size:13.5px;color:var(--text3);margin-bottom:18px;line-height:1.6}\n.empty-cta{border:none;background:var(--acc);color:#fff;font-family:inherit;font-size:14px;font-weight:800;padding:11px 22px;border-radius:999px;cursor:pointer;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 32%,transparent)}\n.empty-cta:hover{transform:translateY(-1px)}\n@keyframes gaPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 60%,transparent)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}\n.ga-pulse{animation:gaPulse 1.3s ease-out 3;border-color:var(--acc)!important}\n<\u002Fstyle>\n<\u002Fhead>\n<body class=\"th-light\">\n\n<div id=\"stars\"><\u002Fdiv>\n<!-- Level-up -->\n<div id=\"luov\"><div class=\"lubg\" onclick=\"closeLU()\"><\u002Fdiv><div class=\"lubox\"><h2>⭐ LEVEL UP! ⭐<\u002Fh2><span class=\"lusp\" id=\"lusp\">🧙<\u002Fspan><div class=\"lulv\" id=\"lulv\">Lv.2<\u002Fdiv><div class=\"luname\" id=\"luname\">APPRENTICE<\u002Fdiv><div class=\"lurw\">HP +20 | XP上限提升<\u002Fdiv><button class=\"lucls\" onclick=\"closeLU()\">继续冒险 →<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<!-- Name -->\n<div class=\"ov\" id=\"nameov\"><div class=\"ovbg\" onclick=\"closeOv('nameov')\"><\u002Fdiv><div class=\"ovbox\" style=\"width:min(300px,94vw)\"><h3>✏ 角色命名<\u002Fh3><input class=\"ov-inp\" type=\"text\" id=\"nameinp\" maxlength=\"16\" placeholder=\"HERO NAME\" style=\"font-family:'Press Start 2P',monospace;font-size:9px;text-align:center\"><div class=\"mact\"><button class=\"mbtn cancel\" onclick=\"closeOv('nameov')\">取消<\u002Fbutton><button class=\"mbtn\" onclick=\"saveName()\">确认<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<!-- Stat edit -->\n<div class=\"ov\" id=\"statov\"><div class=\"ovbg\" onclick=\"closeOv('statov')\"><\u002Fdiv><div class=\"ovbox\" style=\"width:min(260px,94vw)\"><h3 id=\"stat-title\">修改数值<\u002Fh3><input class=\"ov-inp\" type=\"number\" id=\"statinp\" style=\"font-size:16px;text-align:center\"><div class=\"mact\"><button class=\"mbtn cancel\" onclick=\"closeOv('statov')\">取消<\u002Fbutton><button class=\"mbtn\" onclick=\"saveStatEdit()\">确认<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<!-- Export -->\n<div class=\"ov\" id=\"expov\"><div class=\"ovbg\" onclick=\"closeOv('expov')\"><\u002Fdiv><div class=\"ovbox\"><h3>📦 数据 &amp; 导出<\u002Fh3>\n  <div style=\"margin-bottom:10px\"><p style=\"font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:600\">备份数据<\u002Fp><textarea id=\"expta\" style=\"width:100%;height:75px;padding:8px;border-radius:8px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-size:11px;font-family:monospace;resize:none;outline:none;margin-bottom:6px\" placeholder=\"导入时粘贴数据...\"><\u002Ftextarea><div style=\"display:flex;gap:6px;flex-wrap:wrap\"><button class=\"hbtn\" onclick=\"doExport()\">📋 导出JSON<\u002Fbutton><button class=\"hbtn\" onclick=\"mergeImport()\">➕ 批量添加<\u002Fbutton><button class=\"hbtn\" onclick=\"doImport()\">📥 完整导入（覆盖）<\u002Fbutton><\u002Fdiv><div style=\"font-size:10px;color:var(--text3);margin-top:5px;line-height:1.7\">➕ 批量添加：只读取数据里的任务，按 id 去重后追加，<b>不影响<\u002Fb>金币/等级/记录。<br>📥 完整导入：用整份数据<b>覆盖<\u002Fb>当前所有内容。<\u002Fdiv><\u002Fdiv>\n  <div style=\"margin-bottom:8px\"><p style=\"font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:600\">导出文字总结<\u002Fp><div style=\"display:flex;gap:6px;flex-wrap:wrap\"><button class=\"hbtn\" onclick=\"exportTxt('day')\">📅 今日<\u002Fbutton><button class=\"hbtn\" onclick=\"exportTxt('month')\">📆 本月<\u002Fbutton><button class=\"hbtn\" onclick=\"exportTxt('year')\">🗓 本年<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div style=\"text-align:right\"><button class=\"hbtn\" onclick=\"closeOv('expov')\">关闭<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<!-- Daily summary -->\n<div class=\"ov\" id=\"sumov\"><div class=\"ovbg\"><\u002Fdiv><div class=\"ovbox\" style=\"width:min(400px,94vw)\"><h3>🌙 昨日回顾<\u002Fh3>\n  <p id=\"sum-date\" style=\"text-align:center;font-size:11px;color:var(--text3);margin-bottom:10px\"><\u002Fp>\n  <textarea id=\"sum-input\" class=\"ov-inp\" style=\"height:90px;resize:none;line-height:1.5\" placeholder=\"写几句话记录昨天……（+20XP +10金，可跳过）\"><\u002Ftextarea>\n  <div class=\"mact\"><button class=\"mbtn cancel\" onclick=\"skipSummary()\">跳过<\u002Fbutton><button class=\"mbtn\" onclick=\"saveSummary()\">记录 +20XP<\u002Fbut
