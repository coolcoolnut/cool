<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔ Quest Log</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body.theme-dark{--bg:#0f0f1a;--surf:#1a1a2e;--surf2:#16213e;--text:#e8e6f0;--text2:#a09ec0;--text3:#5e5c7a;--brd:rgba(255,255,255,.08);--brd2:rgba(255,255,255,.15);--acc:#7c6cf8;--acc2:#a78bfa;--card:#1a1a2e;--inp:#16213e;--hp:linear-gradient(90deg,#c0392b,#e74c3c);--xp:linear-gradient(90deg,#27ae60,#2ecc71);--barbg:rgba(255,255,255,.06)}
body.theme-light{--bg:#f5f4f0;--surf:#fff;--surf2:#f0eeea;--text:#2c2a3a;--text2:#6b6880;--text3:#a09eb8;--brd:rgba(0,0,0,.08);--brd2:rgba(0,0,0,.15);--acc:#6655e8;--acc2:#8b76f5;--card:#fff;--inp:#f5f4f0;--hp:linear-gradient(90deg,#e74c3c,#ff6b6b);--xp:linear-gradient(90deg,#27ae60,#52c97a);--barbg:rgba(0,0,0,.06)}
body.theme-forest{--bg:#1a2416;--surf:#223020;--surf2:#1c2a1a;--text:#d4e8c8;--text2:#8eb880;--text3:#4a6a40;--brd:rgba(255,255,255,.07);--brd2:rgba(255,255,255,.14);--acc:#5cb85c;--acc2:#7dd87d;--card:#223020;--inp:#1c2a1a;--hp:linear-gradient(90deg,#c0392b,#e74c3c);--xp:linear-gradient(90deg,#2e7d32,#4caf50);--barbg:rgba(255,255,255,.05)}
body.theme-sakura{--bg:#fff0f4;--surf:#fff;--surf2:#fff5f7;--text:#3a2030;--text2:#8a5870;--text3:#c4a0b0;--brd:rgba(180,80,120,.1);--brd2:rgba(180,80,120,.2);--acc:#e05585;--acc2:#f07090;--card:#fff;--inp:#fff5f7;--hp:linear-gradient(90deg,#e03060,#f05080);--xp:linear-gradient(90deg,#c0408a,#e060aa);--barbg:rgba(180,80,120,.06)}
body.theme-ocean{--bg:#0a1628;--surf:#0d2040;--surf2:#0a1a35;--text:#c8e4f8;--text2:#7aa8d0;--text3:#3a6090;--brd:rgba(100,180,255,.08);--brd2:rgba(100,180,255,.16);--acc:#2196f3;--acc2:#64b5f6;--card:#0d2040;--inp:#0a1a35;--hp:linear-gradient(90deg,#b71c1c,#ef5350);--xp:linear-gradient(90deg,#0277bd,#29b6f6);--barbg:rgba(100,180,255,.06)}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;display:none}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite var(--dl,0s)}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.8}}
.app{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:16px 14px 80px}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.logo{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--acc2);letter-spacing:2px}
.hdr-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;border:1px solid var(--brd2);background:var(--surf);font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:background .15s}
.pill:hover{background:var(--surf2)}
.pill b{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--acc2)}
.hbtn{padding:5px 10px;border-radius:999px;border:1px solid var(--brd2);background:var(--surf);font-size:11px;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.hbtn:hover{background:var(--surf2);color:var(--text)}
.theme-row{position:relative}
.tpanel{display:none;position:absolute;top:100%;right:0;z-index:30;margin-top:6px;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--brd2);min-width:180px}
.tpanel.open{display:block}
.tpanel label{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2)}
.tpanel label:hover{background:var(--surf2)}
.tpanel input{accent-color:var(--acc)}
.char-card{display:flex;align-items:center;gap:14px;padding:13px 15px;border-radius:14px;border:1px solid var(--brd2);background:var(--card);margin-bottom:12px;position:relative;overflow:hidden}
.char-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(124,108,248,.05),transparent 60%);pointer-events:none}
.csprite{width:52px;height:52px;font-size:38px;text-align:center;line-height:52px;cursor:pointer;user-select:none;transition:transform .2s;flex-shrink:0}
.csprite:hover{transform:scale(1.15) rotate(-8deg)}
.cinfo{flex:1;min-width:0}
.cnrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cname{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--acc2);cursor:pointer;border-bottom:1px dashed var(--brd2);padding-bottom:1px}
.lvbadge{font-family:'Press Start 2P',monospace;font-size:7px;padding:3px 8px;border-radius:999px;background:rgba(124,108,248,.15);border:1px solid var(--acc);color:var(--acc2)}
.bwrap{margin-bottom:4px}
.blbl{font-size:11px;color:var(--text2);margin-bottom:2px;display:flex;justify-content:space-between}
.btrack{height:10px;border-radius:5px;background:var(--barbg);border:1px solid var(--brd);overflow:hidden}
.bfill{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.hpf{background:var(--hp)}.xpf{background:var(--xp)}
.filter-area{margin-bottom:12px}
.qlgd{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:7px}
.qtag{padding:7px 10px;border-radius:10px;font-size:11px;font-weight:500;border:1px solid;cursor:pointer;transition:all .15s;user-select:none}
.qtag.inactive{opacity:.3}
.qr{background:rgba(226,75,74,.12);border-color:rgba(226,75,74,.35);color:#e87070}
.qy{background:rgba(186,117,23,.12);border-color:rgba(239,159,39,.35);color:#d4a030}
.qb{background:rgba(24,95,165,.12);border-color:rgba(55,138,221,.35);color:#6baae0}
.qg{background:rgba(59,109,17,.12);border-color:rgba(99,153,34,.35);color:#7db840}
.catrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.cat-toggle{padding:4px 10px;border-radius:999px;font-size:11px;border:1px solid var(--brd2);background:var(--surf);color:var(--text2);cursor:pointer;user-select:none;transition:all .15s}
.cat-toggle:hover{background:var(--surf2)}
.catfilters{display:none;gap:5px;flex-wrap:wrap;margin-top:6px;margin-bottom:2px}
.catfilters.open{display:flex}
.catf{padding:4px 10px;border-radius:999px;font-size:11px;border:1px solid var(--brd2);background:transparent;color:var(--text2);cursor:pointer;user-select:none;transition:all .15s}
.catf:hover{background:var(--surf2)}
.catf.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:999px;border:1px solid var(--brd2);background:transparent;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;color:var(--text2);transition:all .15s;font-weight:500}
.tab:hover{background:var(--surf2);color:var(--text)}
.tab.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.aform{padding:11px;border-radius:14px;background:var(--card);border:1px solid var(--brd);margin-bottom:12px}
.arow{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
.arow:last-child{margin-bottom:0}
.aform input[type=text],.aform input[type=date],.aform input[type=number],.aform select{padding:6px 9px;height:32px;border-radius:8px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;outline:none;transition:border .15s}
.aform input[type=text]{flex:1;min-width:100px}
.aform input:focus{border-color:var(--acc)}
.aform input::placeholder{color:var(--text3)}
.aform select option{background:var(--card)}
.abtn{padding:6px 13px;height:32px;border-radius:8px;border:none;background:var(--acc);color:#fff;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:600;transition:all .15s;white-space:nowrap}
.abtn:hover{opacity:.85;transform:translateY(-1px)}
.albl{font-size:11px;color:var(--text3);white-space:nowrap}
.bulk-bar{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:10px;background:rgba(124,108,248,.1);border:1px solid var(--acc);margin-bottom:8px;flex-wrap:wrap}
.bulk-bar span{font-size:12px;color:var(--acc2);flex:1}
.bbtn{padding:5px 11px;border-radius:7px;border:1px solid var(--brd2);background:var(--card);color:var(--text2);font-size:11px;cursor:pointer;transition:all .15s}
.bbtn:hover{background:var(--surf2)}
.bbtn.danger{border-color:rgba(226,75,74,.3);color:#ef9090}
.bbtn.danger:hover{background:rgba(226,75,74,.1)}
.tlist{display:flex;flex-direction:column;gap:5px}
.titem{border-radius:10px;border:1px solid var(--brd);background:var(--card);transition:all .2s;overflow:hidden}
.titem:hover{border-color:var(--brd2)}
.titem.selected{border-color:var(--acc);background:rgba(124,108,248,.05)}
.titem.donefade{opacity:.5}
.titem.mustdo-item{border-left:3px solid #e8450a}
.tmain{display:flex;align-items:center;gap:8px;padding:9px 11px}
.titem.flash{animation:fla .4s ease}
@keyframes fla{0%{background:rgba(124,108,248,.25)}100%{background:var(--card)}}
.chkbox{width:16px;height:16px;border-radius:4px;border:1px solid var(--brd2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;transition:all .15s;color:var(--acc2);background:transparent}
.chkbox:hover{border-color:var(--acc)}
.chkbox.chked{background:var(--acc);border-color:var(--acc);color:#fff}
.qdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.qdot.red{background:#E24B4A;box-shadow:0 0 4px rgba(226,75,74,.5)}
.qdot.yellow{background:#EF9F27;box-shadow:0 0 4px rgba(239,159,39,.5)}
.qdot.blue{background:#378ADD;box-shadow:0 0 4px rgba(55,138,221,.5)}
.qdot.green{background:#639922;box-shadow:0 0 4px rgba(99,153,34,.5)}
.tname{font-size:13px;color:var(--text);cursor:pointer}
.tname.donetext{text-decoration:line-through;color:var(--text3)}
.tname-sub{font-size:11px;color:#e8a020;margin-top:1px}
.tdonetime{font-size:10px;color:var(--text3);margin-top:1px}
.tmeta{display:flex;align-items:center;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.bdg{font-size:10px;padding:2px 6px;border-radius:999px;font-weight:500;white-space:nowrap}
.bdg-type{background:rgba(255,255,255,.06);color:var(--text2);border:1px solid var(--brd)}
.bdg-diff{padding:2px 6px;border-radius:999px;font-size:10px;font-weight:600}
.bdg-diff.trivial{background:rgba(100,100,100,.15);color:var(--text3)}
.bdg-diff.easy{background:rgba(46,204,113,.12);color:#52c97a;border:1px solid rgba(46,204,113,.25)}
.bdg-diff.medium{background:rgba(52,152,219,.12);color:#64b5f6;border:1px solid rgba(52,152,219,.25)}
.bdg-diff.hard{background:rgba(231,76,60,.12);color:#ef9090;border:1px solid rgba(231,76,60,.25)}
.bdg-cat{padding:2px 6px;border-radius:999px;font-size:10px;border:1px solid var(--brd2);color:var(--text2)}
.bdg-dl{font-size:10px;color:var(--text3)}.bdg-dl.urg{color:#ef9090}
.bdg-req{font-size:10px;padding:2px 6px;border-radius:999px;background:rgba(232,100,10,.12);color:#e87820;border:1px solid rgba(232,100,10,.35);font-weight:500}
.tact{display:flex;gap:3px;flex-shrink:0}
.ibtn{width:27px;height:27px;border-radius:7px;border:1px solid var(--brd);background:transparent;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.ibtn:hover{background:var(--surf2);color:var(--text);border-color:var(--brd2)}
.ibtn.ok:hover{background:rgba(46,204,113,.15);color:#52c97a;border-color:rgba(46,204,113,.3)}
.ibtn.bad:hover{background:rgba(226,75,74,.15);color:#ef9090;border-color:rgba(226,75,74,.3)}
.ibtn.edon{background:rgba(124,108,248,.15);border-color:var(--acc);color:var(--acc2)}
.crow{display:flex;align-items:center;gap:7px;padding:5px 11px 9px 28px;flex-wrap:wrap}
.ctrack{flex:1;height:7px;border-radius:4px;background:var(--barbg);border:1px solid var(--brd);overflow:hidden;max-width:140px}
.cfill{height:100%;border-radius:4px;background:var(--acc);transition:width .3s}
.ctxt{font-size:11px;color:var(--text2)}
.cbtn{width:24px;height:24px;border-radius:6px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-weight:600;transition:all .15s}
.cbtn:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.cstep{width:44px;height:24px;border-radius:6px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-size:12px;text-align:center;font-family:'DM Sans',sans-serif;outline:none;padding:0 4px}
.srow{padding:0 11px 9px 28px}
.sitem{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--brd)}
.sitem:last-child{border-bottom:none}
.schk{width:15px;height:15px;border-radius:4px;border:1px solid var(--brd2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--acc2);transition:all .15s;flex-shrink:0}
.schk:hover{border-color:var(--acc)}
.schk.chked{background:var(--acc);border-color:var(--acc);color:#fff}
.sname{font-size:12px;color:var(--text2);flex:1}
.sname.done{text-decoration:line-through;color:var(--text3)}
.sdel{width:16px;height:16px;border-radius:4px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center}
.sdel:hover{color:#ef9090}
.sarow{display:flex;gap:6px;margin-top:5px}
.sarow input{flex:1;padding:4px 7px;border-radius:6px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none}
.sarow input:focus{border-color:var(--acc)}
.sabtn{padding:4px 9px;border-radius:6px;border:1px solid var(--brd2);background:var(--inp);color:var(--text2);font-size:11px;cursor:pointer;white-space:nowrap}
.sabtn:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.erow{padding:7px 11px 5px;border-top:1px solid var(--brd);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.erow:last-child{padding-bottom:9px}
.erow input,.erow select{padding:5px 7px;height:29px;border-radius:6px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none}
.erow input[type=text]{flex:1;min-width:80px}
.erow input:focus{border-color:var(--acc)}
.esave{padding:5px 11px;height:29px;border-radius:6px;border:none;background:var(--acc);color:#fff;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600}
.ecancel{padding:5px 11px;height:29px;border-radius:6px;border:1px solid var(--brd2);background:transparent;color:var(--text3);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
.elbl{font-size:11px;color:var(--text3);white-space:nowrap}
.sdiv{font-size:11px;color:var(--text3);padding:9px 0 4px;font-weight:600;letter-spacing:.5px;border-bottom:1px solid var(--brd);margin-bottom:5px;text-transform:uppercase}
.empty{text-align:center;padding:32px 0;color:var(--text3);font-size:13px}
.ov{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center}
.ov.show{display:flex}
.ovbg{position:absolute;inset:0;background:rgba(0,0,0,.72)}
.ovbox{position:relative;padding:22px 26px;border-radius:14px;background:var(--card);border:1px solid var(--brd2);z-index:1;width:min(480px,94vw);max-height:90vh;overflow-y:auto}
.ovbox h3{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--acc2);margin-bottom:14px;text-align:center}
.mact{display:flex;gap:7px;justify-content:center;margin-top:12px}
.mbtn{padding:8px 18px;border-radius:8px;border:1px solid var(--brd2);background:var(--acc);color:#fff;font-family:'Press Start 2P',monospace;font-size:7px;cursor:pointer}
.mbtn.cancel{background:transparent;color:var(--text2)}
#luov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .3s}
#luov.show{opacity:1;pointer-events:all}
.lubg{position:absolute;inset:0;background:rgba(0,0,0,.8)}
.lubox{position:relative;text-align:center;padding:32px 40px;border-radius:16px;background:var(--card);border:2px solid var(--acc);z-index:1}
.lubox h2{font-family:'Press Start 2P',monospace;font-size:13px;color:var(--acc2);margin-bottom:8px;animation:gp 1s ease-in-out infinite}
@keyframes gp{0%,100%{text-shadow:0 0 8px var(--acc)}50%{text-shadow:0 0 24px var(--acc2),0 0 48px var(--acc)}}
.lusp{font-size:68px;display:block;margin:6px 0;animation:bnc .6s ease-in-out infinite alternate}
@keyframes bnc{from{transform:translateY(0)}to{transform:translateY(-12px)}}
.lulv{font-family:'Press Start 2P',monospace;font-size:17px;color:#fff;margin:6px 0}
.luname{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--text2);margin-bottom:5px}
.lurw{font-size:13px;color:var(--text2);margin-bottom:16px}
.lucls{padding:9px 24px;border-radius:999px;background:var(--acc);color:#fff;border:none;font-family:'Press Start 2P',monospace;font-size:8px;cursor:pointer}
.cp{position:fixed;width:8px;height:8px;pointer-events:none;z-index:99;animation:cff var(--dur,2s) ease-in var(--dl,0s) forwards}
@keyframes cff{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
#tw{position:fixed;bottom:18px;right:18px;z-index:50;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.toast{padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--brd2);font-family:'Press Start 2P',monospace;font-size:8px;color:var(--text);animation:tin .3s ease,tout .3s ease 1.7s forwards;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
@keyframes tout{from{opacity:1}to{opacity:0}}
/* shop */
.shop-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--brd);background:var(--card);margin-bottom:6px}
.shop-item .si-name{flex:1;font-size:13px}
.shop-item .si-cost{font-family:'Press Start 2P',monospace;font-size:8px;color:#e8a020;flex-shrink:0}
.shop-item .si-bar{height:5px;border-radius:3px;background:var(--barbg);overflow:hidden;width:80px;flex-shrink:0}
.shop-item .si-fill{height:100%;background:#e8a020;transition:width .3s}
.shop-btn{padding:5px 12px;height:28px;border-radius:7px;border:1px solid rgba(232,160,32,.3);background:rgba(232,160,32,.1);color:#e8a020;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;white-space:nowrap;transition:all .15s}
.shop-btn:hover{background:rgba(232,160,32,.2)}
.shop-btn:disabled{opacity:.4;cursor:default}
/* log entries */
.log-entry{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:8px;border:1px solid var(--brd);background:var(--card);margin-bottom:4px;font-size:12px}
.log-entry .le-icon{font-size:14px;flex-shrink:0}
.log-entry .le-desc{flex:1;color:var(--text2)}
.log-entry .le-val{font-family:'Press Start 2P',monospace;font-size:8px;flex-shrink:0}
.log-entry .le-val.pos{color:#52c97a}
.log-entry .le-val.neg{color:#ef9090}
.log-entry .le-time{font-size:10px;color:var(--text3);flex-shrink:0}
/* summary modal */

<script>
const SPRITES=['🧙','🧝','🧛','🦸','🥷','🧚','🧜','🤺','🧟','🐉'];
const LVNAMES=['ADVENTURER','APPRENTICE','WARRIOR','CHAMPION','HERO','LEGEND','MASTER','MYTHIC'];
const XPMAP={trivial:5,easy:10,medium:20,hard:40};
const GOLDMAP={trivial:3,easy:8,medium:15,hard:30};
const QUADXP={red:1.2,yellow:1.0,blue:0.8,green:1.3};
const DIFFLBL={trivial:'无关紧要',easy:'简单',medium:'中等',hard:'困难'};
const TYPELBL={habit:'习惯',daily:'每日',todo:'待办',archive:'存档'};
const DEF_CATS=[{id:'学习',label:'📚 学习'},{id:'健康',label:'💪 健康'},{id:'生活',label:'🏠 生活'},{id:'社交',label:'💬 社交'},{id:'创意',label:'🎨 创意'}];

function mkTask(o){
  const isMT=o.type==='mustdo';
  return{id:o.id,name:o.name||'',type:isMT?'todo':o.type||'todo',mustdo:o.mustdo!==undefined?!!o.mustdo:isMT,
    quad:o.quad||'yellow',diff:o.diff||'medium',cat:o.cat||'',done:o.done||false,count:o.count||0,
    counterGoal:o.counterGoal||0,counterUnit:o.counterUnit||'次',
    minReq:o.minReq||0,minReqUnit:o.minReqUnit||'次',minReqDesc:o.minReqDesc||'',minReqDone:o.minReqDone||false,
    deadline:o.deadline||'',steps:o.steps||[],doneTime:o.doneTime||''};
}

function defState(){
  const t=(id,nm,tp,q,d,c,md,opts={})=>mkTask({id,name:nm,type:tp,quad:q,diff:d,cat:c,mustdo:md,...opts});
  return{tasks:[// 今天必须做
    t(1,'30个悬垂举腿打卡','mustdo','red','hard','健康',true,{minReq:30,minReqUnit:'个',minReqDesc:'上单杠',steps:[{id:1,name:'做好热身',done:false},{id:2,name:'上单杠',done:false}]}),
    t(2,'拉伸','mustdo','yellow','easy','健康',true,{minReq:1,minReqUnit:'次',minReqDesc:'5秒也行'}),
    t(3,'开题文件再确认','mustdo','red','hard','学习',true,{minReq:1,minReqUnit:'次',minReqDesc:'打开文档',steps:[{id:3,name:'打开文档',done:false},{id:4,name:'逐项核对',done:false},{id:5,name:'存档确认版',done:false}]}),
    t(4,'杭州探馆','mustdo','green','medium','生活',true,{minReq:1,minReqUnit:'次',minReqDesc:'出发'}),
    // 建议做/可选
    t(5,'搞定notellm','todo','red','hard','学习',false,{steps:[{id:6,name:'查文档',done:false},{id:7,name:'跑通demo',done:false}]}),
    t(6,'洗澡','todo','yellow','trivial','生活'),
    t(7,'椭圆仪','todo','yellow','medium','健康',false,{counterGoal:40,counterUnit:'分钟',minReq:1,minReqUnit:'分钟',minReqDesc:'穿鞋站上去'}),
    t(8,'开题报告出一版','todo','red','hard','学习',false,{minReq:1,minReqUnit:'次',minReqDesc:'打开写一句话',steps:[{id:8,name:'列提纲',done:false},{id:9,name:'写引言',done:false},{id:10,name:'填主体',done:false}]}),
    t(9,'补日记','todo','green','easy','生活'),
    t(10,'收拾房间','todo','yellow','easy','生活',false,{steps:[{id:11,name:'整理桌面',done:false},{id:12,name:'收拾地面',done:false}]}),
    t(11,'搜索浴巾收纳','todo','blue','trivial','生活'),
    t(12,'心率血氧仪','todo','yellow','easy','生活'),
    // 存档（清空大脑）
    t(13,'action6清理视频','archive','yellow','medium','创意'),
    t(14,'整理桌面文件','archive','yellow','easy','生活'),
    t(15,'整理工位','archive','yellow','easy','生活'),
    t(16,'洗牙报销、开药报销','archive','yellow','medium','生活',false,{steps:[{id:13,name:'带好所有发票',done:false},{id:14,name:'去校医院',done:false},{id:15,name:'上三楼报销',done:false}]}),
    t(17,'根据教程写初稿','archive','red','hard','学习'),
    t(18,'擦屏幕','archive','blue','trivial','生活'),
    t(19,'整理更衣室单据','archive','yellow','easy','生活',false,{steps:[{id:16,name:'打印"2026单据"标签',done:false},{id:17,name:'剪下胶带粘上',done:false},{id:18,name:'拍照存档',done:false}]}),
    // 日常简单待办
    t(20,'微信读书打开1分钟','habit','blue','trivial','学习',false,{counterGoal:1,counterUnit:'分钟',minReq:1,minReqUnit:'次',minReqDesc:'打开app'}),
    t(21,'百词斩打卡','daily','yellow','easy','学习',false,{minReq:1,minReqUnit:'次',minReqDesc:'打开app'}),
    t(22,'喝水','habit','blue','easy','健康',false,{counterGoal:8,counterUnit:'杯',minReq:4,minReqUnit:'杯',minReqDesc:'先喝一大杯'}),
    t(23,'任意运动','daily','green','medium','健康',true,{counterGoal:20,counterUnit:'分钟',minReq:1,minReqUnit:'次',minReqDesc:'保底椭圆仪20分钟'}),
    t(24,'路过任意地方随意收拾','habit','green','trivial','生活',false,{minReq:1,minReqUnit:'次',minReqDesc:'随手做一件'}),],
  doneList:[
    {id:'d1',name:'出门吃饺子',xp:10,gold:8,diff:'easy',cat:'生活',time:'今天 12:30',ts:Date.now()-3600000},
    {id:'d2',name:'下载了电视剧',xp:5,gold:3,diff:'trivial',cat:'生活',time:'今天 14:00',ts:Date.now()-7200000},
  ],
  hp:100,maxHp:100,xp:0,maxXp:100,gold:0,level:1,
  spriteIdx:0,charName:'ADVENTURER',
  activeTab:'all',quadFilters:[],catFilter:'',
  categories:[...DEF_CATS],
  shopItems:[
    {id:'s1',name:'奶茶一杯',cost:50,bought:false},
    {id:'s2',name:'新书',cost:120,bought:false},
    {id:'s3',name:'电影票',cost:80,bought:false},
  ],
  ledger:[],   // {ts,type:'xp'|'gold'|'hp',delta,desc}
  dailySummaries:[],  // {date,text,ts}
  nextId:50,nextStepId:300,lastReset:'',theme:'theme-light',undoStack:[]};
}

let S,editingId=null,bulkSel=new Set(),expandedDone=new Set(),collapsedSteps=new Set();
try{const sv=localStorage.getItem('ql_v8');S=sv?JSON.parse(sv):defState();}catch(e){S=defState();}
S.tasks=S.tasks.map(t=>mkTask(t));
if(!S.quadFilters)S.quadFilters=[];
if(!S.catFilter)S.catFilter='';
if(!S.categories)S.categories=[...DEF_CATS];
if(!S.shopItems)S.shopItems=[{id:'s1',name:'奶茶一杯',cost:50,bought:false},{id:'s2',name:'新书',cost:120,bought:false}];
if(!S.ledger)S.ledger=[];
if(!S.dailySummaries)S.dailySummaries=[];

function save(){try{localStorage.setItem('ql_v8',JSON.stringify(S));}catch(e){}}

// ledger
function addLedger(type,delta,desc){
  S.ledger.unshift({id:'l'+Date.now(),ts:Date.now(),type,delta,desc,time:nowStr()});
  if(S.ledger.length>500)S.ledger=S.ledger.slice(0,500);
}

// daily reset
function checkReset(){
  const today=new Date().toDateString();if(S.lastReset===today)return;
  const isFirst=!S.lastReset;
  S.lastReset=today;
  S.tasks.forEach(t=>{
    if(t.type==='daily'){
      if(!t.done&&t.minReq>0&&t.count<t.minReq){
        S.hp=Math.max(0,S.hp-8);
        addLedger('hp',-8,'"'+t.name+'"未达最低要求');
        showToast('💔 "'+t.name+'" 未达最低 -8HP');
      }
      t.done=false;t.count=0;t.minReqDone=false;
      if(t.steps)t.steps.forEach(s=>s.done=false);
    }
  });
  if(!isFirst){
    const yesterday=new Date(Date.now()-86400000).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'});
    document.getElementById('sum-date').textContent=yesterday+'的回顾';
    document.getElementById('sum-input').value='';
    openOv('sumov');
  }
  save();
}
checkReset();
setInterval(()=>{if(new Date().toDateString()!==S.lastReset)checkReset();},60000);

// theme
function setTheme(th){document.body.className=th;S.theme=th;save();const dark=th==='theme-dark'||th==='theme-forest'||th==='theme-ocean';document.getElementById('stars').style.display=dark?'block':'none';document.querySelectorAll('input[name=theme]').forEach(r=>r.checked=r.value===th);}
function toggleTp(){document.getElementById('tp').classList.toggle('open');}
document.addEventListener('click',e=>{const r=document.querySelector('.theme-row');if(r&&!r.contains(e.target))document.getElementById('tp').classList.remove('open');});
(function(){const c=document.getElementById('stars');for(let i=0;i<100;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*2+.5;s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--dl:${Math.random()*5}s;opacity:${Math.random()*.5+.1}`;c.appendChild(s);}})();

function showToast(msg){const c=document.getElementById('tw');const t=document.createElement('div');t.className='toast';t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),2200);}
function confetti(){const cols=['#7c6cf8','#a78bfa','#f59e0b','#10b981','#ef4444','#3b82f6','#f472b6'];for(let i=0;i<60;i++){const el=document.createElement('div');el.className='cp';el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${cols[i%cols.length]};border-radius:${Math.random()>.5?'50%':'2px'};--dur:${1.5+Math.random()*1.5}s;--dl:${Math.random()*.8}s`;document.body.appendChild(el);setTimeout(()=>el.remove(),3000);}}
function triggerLU(){confetti();document.getElementById('lusp').textContent=SPRITES[Math.min(S.spriteIdx,SPRITES.length-1)];document.getElementById('lulv').textContent='Lv. '+S.level;document.getElementById('luname').textContent=LVNAMES[Math.min(S.level-1,LVNAMES.length-1)];document.getElementById('luov').classList.add('show');}
function closeLU(){document.getElementById('luov').classList.remove('show');}
function openOv(id){document.getElementById(id).classList.add('show');}
function closeOv(id){document.getElementById(id).classList.remove('show');}
function openNameModal(){document.getElementById('nameinp').value=S.charName;openOv('nameov');setTimeout(()=>document.getElementById('nameinp').select(),50);}
function saveName(){const v=document.getElementById('nameinp').value.trim().toUpperCase();if(v){S.charName=v;save();updateStats();}closeOv('nameov');}
document.getElementById('nameinp').addEventListener('keydown',e=>{if(e.key==='Enter')saveName();});
function cycleSpr(){S.spriteIdx=(S.spriteIdx+1)%SPRITES.length;save();updateStats();const el=document.getElementById('spr');el.style.transform='scale(1.3) rotate(15deg)';setTimeout(()=>el.style.transform='',200);}

// stat edit

function doImport(){const txt=document.getElementById('expta').value.trim();if(!txt){showToast('❌ 请先粘贴备份数据');return;}try{const p=JSON.parse(txt);if(!p.tasks)throw 0;S=p;S.tasks=S.tasks.map(t=>mkTask(t));if(!S.quadFilters)S.quadFilters=[];if(!S.catFilter)S.catFilter='';if(!S.categories)S.categories=[...DEF_CATS];if(!S.shopItems)S.shopItems=[];if(!S.ledger)S.ledger=[];if(!S.dailySummaries)S.dailySummaries=[];save();setTheme(S.theme||'theme-light');buildCatUI();updateStats();render();showToast('✅ 导入成功！');closeOv('expov');}catch(e){showToast('❌ 数据格式错误');}}

function exportTxt(range){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),d=now.getDate();
  const lbl={day:'今日',month:'本月',year:'本年'}[range];
  const inRange=ts=>{if(!ts)return false;const dt=new Date(ts);if(range==='day')return dt.getFullYear()===y&&dt.getMonth()===m&&dt.getDate()===d;if(range==='month')return dt.getFullYear()===y&&dt.getMonth()===m;return dt.getFullYear()===y;};
  let txt=`Quest Log — ${lbl}总结\n生成时间：${now.toLocaleString('zh-CN')}\n${'='.repeat(40)}\n\n`;
  // tasks
  txt+=`【任务清单】\n`;
  S.tasks.forEach(t=>{txt+=`${t.done?'[✓]':'[ ]'} ${t.mustdo?'❗ ':''}${t.name}  [${TYPELBL[t.type]||t.type}][${t.cat||'无分类'}][${DIFFLBL[t.diff]}]${t.count>0?' 计数:'+t.count+(t.counterUnit||''):''}${t.doneTime?' 完成:'+t.doneTime:''}\n`;});
  // done list
  const dl=S.doneList.filter(e=>inRange(e.ts));
  txt+=`\n【${lbl}完成记录（${dl.length}项）】\n`;
  dl.forEach((e,i)=>{txt+=`${i+1}. ${e.name}  ${e.time||''}  +${e.xp}XP +${e.gold}金\n`;});
  // summaries
  const sums=S.dailySummaries.filter(s=>inRange(s.ts));
  if(sums.length){txt+=`\n【日记总结】\n`;sums.forEach(s=>{txt+=`--- ${s.date} ---\n${s.text}\n\n`;});}
  txt+=`\n总计完成: ${dl.length} 项\n`;
  const a=document.createElement('a');a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);a.download=`questlog_${range}_${now.toISOString().slice(0,10)}.txt`;a.click();showToast(`✅ ${lbl}总结已导出`);
}

// steps
function addStep(tid){const inp=document.getElementById('sinp-'+tid);const name=inp?inp.value.trim():'';if(!name)return;const t=S.tasks.find(x=>x.id===tid);if(!t)return;if(!t.steps)t.steps=[];t.steps.push({id:S.nextStepId++,name,done:false});inp.value='';save();render();}
function toggleStep(tid,sid){const t=S.tasks.find(x=>x.id===tid);if(!t)return;const s=(t.steps||[]).find(x=>x.id===sid);if(s)s.done=!s.done;save();render();}
function deleteStep(tid,sid){const t=S.tasks.find(x=>x.id===tid);if(!t)return;t.steps=t.steps.filter(x=>x.id!==sid);save();render();}
function toggleMinReqDone(tid){const t=S.tasks.find(x=>x.id===tid);if(!t||t.done)return;t.minReqDone=!t.minReqDone;save();render();}
function toggleSteps(tid){if(collapsedSteps.has(tid))collapsedSteps.delete(tid);else collapsedSteps.add(tid);render();}

// counter
function bump(tid,delta){const t=S.tasks.find(x=>x.id===tid);if(!t)return;const inp=document.getElementById('csi-'+tid);const step=inp?Math.max(1,parseInt(inp.value)||1):1;t.count=Math.max(0,t.count+(delta>0?step:-step));if(t.minReq>0&&t.count>=t.minReq&&!t.minReqDone)t.minReqDone=true;if(t.counterGoal>0&&t.count>=t.counterGoal&&!t.done){t.done=true;t.doneTime=nowStr();gainRewards(t,tid);}save();render();}

// complete/undo/fail/delete
function completeTask(id){const t=S.tasks.find(x=>x.id===id);if(!t||t.done)return;pushUndo(t);t.done=true;t.doneTime=nowStr();gainRewards(t,id);save();render();}
function undoTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;const idx=S.undoStack.findIndex(u=>u.id===id);if(idx>-1){const snap=S.undoStack.splice(idx,1)[0];Object.assign(t,snap);}else{t.done=false;t.doneTime='';t.minReqDone=false;}const xp=Math.round((XPMAP[t.diff]||10)*(QUADXP[t.quad]||1));const gold=GOLDMAP[t.diff]||8;S.xp=Math.max(0,S.xp-xp);S.gold=Math.max(0,S.gold-gold);addLedger('xp',-xp,'撤销: '+t.name);addLedger('gold',-gold,'撤销: '+t.name);S.doneList=S.doneList.filter(d=>d.taskId!==id);updateStats();save();render();showToast('↩ 已恢复到未完成');}
function pushUndo(t){S.undoStack.push(JSON.parse(JSON.stringify(t)));if(S.undoStack.length>40)S.undoStack.shift();}
function failTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;pushUndo(t);S.hp=Math.max(0,S.hp-10);addLedger('hp',-10,'放弃: '+t.name);t.done=true;t.doneTime=nowStr();if(S.hp===0)showToast('💀 HP归零！');else showToast('💔 任务失败 -10 HP');save();updateStats();render();}
function deleteTask(id){if(!confirm('确定删除？'))return;S.tasks=S.tasks.filter(x=>x.id!==id);save();render();}
function gainRewards(t,id,silent=false){
  const xp=Math.round((XPMAP[t.diff]||10)*(QUADXP[t.quad]||1));const gold=GOLDMAP[t.diff]||8;
  S.xp+=xp;S.gold+=gold;
  addLedger('xp',xp,'完成: '+t.name);addLedger('gold',gold,'完成: '+t.name);
  S.doneList.unshift({id:'d'+Date.now(),taskId:id,name:t.name,xp,gold,diff:t.diff,cat:t.cat,time:nowStr(),ts:Date.now()});
  if(S.doneList.length>300)S.doneList=S.doneList.slice(0,300);
  let leveled=false;while(S.xp>=S.maxXp){S.xp-=S.maxXp;S.level++;S.maxXp=Math.round(S.maxXp*1.4);S.maxHp+=20;S.hp=S.maxHp;leveled=true;}
  if(leveled)triggerLU();else if(!silent)showToast('+'+xp+' XP  +'+gold+' 金币');
  flashTask(id);save();updateStats();
}
function flashTask(id){const el=document.querySelector(`[data-id="${id}"]`);if(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}}
function nowStr(){return new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}

// shop
function addShopItem(){
  const name=document.getElementById('shop-name').value.trim();const cost=parseInt(document.getElementById('shop-cost').value)||0;

  S.shopItems.push({id:'s'+Date.now(),name,cost,bought:false});
  document.getElementById('shop-name').value='';document.getElementById('shop-cost').value='';
  save();render();

function buyShopItem(id){
  const item=S.shopItems.find(x=>x.id===id);if(!item||item.bought)return;
  if(S.gold<item.cost){showToast('❌ 金币不足！还差'+(item.cost-S.gold)+'金币');return;}
  if(!confirm('花费 '+item.cost+' 金币购买"'+item.name+'"？'))return;
  S.gold-=item.cost;addLedger('gold',-item.cost,'购买: '+item.name);
  item.bought=true;
  S.doneList.unshift({id:'d'+Date.now(),name:'🛒 购买：'+item.name,xp:0,gold:-item.cost,diff:'easy',cat:'生活',time:nowStr(),ts:Date.now()});
  updateStats();save();render();showToast('🎉 购买成功！-'+item.cost+' 金币');confetti();
}

    // daily summaries section
    if(S.dailySummaries.length){
      h+=`<div class="sdiv">📝 日记总结</div>`;
      S.dailySummaries.slice(0,10).forEach(s=>{h+=`<div style="padding:9px 12px;border-radius:9px;border:1px solid var(--brd);background:var(--card);margin-bottom:5px"><div style="font-size:11px;color:var(--acc2);margin-bottom:4px">${s.date}</div><div style="font-size:13px;color:var(--text2);line-height:1.5">${s.text}</div></div>`;});
    }
    h+=`<div class="sdiv">📊 变动记录</div>`;
    const filtered=S.ledger.filter(e=>!S.logFilter||e.type===S.logFilter);
    if(!filtered.length){h+='<div class="empty">暂无记录</div>';}
    else filtered.slice(0,100).forEach(e=>{
      const icons={xp:'✨',gold:'🪙',hp:'❤️'};
      h+=`<div class="log-entry"><span class="le-icon">${icons[e.type]||'•'}</span><span class="le-desc">${e.desc||''}</span><span class="le-val ${e.delta>=0?'pos':'neg'}">${e.delta>=0?'+':''}${e.delta}</span><span class="le-time">${e.time||''}</span></div>`;
    });
    list.innerHTML=h;return;
  }

  if(S.activeTab==='donelist'){
    let h=`<div style="display:flex;gap:7px;margin-bottom:8px;flex-wrap:wrap">
      <input type="text" id="dename" placeholder="手动添加完成项目..." onkeydown="if(event.key==='Enter')addDoneEntry()" style="flex:2;min-width:120px;padding:7px 10px;border-radius:8px;border:1px solid var(--brd2);background:var(--card);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;outline:none">
      <select id="dediff" style="padding:6px 8px;height:33px;border-radius:8px;border:1px solid var(--brd2);background:var(--card);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;outline:none"><option value="trivial">无关紧要</option><option value="easy">简单</option><option value="medium" selected>中等</option><option value="hard">困难</option></select>
      <select id="decat" style="padding:6px 8px;height:33px;border-radius:8px;border:1px solid var(--brd2);background:var(--card);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;outline:none"><option value="">无分类</option>${S.categories.map(c=>`<option value="${c.id}">${c.label}</option>`).join('')}</select>
      <button class="abtn" onclick="addDoneEntry()">+ 添加</button>
    </div>`;
    if(!S.doneList.length){h+='<div class="empty">还没有完成记录！</div>';}
    else S.doneList.forEach(d=>{
      const isOpen=expandedDone.has(d.id);
      const ts=d.ts?new Date(d.ts).toISOString().slice(0,16):'';
      h+=`<div style="border-radius:9px;border:1px solid var(--brd);background:var(--card);margin-bottom:4px;overflow:hidden">
        <div style="display:flex;align-items:center;gap:7px;padding:8px 11px;cursor:pointer" onclick="toggleDoneExpand('${d.id}')">
          <span style="color:var(--acc2);font-size:14px;flex-shrink:0">✓</span>
          <span style="flex:1;font-size:13px;text-decoration:line-through;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.name}</span>
          ${d.cat?`<span style="font-size:10px;padding:2px 6px;border-radius:999px;border:1px solid var(--brd2);color:var(--text2)">${d.cat}</span>`:''}
          <span style="font-size:8px;color:var(--acc2);font-family:'Press Start 2P',monospace;flex-shrink:0">${d.gold<0?d.gold+'🪙':'+'+d.xp+'xp'}</span>
          <span style="font-size:10px;color:var(--text3);flex-shrink:0">${d.time||''}</span>
          <span style="font-size:11px;color:var(--text3)">${isOpen?'▲':'▼'}</span>
        </div>
        ${isOpen?`<div style="padding:9px 11px 11px;border-top:1px solid var(--brd);background:var(--surf2)">
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:7px">
            <input type="text" id="den-${d.id}" value="${(d.name||'').replace(/"/g,'&quot;')}" style="flex:2;min-width:100px;padding:5px 8px;height:28px;border-radius:6px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;outline:none">
            <select id="ded-${d.id}" style="padding:0 8px;height:28px;border-radius:6px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;outline:none"><option value="trivial"${d.diff==='trivial'?' selected':''}>无关紧要</option><option value="easy"${d.diff==='easy'?' selected':''}>简单</option><option value="medium"${(d.diff||'medium')==='medium'?' selected':''}>中等</option><option value="hard"${d.diff==='hard'?' selected':''}>困难</option></select>
            <select id="dec-${d.id}" style="padding:0 8px;height:28px;border-radius:6px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;outline:none"><option value="">无分类</option>${S.categories.map(c=>`<option value="${c.id}"${d.cat===c.id?' selected':''}>${c.label}</option>`).join('')}</select>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
            <span style="font-size:11px;color:var(--text3)">完成时间:</span>
            <input type="datetime-local" id="det-${d.id}" value="${ts}" style="flex:1;min-width:150px;padding:5px 8px;height:28px;border-radius:6px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;outline:none">
            <button onclick="saveDoneEdit('${d.id}')" style="padding:5px 12px;height:28px;border-radius:6px;border:none;background:var(--acc);color:#fff;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600">保存</button>
            <button onclick="undoDoneEntry('${d.id}')" style="padding:5px 12px;height:28px;border-radius:6px;border:1px solid rgba(232,69,10,.3);background:transparent;color:#e8850a;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif">↩ 恢复</button>
          </div>
        </div>`:''}
      </div>`;
    });
    list.innerHTML=h;return;
  }

  let tasks=S.tasks.filter(t=>{
    if(S.activeTab==='mustdo')return t.mustdo&&!t.done;
    if(S.activeTab!=='all'&&t.type!==S.activeTab)return false;
    if(S.quadFilters.length>0&&!S.quadFilters.includes(t.quad))return false;
    if(S.catFilter&&t.cat!==S.catFilter)return false;
    return true;
  });
  if(!tasks.length){list.innerHTML='<div class="empty">没有任务，去添加一个吧！</div>';return;}
  const active=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done);
  let html='';active.forEach(t=>html+=taskHtml(t));
  if(done.length){html+='<div class="sdiv">今日已完成</div>';done.forEach(t=>html+=taskHtml(t));}
  list.innerHTML=html;
  document.querySelectorAll('[data-q]').forEach(el=>el.classList.toggle('inactive',S.quadFilters.length>0&&!S.quadFilters.includes(el.dataset.q)));
}
function setLogFilter(f){S.logFilter=f;save();render();}

function taskHtml(t){
  const dl=fmtDL(t.deadline);
  const hasC=t.counterGoal>0||t.count>0;
  const pct=t.counterGoal>0?Math.round(t.count/t.counterGoal*100):0;
  const sc=(t.steps||[]).length,sd=(t.steps||[]).filter(s=>s.done).length;
  const isE=editingId===t.id,isSel=bulkSel.has(t.id);
  const unit=t.counterUnit||'次';
  const meta=`<div class="tmeta">
    ${hasC?`<span class="bdg bdg-type">${t.count}${t.counterGoal>0?'/'+t.counterGoal:''} ${unit}</span>`:''}
    ${t.cat?`<span class="bdg bdg-cat">${t.cat}</span>`:''}
    <span class="bdg-diff ${t.diff}">${DIFFLBL[t.diff]}</span>
    ${t.minReq>0?`<span class="bdg-req">${t.minReqDesc||'最低'+t.minReq+t.minReqUnit}</span>`:''}
    ${dl?`<span class="bdg bdg-dl${dl.urg?' urg':''}">${dl.text}</span>`:''}
    ${sc>0?`<span class="bdg bdg-type">📋${sd}/${sc}</span>`:''}
  </div>`;
  const acts=`<div class="tact">
    ${!t.done?`<button class="ibtn ok" onclick="completeTask(${t.id})" title="完成">✓</button>`:''}
    ${t.done?`<button class="ibtn" style="color:#e8a020;font-size:15px" onclick="undoTask(${t.id})" title="恢复未完成">↩</button>`:''}
    ${!t.done&&(t.type==='daily'||t.type==='todo'||t.mustdo)?`<button class="ibtn bad" onclick="failTask(${t.id})" title="放弃扣血">✗</button>`:''}
    <button class="ibtn${isE?' edon':''}" onclick="toggleEdit(${t.id})" title="编辑">✎</button>
    <button class="ibtn bad" onclick="deleteTask(${t.id})" title="删除">🗑</button>
  </div>`;
  let chtml='';
  if(hasC){chtml=`<div class="crow"><button class="cbtn" onclick="bump(${t.id},-1)">−</button><input class="cstep" type="number" id="csi-${t.id}" value="1" min="1" max="9999"><button class="cbtn" onclick="bump(${t.id},1)">+</button>${t.counterGoal>0?`<div class="ctrack"><div class="cfill" style="width:${Math.min(100,pct)}%"></div></div><span class="ctxt">${t.count}/${t.counterGoal} ${unit} (${pct}%)</span>`:`<span class="ctxt">已 ${t.count} ${unit}</span>`}</div>`;}
  let shtml='';
  if(sc>0||isE||t.minReqDesc||t.minReq>0){
    const mrRow=(t.minReqDesc||t.minReq>0)?`<div style="display:flex;align-items:center;gap:6px;padding:5px 8px;margin-bottom:5px;border-radius:7px;border:1px solid rgba(232,69,10,.3);background:rgba(232,69,10,.06)">
      <div onclick="toggleMinReqDone(${t.id})" style="width:15px;height:15px;border-radius:4px;border:1px solid rgba(232,69,10,.5);background:${t.minReqDone?'#e8450a':'transparent'};cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;flex-shrink:0">${t.minReqDone?'✓':''}</div>
      <span style="font-size:10px;color:#e8850a;font-weight:700;white-space:nowrap">❗最低限度</span>
      <span style="font-size:12px;color:var(--text);${t.minReqDone?'text-decoration:line-through;color:var(--text3)':''}">${t.minReqDesc||''}${t.minReq>0?' ('+t.minReq+' '+(t.minReqUnit||'次')+')':''}</span>
    </div>`:'';
    const items=(t.steps||[]).map(s=>`<div class="sitem"><div class="schk${s.done?' chked':''}" onclick="toggleStep(${t.id},${s.id})">${s.done?'✓':''}</div><span class="sname${s.done?' done':''}">${s.name}</span><button class="sdel" onclick="deleteStep(${t.id},${s.id})">×</button></div>`).join('');
    shtml=`<div class="srow">${mrRow}${items}<div class="sarow"><input type="text" id="sinp-${t.id}" placeholder="添加小步骤..." onkeydown="if(event.key==='Enter')addStep(${t.id})"><button class="sabtn" onclick="addStep(${t.id})">+ 步骤</button></div></div>`;
  }
  let ehtml='';
  if(isE){
    const esc=s=>(s||'').replace(/"/g,'&quot;');
    const qo=['red','yellow','blue','green'].map(q=>`<option value="${q}"${t.quad===q?' selected':''}>${{red:'🔴红',yellow:'🟡黄',blue:'🔵蓝',green:'🟢绿'}[q]}</option>`).join('');
    const dfo=['trivial','easy','medium','hard'].map(d=>`<option value="${d}"${t.diff===d?' selected':''}>${DIFFLBL[d]}</option>`).join('');
    const co=['','...cats...'].join('');
    const tyo=['todo','habit','daily','archive'].map(x=>`<option value="${x}"${t.type===x?' selected':''}>${TYPELBL[x]}</option>`).join('');
    const catOpts=S.categories.map(c=>`<option value="${c.id}"${t.cat===c.id?' selected':''}>${c.label}</option>`).join('');
    ehtml=`<div class="erow">
      <input type="text" id="en-${t.id}" value="${esc(t.name)}" placeholder="任务名称" style="flex:2;min-width:100px">
      <select id="ety-${t.id}">${tyo}</select>
      <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap"><input type="checkbox" id="emd-${t.id}"${t.mustdo?' checked':''} style="accent-color:#e8450a;width:14px;height:14px"> ❗必做</label>
      <select id="eq-${t.id}">${qo}</select><select id="ed-${t.id}">${dfo}</select>
      <select id="ec-${t.id}"><option value="">无分类</option>${catOpts}</select>
      <input type="date" id="edl-${t.id}" value="${t.deadline||''}">
    </div>
    <div class="erow">
      <span class="elbl">计数:</span><input type="number" id="ego-${t.id}" value="${t.counterGoal||''}" placeholder="目标" min="0" style="width:58px"><input type="text" id="egou-${t.id}" value="${esc(t.counterUnit||'次')}" placeholder="单位" style="width:44px">
      <span class="elbl" style="margin-left:6px">❗最低:</span><input type="text" id="ereqd-${t.id}" value="${esc(t.minReqDesc)}" placeholder="说明" style="flex:1;min-width:70px"><input type="number" id="ereq-${t.id}" value="${t.minReq||''}" placeholder="量" min="0" style="width:50px"><input type="text" id="erequ-${t.id}" value="${esc(t.minReqUnit||'次')}" placeholder="单位" style="width:44px">
      <button class="esave" onclick="saveEdit(${t.id})">保存</button><button class="ecancel" onclick="toggleEdit(${t.id})">取消</button>
    </div>`;
  }
  return`<div class="titem${t.done?' donefade':''}${t.mustdo?' mustdo-item':''}${isSel?' selected':''}" data-id="${t.id}">
    <div class="tmain">
      <div class="chkbox${isSel?' chked':''}" onclick="toggleBulk(${t.id})">${isSel?'✓':''}</div>
      <div class="qdot ${t.quad}"></div>
      <div style="flex:1;min-width:0">
        <span class="tname${t.done?' donetext':''}" onclick="toggleSteps(${t.id})" title="点击折叠步骤">${t.mustdo?'❗ ':''}${t.name}</span>
        ${t.minReqDone&&!t.done?'<div class="tname-sub">✅ 已完成最低限度要求</div>':''}
        ${t.done&&t.doneTime?'<div class="tdonetime">'+t.doneTime+'</div>':''}
      </div>
      ${meta}${acts}
    </div>
    ${chtml}${collapsedSteps.has(t.id)?'':shtml}${ehtml}
  </div>`;
}

// init
setTheme(S.theme||'theme-light');
buildCatUI();
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===S.activeTab));
const _hf=S.activeTab==='donelist'||S.activeTab==='shop'||S.activeTab==='log';
document.getElementById('afw').style.display=_hf?'none':'block';
document.querySelectorAll('.catf').forEach(el=>el.classList.toggle('active',el.dataset.cat===(S.catFilter||'')));
updateStats();render();
</script>
</body>
</html>
