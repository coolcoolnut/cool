trigger${t.deadline?'':' empty'}\" id=\"edl-${t.id}-btn\" data-cal-target=\"edl-${t.id}\" data-noi18n onclick=\"openCal('edl-${t.id}','edl-${t.id}-btn')\">${fmtCalLabel(t.deadline||'')}<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"erow\">\n      <span class=\"elbl\">🔄重复:<\u002Fspan>\n      <select id=\"erecur-${t.id}\" onchange=\"updateRecurUI(${t.id})\">${reo}<\u002Fselect>\n      <div id=\"erecur-days-${t.id}\" style=\"display:${(t.recur==='weekly'||t.recur==='biweekly')?'flex':'none'};gap:2px;align-items:center;flex-wrap:wrap\">\n        <span class=\"elbl\">周:<\u002Fspan>${['日','一','二','三','四','五','六'].map((d,i)=>`<button type=\"button\" class=\"day-btn${(t.recurDays||[]).includes(i)?' on':''}\" data-eid=\"${t.id}\" data-d=\"${i}\" onclick=\"this.classList.toggle('on')\" style=\"width:25px;height:25px;font-size:10px\">${d}<\u002Fbutton>`).join('')}\n      <\u002Fdiv>\n      <div id=\"erecur-mday-${t.id}\" style=\"display:${t.recur==='monthly'?'flex':'none'};align-items:center;gap:4px\">\n        <span class=\"elbl\">每月:<\u002Fspan>\n        <select id=\"erecur-md-${t.id}\" style=\"height:26px;padding:2px 5px;border-radius:6px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-size:11px;outline:none\">${Array.from({length:31},(_,i)=>`<option value=\"${i+1}\"${(t.recurMonthDay||1)===i+1?' selected':''  }>${i+1}日<\u002Foption>`).join('')}<\u002Fselect>\n      <\u002Fdiv>\n      <div id=\"erecur-yearly-${t.id}\" style=\"display:${t.recur==='yearly'?'flex':'none'};align-items:center;gap:4px;flex-wrap:wrap\">\n        <span class=\"elbl\">每年:<\u002Fspan>\n        <select id=\"erecur-ym-${t.id}\" style=\"height:26px;padding:2px 5px;border-radius:6px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-size:11px;outline:none\">${Array.from({length:12},(_,i)=>`<option value=\"${i+1}\"${(t.recurMonth||1)===i+1?' selected':''}>${i+1}月<\u002Foption>`).join('')}<\u002Fselect>\n        <input type=\"number\" id=\"erecur-yd-${t.id}\" value=\"${t.recurDay||1}\" min=\"1\" max=\"31\" style=\"width:46px;height:26px;padding:2px 5px;border-radius:6px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-size:11px;outline:none\"><span class=\"elbl\">日<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"erow\">\n      <span class=\"elbl\">计数:<\u002Fspan><input type=\"number\" id=\"ego-${t.id}\" value=\"${t.counterGoal||''}\" placeholder=\"目标\" min=\"0\" style=\"width:56px\"><input type=\"text\" id=\"egou-${t.id}\" value=\"${esc(t.counterUnit||'次')}\" placeholder=\"单位\" style=\"width:42px\">\n      <span class=\"elbl\">❗最低:<\u002Fspan><input type=\"text\" id=\"ereqd-${t.id}\" value=\"${esc(t.minReqDesc)}\" placeholder=\"说明\" style=\"flex:1;min-width:60px\"><input type=\"number\" id=\"ereq-${t.id}\" value=\"${t.minReq||''}\" placeholder=\"量\" min=\"0\" style=\"width:48px\"><input type=\"text\" id=\"erequ-${t.id}\" value=\"${esc(t.minReqUnit||'次')}\" placeholder=\"单位\" style=\"width:42px\">\n      <button class=\"esave\" onclick=\"saveEdit(${t.id})\">保存<\u002Fbutton><button class=\"ecancel\" onclick=\"toggleEdit(${t.id})\">取消<\u002Fbutton><button class=\"hbtn\" onclick=\"quickAddReminder(${t.id})\" title=\"添加提醒\" style=\"height:27px;padding:0 8px;font-size:11px\">🔔+<\u002Fbutton>\n    <\u002Fdiv>`;\n  }\n\n  return`<div class=\"titem${t.done?' donefade':''}${t.mustdo?' mustdo-item':''}${t.recur&&!t.mustdo?' recur-item':''}${isSel?' selected':''}\" data-id=\"${t.id}\"\n    draggable=\"true\"\n    ondragstart=\"taskDragStart(event,${t.id})\"\n    ondragover=\"taskDragOver(event,${t.id})\"\n    ondrop=\"taskDrop(event,${t.id})\"\n    ondragleave=\"this.classList.remove('drag-over-task')\"\n    ondragend=\"document.querySelectorAll('.titem').forEach(el=>el.classList.remove('drag-over-task','drag-task'))\">\n    <div class=\"tmain\">\n      <div class=\"drag-handle\" title=\"拖动排序\">⠿<\u002Fdiv>\n      ${multiselect?`<div class=\"chkbox${isSel?' chked':''}\" onclick=\"toggleBulk(${t.id})\">${isSel?'✓':''}<\u002Fdiv>`:''}\n      <div class=\"qdot ${t.quad}\"><\u002Fdiv>\n      <div class=\"tname-wrap\">\n        <span class=\"tname${t.done?' donetext':''}\" onclick=\"toggleSteps(${t.id})\" title=\"${(hasSub||stepsOpen)?'点击展开/收起':''}\">${(hasSub||stepsOpen)?`<span class=\"step-caret\">${stepsOpen?'▾':'▸'}<\u002Fspan>`:''}${t.mustdo?'❗ ':''}${t.name}<\u002Fspan>\n        ${t.minReqDone&&!t.done?'<div class=\"tname-sub\">✅ 已完成最低限度要求<\u002Fdiv>':''}\n        ${t.recur?`<div class=\"recur-badge\">🔄 ${recurLabel}<\u002Fdiv>`:''}\n        ${t.done&&t.doneTime?`<div class=\"tdonetime\">${t.doneTime}<\u002Fdiv>`:''}\n      <\u002Fdiv>\n      ${meta}${acts}\n    <\u002Fdiv>\n    ${chtml}${(expandedSteps.has(t.id)||isE)?shtml:''}${ehtml}\n  <\u002Fdiv>`;\n}\n\n\n\n// ── Pomodoro Timer ──\nlet pomoState={running:false,mins:25,secs:0,totalSecs:1500,elapsed:0,taskId:null,taskName:'',count:1,phase:'focus',interval:null,overtime:false,overtimeSecs:0,startTs:null,overtimeLabel:'再干1分钟'};\nconst POMO_CIRCUMFERENCE=427;\n\nfunction openPomo(taskId,taskName,suggestedMins){\n  pomoState.taskId=taskId||null;\n  pomoState.taskName=taskName||'自由专注';\n  // Use task's saved pomoMins if available\n  const t=taskId?S.tasks.find(x=>x.id===taskId):null;\n  const mins=t?t.pomoMins:(suggestedMins||25);\n  // Set custom duration UI\n  const durSel=document.getElementById('pomo-duration');\n  if(durSel){\n    // Check if value matches an option, otherwise set custom\n    const hasOpt=[...durSel.options].some(o=>parseInt(o.value)===mins);\n    if(!hasOpt){\n      const opt=document.createElement('option');opt.value=mins;opt.textContent=mins+' 分钟';durSel.appendChild(opt);\n    }\n    durSel.value=mins;\n  }\n  setPomoMins(mins);\n  resetPomo();\n  document.getElementById('pomo-task-name').textContent=pomoState.taskName;\n  document.getElementById('pomo-done-msg').style.display='none';\n  // Show per-task custom time setting if task exists\n  const cusEl=document.getElementById('pomo-custom-mins');\n  if(cusEl)cusEl.value=mins;\n  openOv('pomoov');\n}\nfunction setPomoMins(m){\n  if(pomoState.running)return;\n  const mins=parseInt(m)||25;\n  pomoState.mins=mins;pomoState.totalSecs=mins*60;pomoState.elapsed=0;pomoState.overtime=false;pomoState.overtimeSecs=0;\n  // Save to task\n  if(pomoState.taskId){const t=S.tasks.find(x=>x.id===pomoState.taskId);if(t){t.pomoMins=mins;save();}}\n  updatePomoDisplay();\n}\nfunction setCustomPomoMins(){\n  const v=parseInt(document.getElementById('pomo-custom-mins').value);\n  if(!v||v<1||v>999)return;\n  const durSel=document.getElementById('pomo-duration');\n  if(durSel){\n    const hasOpt=[...durSel.options].some(o=>parseInt(o.value)===v);\n    if(!hasOpt){const opt=document.createElement('option');opt.value=v;opt.textContent=v+' 分钟';durSel.appendChild(opt);}\n    durSel.value=v;\n  }\n  setPomoMins(v);\n  showToast('⏱ 计时设为 '+v+' 分钟');\n}\nfunction updatePomoDisplay(){\n  let dispM,dispS,pct;\n  if(pomoState.overtime){\n    dispM=Math.floor(pomoState.overtimeSecs/60);dispS=pomoState.overtimeSecs%60;pct=1;\n    document.getElementById('pomo-display').textContent='+'+String(dispM).padStart(2,'0')+':'+String(dispS).padStart(2,'0');\n    document.getElementById('pomo-ring').style.stroke='#52c97a';\n  } else {\n    const remaining=pomoState.totalSecs-pomoState.elapsed;\n    dispM=Math.floor(remaining/60);dispS=remaining%60;pct=pomoState.elapsed/pomoState.totalSecs;\n    document.getElementById('pomo-display').textContent=String(dispM).padStart(2,'0')+':'+String(dispS).padStart(2,'0');\n    document.getElementById('pomo-ring').style.stroke='var(--acc)';\n  }\n  document.getElementById('pomo-ring').style.strokeDashoffset=POMO_CIRCUMFERENCE*pct;\n  const phaseEl=document.getElementById('pomo-phase');\n  if(phaseEl&&!phaseEl.querySelector('input')){\n    phaseEl.textContent=pomoState.overtime?(pomoState.overtimeLabel||'再干1分钟'):pomoState.phase==='focus'?'专注时间':'休息时间';\n  }\n  document.getElementById('pomo-count').textContent=pomoState.count;\n}\nfunction togglePomo(){\n  if(pomoState.running){\n    clearInterval(pomoState.interval);pomoState.running=false;\n    document.getElementById('pomo-start-btn').textContent=pomoState.overtime?'▶ 继续':'▶ 继续';\n  } else {\n    if(!pomoState.startTs)pomoState.startTs=Date.now();\n    pomoState.running=true;\n    document.getElementById('pomo-start-btn').textContent='⏸ 暂停';\n    pomoState.interval=setInterval(()=>{\n      if(pomoState.overtime){\n        pomoState.overtimeSecs++;\n        updatePomoDisplay();\n        return;\n      }\n      pomoState.elapsed++;\n      if(pomoState.elapsed>=pomoState.totalSecs){\n        // Countdown done — start overtime counting\n        pomoState.overtime=true;pomoState.overtimeSecs=0;\n        pomoState.count++;\n        document.getElementById('pomo-done-msg').style.display='block';\n        document.getElementById('pomo-start-btn').textContent='⏸ 暂停';\n        // Countdown finished — reward XP/gold now, but DON'T write the log yet\n        // The log will be written with full time (set+overtime) when user hits ✓结束 or closes\n        pomoState.sessionLogged=false; // mark: final log not yet written\n        if(pomoState.taskId){\n          const t=S.tasks.find(x=>x.id===pomoState.taskId);\n          if(t&&!t.done){addLedger('xp',5,'番茄完成: '+t.name);S.xp+=5;addLedger('gold',3,'番茄完成');S.gold+=3;updateStats();save();}\n        }\n        showToast('🍅 番茄完成！继续计时中，点「✓结束」保存总时长');\n        if(Notification.permission==='granted')new Notification('🍅 专注完成！',{body:pomoState.taskName+' — 继续计时中，点结束保存',icon:''});\n        return;\n      }\n      updatePomoDisplay();\n    },1000);\n  }\n}\nfunction editPomoPhaseLabel(){\n  if(!pomoState.overtime)return;\n  const el=document.getElementById('pomo-phase');\n  if(!el||el.querySelector('input'))return;\n  const cur=pomoState.overtimeLabel||'再干1分钟';\n  el.innerHTML='';\n  const inp=document.createElement('input');\n  inp.value=cur;inp.style.cssText=\"width:120px;padding:2px 6px;border-radius:6px;border:1px solid var(--acc);background:var(--inp);color:var(--text);font-family:'Nunito',sans-serif;font-size:13px;text-align:center;outline:none\";\n  inp.onblur=()=>{pomoState.overtimeLabel=inp.value.trim()||'再干1分钟';updatePomoDisplay();};\n  inp.onkeydown=e=>{if(e.key==='Enter'||e.key==='Escape')inp.blur();};\n  el.appendChild(inp);\n  setTimeout(()=>inp.focus(),10);\n}\n\nfunction finishPomoSession(){\n  clearInterval(pomoState.interval);pomoState.running=false;\n  // Write the final log with complete time (set mins + any overtime)\n  if(pomoState.taskId&&!pomoState.sessionLogged){\n    const t=S.tasks.find(x=>x.id===pomoState.taskId);\n    if(t){\n      if(!t.pomoLogs)t.pomoLogs=[];\n      const totalSecs=pomoState.totalSecs+(pomoState.overtime?pomoState.overtimeSecs:pomoState.elapsed);\n      t.pomoLogs.unshift({ts:Date.now(),time:nowStr(),setMins:pomoState.mins,totalSecs});\n      if(t.pomoLogs.length>100)t.pomoLogs=t.pomoLogs.slice(0,100);\n      pomoState.sessionLogged=true;\n      save();showToast('🍅 共专注 '+Math.floor(totalSecs/60)+'分'+totalSecs%60+'秒');\n    }\n  }\n  resetPomo();\n}\nfunction resetPomo(){\n  clearInterval(pomoState.interval);pomoState.running=false;pomoState.elapsed=0;pomoState.overtime=false;pomoState.overtimeSecs=0;pomoState.startTs=null;pomoState.sessionLogged=false;\n  document.getElementById('pomo-start-btn').textContent='▶ 开始';\n  document.getElementById('pomo-done-msg').style.display='none';\n  document.getElementById('pomo-ring').style.stroke='var(--acc)';\n  updatePomoDisplay();\n}\nfunction stopPomoAndClose(){\n  if(pomoState.elapsed>5||pomoState.overtime){finishPomoSession();}\n  else{clearInterval(pomoState.interval);pomoState.running=false;}\n  closeOv('pomoov');\n}\n// ── Notification / Reminder system ──\n// Request permission immediately, and again on user action\nfunction ensureNotifPermission(cb){\n  if(typeof Notification==='undefined'){if(cb)cb(false);return;}\n  if(Notification.permission==='granted'){if(cb)cb(true);return;}\n  Notification.requestPermission().then(p=>{if(cb)cb(p==='granted');});\n}\nensureNotifPermission(()=>{});\n\n// Scheduled reminders stored as [{id,taskId,taskName,time:'HH:MM',days:[],label,enabled}]\nif(!S.reminders)S.reminders=[];\nif(!S.todayCollapsed)S.todayCollapsed={mustdo:false,other:false,done:true};\nif(!S.doneGroupCollapsed)S.doneGroupCollapsed={};\nif(!S.tabDoneCollapsed)S.tabDoneCollapsed={section:false,today:false,past:true};\nif(!S.pwaIconColor)S.pwaIconColor='#ffffff';\nif(!S.pwaBgColor)S.pwaBgColor='#f5f4f0';\n\nlet _lastReminderMinute='';\nfunction checkReminders(){\n  const now=new Date();\n  const hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');\n  if(hhmm===_lastReminderMinute)return; // already checked this minute\n  _lastReminderMinute=hhmm;\n  const dow=now.getDay();\n  const matching=(S.reminders||[]).filter(r=>r.enabled&&r.time===hhmm&&(!r.days||!r.days.length||r.days.includes(dow)));\n  matching.forEach(r=>{\n    // Toast always works\n    showToast((S.lang==='en'?'⏰ Reminder: ':'⏰ 提醒：')+r.label+(r.taskName?' — '+r.taskName:''));\n    // Browser notification if permitted\n    if(typeof Notification!=='undefined'&&Notification.permission==='granted'){\n      try{\n        new Notification('⏰ '+r.label,{body:r.taskName||(S.lang==='en'?'GO AHEAD reminder':'GO AHEAD 提醒'),tag:'reminder-'+r.id,requireInteraction:false});\n      }catch(e){console.log('Notif error:',e);}\n    }\n  });\n}\n// Check every 10 seconds for better accuracy\nsetInterval(checkReminders,10000);\n// Also check when page becomes visible again\ndocument.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders();});\n\nfunction quickAddReminder(tid){\n  const t=S.tasks.find(x=>x.id===tid);if(!t)return;\n  // Default label = minReqDesc (without units) or task name\n  const defaultLabel=t.minReqDesc?t.minReqDesc.replace(/\\s*\\d+\\s*[一-龥]+$/,'').trim():t.name;\n  const time=prompt('设置提醒时间（HH:MM，如 08:30）：',new Date().toTimeString().slice(0,5));\n  if(!time||!/^\\d{2}:\\d{2}$/.test(time))return;\n  if(!S.reminders)S.reminders=[];\nif(!S.todayCollapsed)S.todayCollapsed={mustdo:false,other:false,done:true};\nif(!S.doneGroupCollapsed)S.doneGroupCollapsed={};\nif(!S.tabDoneCollapsed)S.tabDoneCollapsed={section:false,today:false,past:true};\nif(!S.pwaIconColor)S.pwaIconColor='#ffffff';\nif(!S.pwaBgColor)S.pwaBgColor='#f5f4f0';\n  S.reminders.push({id:'rem'+Date.now(),taskId:tid,taskName:t.name,time,label:defaultLabel,days:[],enabled:true});\n  save();showToast((S.lang==='en'?'⏰ Reminder set for ':'⏰ 提醒已设为 ')+time+'：'+defaultLabel);\n  ensureNotifPermission(granted=>{if(!granted)showToast(S.lang==='en'?'⚠️ Enable notifications on the 🔔 page':'⚠️ 请在🔔页面开启通知权限');});\n}\n\nfunction openRemindersModal(){\n  buildRemindersUI();\n  const en=S.lang==='en';\n  const intro=document.getElementById('reminder-intro');\n  if(intro)intro.innerHTML=en\n    ?'⏰ Reminders pop up <b>inside the app<\u002Fb> at the set time, as long as GO AHEAD is open. To also receive <b>system notifications<\u002Fb> in the background, tap “Enable notifications” below and add this app to your home screen.<br><span style=\"color:var(--text3)\">Note: nothing can be pushed after the app is fully closed. On iPhone, add to the home screen first.<\u002Fspan>'\n    :'⏰ 到点后提醒会<b>在 App 内<\u002Fb>弹出（只要 GO AHEAD 处于打开状态）。若想在后台也收到<b>系统通知<\u002Fb>，请点下方「开启系统通知」并把本应用「添加到主屏」。<br><span style=\"color:var(--text3)\">注意：完全关闭 App 后无法推送；iPhone 需先添加到主屏。<\u002Fspan>';\n  const pb=document.getElementById('notif-perm-btn');\n  if(pb)pb.textContent=en?'🔔 Enable notifications':'🔔 开启系统通知';\n  const ns=document.getElementById('notif-status');\n  if(ns){\n    if(typeof Notification==='undefined'){ns.textContent=en?'Not supported on this browser':'此浏览器不支持系统通知';ns.style.color='#e8850a';}\n    else{const map=en?{granted:'✅ On',denied:'❌ Blocked (enable in browser settings)',default:'⚠️ Not enabled yet'}:{granted:'✅ 已开启',denied:'❌ 已被拒绝（请在浏览器设置中开启）',default:'⚠️ 尚未开启'};ns.textContent=map[Notification.permission]||'';ns.style.color=Notification.permission==='granted'?'var(--acc2)':'#e8850a';}\n  }\n  openOv('reminderov');\n}\nfunction buildRemindersUI(){\n  const en=S.lang==='en';\n  const catOpts=S.categories.map(c=>`<option value=\"${c.id}\">${c.label}<\u002Foption>`).join('');\n  const taskOpts=S.tasks.filter(t=>!t.done).map(t=>`<option value=\"${t.id}\">${t.name.slice(0,30)}<\u002Foption>`).join('');\n  const WDS=en?['Su','Mo','Tu','We','Th','Fr','Sa']:['日','一','二','三','四','五','六'];\n  let h='';\n  (S.reminders||[]).forEach(r=>{\n    const days=WDS.map((d,i)=>`<span style=\"padding:2px 5px;border-radius:4px;background:${r.days.includes(i)?'var(--acc)':'var(--surf2)'};color:${r.days.includes(i)?'#fff':'var(--text3)'};font-size:10px;cursor:pointer\" onclick=\"toggleReminderDay('${r.id}',${i})\">${d}<\u002Fspan>`).join(' ');\n    h+=`<div style=\"padding:9px 11px;border-radius:10px;border:1px solid var(--brd);background:var(--card);margin-bottom:6px\">\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:5px\">\n        <span style=\"font-size:13px;flex:1;color:var(--text);font-weight:500\">${r.label}<\u002Fspan>\n        <span style=\"font-size:11px;color:var(--acc2)\">${r.time}<\u002Fspan>\n        <label style=\"display:flex;align-items:center;gap:3px;font-size:11px;cursor:pointer\"><input type=\"checkbox\" ${r.enabled?'checked':''} onchange=\"toggleReminder('${r.id}',this.checked)\" style=\"accent-color:var(--acc)\"> ${en?'On':'启用'}<\u002Flabel>\n        <button onclick=\"deleteReminder('${r.id}')\" style=\"border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:12px\">×<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size:11px;color:var(--text3);margin-bottom:5px\">${r.taskName||(en?'General reminder':'通用提醒')}<\u002Fdiv>\n      <div style=\"display:flex;gap:3px;flex-wrap:wrap\">${days}<\u002Fdiv>\n    <\u002Fdiv>`;\n  });\n  if(!h)h=`<div class=\"empty\" style=\"padding:16px\">${en?'No reminders yet — add one below':'还没有提醒，点下方添加'}<\u002Fdiv>`;\n  const el=document.getElementById('reminder-list');if(el)el.innerHTML=h;\n  const ts=document.getElementById('reminder-task');if(ts){ts.innerHTML=`<option value=\"\">${en?'General reminder':'通用提醒'}<\u002Foption>`+taskOpts;}\n}\nfunction addReminder(){\n  const time=document.getElementById('reminder-time')?.value;\n  const label=document.getElementById('reminder-label')?.value.trim();\n  const taskSel=document.getElementById('reminder-task');\n  const taskId=taskSel?parseInt(taskSel.value)||null:null;\n  const task=taskId?S.tasks.find(t=>t.id===taskId):null;\n  if(!time||!label)return showToast(S.lang==='en'?'Please enter a time and a reminder label':'请填写时间和提醒内容');\n  if(!S.reminders)S.reminders=[];\nif(!S.todayCollapsed)S.todayCollapsed={mustdo:false,other:false,done:true};\nif(!S.doneGroupCollapsed)S.doneGroupCollapsed={};\nif(!S.tabDoneCollapsed)S.tabDoneCollapsed={section:false,today:false,past:true};\nif(!S.pwaIconColor)S.pwaIconColor='#ffffff';\nif(!S.pwaBgColor)S.pwaBgColor='#f5f4f0';\n  S.reminders.push({id:'rem'+Date.now(),taskId,taskName:task?task.name:'',time,label,days:[],enabled:true});\n  document.getElementById('reminder-time').value='';\n  document.getElementById('reminder-label').value='';\n  save();buildRemindersUI();showToast(S.lang==='en'?'⏰ Reminder added':'⏰ 提醒已添加');\n}\nfunction toggleReminder(id,enabled){const r=(S.reminders||[]).find(x=>x.id===id);if(r){r.enabled=enabled;save();}}\nfunction deleteReminder(id){S.reminders=(S.reminders||[]).filter(x=>x.id!==id);save();buildRemindersUI();}\nfunction toggleReminderDay(id,day){\n  const r=(S.reminders||[]).find(x=>x.id===id);if(!r)return;\n  const idx=r.days.indexOf(day);if(idx>-1)r.days.splice(idx,1);else r.days.push(day);\n  save();buildRemindersUI();\n}\nfunction requestNotifPerm(){\n  const en=S.lang==='en';\n  if(typeof Notification==='undefined'){showToast(en?'❌ This browser doesn’t support notifications':'❌ 此浏览器不支持通知');return;}\n  ensureNotifPermission(granted=>{\n    showToast(granted?(en?'✅ Notifications on!':'✅ 通知已开启！'):(en?'❌ Blocked — enable it in your browser settings':'❌ 通知被拒绝，请在浏览器设置中手动开启'));\n    openRemindersModal();\n    if(granted)setTimeout(()=>{try{new Notification(en?'✅ GO AHEAD notification test':'✅ GO AHEAD 通知测试',{body:en?'Notifications work. Reminders will fire on time while the app is open.':'通知功能正常，提醒将在 App 打开时准时弹出'});}catch(e){}},500);\n  });\n}\n\n\n// ── Shop drag-to-reorder ──\nlet shopDragId=null;\nfunction shopDragStart(e,id){shopDragId=id;e.dataTransfer.effectAllowed='move';e.currentTarget.style.opacity='.4';}\nfunction shopDragOver(e,id){e.preventDefault();if(id!==shopDragId){e.currentTarget.classList.add('drag-over-task');}}\nfunction shopDrop(e,id){\n  e.preventDefault();\n  document.querySelectorAll('.shop-item').forEach(el=>{el.classList.remove('drag-over-task');el.style.opacity='';});\n  if(!shopDragId||shopDragId===id)return;\n  const fi=S.shopItems.findIndex(x=>x.id===shopDragId);\n  const ti=S.shopItems.findIndex(x=>x.id===id);\n  if(fi<0||ti<0)return;\n  const [m]=S.shopItems.splice(fi,1);\n  S.shopItems.splice(ti,0,m);\n  save();render();\n}\n\n// ── Task drag-to-reorder ──\nlet dragTaskId=null;\nfunction taskDragStart(e,id){dragTaskId=id;e.target.classList.add('drag-task');e.dataTransfer.effectAllowed='move';}\nfunction taskDragOver(e,id){e.preventDefault();if(id!==dragTaskId){e.currentTarget.classList.add('drag-over-task');}}\nfunction taskDrop(e,id){\n  e.preventDefault();e.currentTarget.classList.remove('drag-over-task');\n  if(!dragTaskId||dragTaskId===id)return;\n  const tab=S.activeTab;\n  const visIds=getVisibleTaskIds();\n  const fi=visIds.indexOf(dragTaskId),ti=visIds.indexOf(id);\n  if(fi<0||ti<0)return;\n  // apply reorder to S.tasks\n  const fromIdx=S.tasks.findIndex(x=>x.id===dragTaskId);\n  const toIdx=S.tasks.findIndex(x=>x.id===id);\n  if(fromIdx<0||toIdx<0)return;\n  const [moved]=S.tasks.splice(fromIdx,1);\n  S.tasks.splice(toIdx,0,moved);\n  save();render();\n}\nfunction getVisibleTaskIds(){\n  // Read the actually-rendered task list so this works for every tab\n  // (today / fragments / all / type tabs) without re-deriving each filter.\n  const dom=[...document.querySelectorAll('#tlist .titem[data-id]')]\n    .map(e=>parseInt(e.getAttribute('data-id'),10))\n    .filter(n=>!isNaN(n));\n  if(dom.length)return [...new Set(dom)];\n  // Fallback (e.g. called before first render)\n  return S.tasks.filter(t=>{\n    if(S.activeTab==='mustdo')return t.mustdo&&!t.done;\n    if(S.activeTab!=='all'&&S.activeTab!=='today'&&t.type!==S.activeTab)return false;\n    if(S.quadFilters.length>0&&!S.quadFilters.includes(t.quad))return false;\n    if(S.catFilter&&t.cat!==S.catFilter)return false;\n    return true;\n  }).map(t=>t.id);\n}\n\n// ── GitHub Gist Sync ──\nfunction openSyncModal(){\n  // Pre-fill saved credentials\n  const ti=document.getElementById('sync-token');\n  const gi=document.getElementById('sync-gist-id');\n  if(ti&&S.syncToken)ti.value=S.syncToken;\n  if(gi&&S.syncGistId)gi.value=S.syncGistId;\n\n  document.getElementById('sync-token').value=S.syncToken||'';\n  document.getElementById('sync-gist-id').value=S.syncGistId||'';\n  document.getElementById('sync-status').style.display='none';\n  openOv('syncov');\n}\nfunction setSyncStatus(msg,ok){\n  const el=document.getElementById('sync-status');\n  el.textContent=msg;el.style.color=ok?'var(--acc2)':'#ef9090';el.style.display='block';\n}\nasync function syncSave(){\n  const token=document.getElementById('sync-token').value.trim();\n  const gistId=document.getElementById('sync-gist-id').value.trim();\n  if(!token){setSyncStatus('❌ 请输入 GitHub Token',false);return;}\n  setSyncStatus('⏳ 推送中...',true);\n  S.syncToken=token;\n  const payload={files:{'goahead_data.json':{content:JSON.stringify(S,null,2)}},description:'GO AHEAD 数据备份',public:false};\n  try{\n    let url='https://api.github.com/gists',method='POST';\n    if(gistId){url='https://api.github.com/gists/'+gistId;method='PATCH';}\n    const res=await fetch(url,{method,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify(payload)});\n    if(!res.ok)throw new Error('HTTP '+res.status);\n    const data=await res.json();\n    S.syncGistId=data.id;document.getElementById('sync-gist-id').value=data.id;\n    save();setSyncStatus('✅ 推送成功！Gist ID: '+data.id,true);\n    showToast('☁️ 已同步到云端');\n  }catch(e){setSyncStatus('❌ 推送失败: '+e.message,false);}\n}\nasync function syncLoad(){\n  const token=document.getElementById('sync-token').value.trim();\n  const gistId=document.getElementById('sync-gist-id').value.trim();\n  if(!token){setSyncStatus('❌ 请输入 GitHub Token',false);return;}\n  if(!gistId){setSyncStatus('❌ 请输入 Gist ID（推送后自动填入）',false);return;}\n  setSyncStatus('⏳ 拉取中...',true);\n  try{\n    const res=await fetch('https://api.github.com/gists/'+gistId,{headers:{'Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'}});\n    if(!res.ok)throw new Error('HTTP '+res.status);\n    const data=await res.json();\n    const fileContent=data.files['goahead_data.json']?.content;\n    if(!fileContent)throw new Error('找不到备份文件');\n    const parsed=JSON.parse(fileContent);\n    if(!parsed.tasks)throw new Error('数据格式错误');\n    const keepToken=token,keepGistId=gistId;\n    S=parsed;S.tasks=S.tasks.map(t=>mkTask(t));\n    ['quadFilters','categories','tabOrder','tabLabels','shopItems','ledger','dailySummaries','trash'].forEach(k=>{if(!S[k])S[k]=defState()[k];});\n    if(!S.logFilter)S.logFilter='';\n    if(!S.logSubTab)S.logSubTab='diary';\n    if(!S.diaryEntries)S.diaryEntries=[];\n    if(!S.statPeriod)S.statPeriod='week';\n    if(!S.tabHidden)S.tabHidden=[];\n    if(!S.tabMode)S.tabMode='custom';\n    if(S.fontSize===undefined)S.fontSize=1;\nif(S.addFormOpen===undefined)S.addFormOpen=true;\nif(!S.reminders)S.reminders=[];\nif(!S.todayCollapsed)S.todayCollapsed={mustdo:false,other:false,done:true};\nif(!S.doneGroupCollapsed)S.doneGroupCollapsed={};\nif(!S.tabDoneCollapsed)S.tabDoneCollapsed={section:false,today:false,past:true};\nif(!S.pwaIconColor)S.pwaIconColor='#ffffff';\nif(!S.pwaBgColor)S.pwaBgColor='#f5f4f0';\n    S.tasks.forEach(t=>{if(t.fragCount===undefined)t.fragCount=0;if(t.fragTag===undefined)t.fragTag=false;if(!t.pomoMins)t.pomoMins=25;if(!t.pomoLogs)t.pomoLogs=[];if(!t.recurMonthDay)t.recurMonthDay=1;});\n    S.syncToken=keepToken;S.syncGistId=keepGistId;\n    save();setTheme(S.theme||'th-light');applyFontSize(S.fontSize||1);buildTabs();buildCatUI();updateStats();render();\n    setSyncStatus('✅ 拉取成功！数据已更新',true);showToast('☁️ 云端数据已加载');\n  }catch(e){setSyncStatus('❌ 拉取失败: '+e.message,false);}\n}\n\n\n// ══════════════════ Bilingual (i18n) engine ══════════════════\n// Chinese is the source language; English is applied as a post-render DOM layer.\n// Seed tasks/shop/categories are swapped in the DATA so user content is never touched.\nconst DEF_TAB_LABELS_EN={all:'All',today:'🌅Today',mustdo:'❗Must-do',habit:'Habits',daily:'Daily',todo:'To-do',archive:'Archive',fragments:'⚡Bits',stats:'📈Stats',shop:'🛒Shop',log:'📊Log',donelist:'✅Done',trash:'🗑Recently deleted'};\nconst CAT_I18N={'工作':{zh:'💼 工作',en:'💼 Work'},'学习':{zh:'📚 学习',en:'📚 Study'},'健康':{zh:'💪 健康',en:'💪 Health'},'生活':{zh:'🏠 生活',en:'🏠 Life'},'社交':{zh:'💬 社交',en:'💬 Social'},'创意':{zh:'🎨 创意',en:'🎨 Creative'}};\n// seed tasks: zh-name -> {en, and optional field translations}\nconst SEED_TASKS=[\n  {zh:'喝一杯水',en:'Drink a glass of water',minReqDesc:['先喝一口就算赢','One sip already counts'],minReqUnit:['口','sip']},\n  {zh:'整理桌面 5 分钟',en:'Tidy your desk for 5 min',minReqDesc:['随手收拾一样东西','Put away just one thing'],minReqUnit:['次','time']},\n  {zh:'完成今天最重要的一件事',en:'Do the one most important thing today',minReqDesc:['打开它，先做 2 分钟','Open it, work for 2 min'],minReqUnit:['次','time'],steps:[['写下它具体是什么','Write down what it is'],['开始第一步','Start the firs .steps.forEach((st,i)=>{const p=e.steps[i];if(p&&(st.name===p[0]||st.name===p[1]))st.name=p[isEn?1:0];});\n  });\n  (S.shopItems||[]).forEach(it=>{const e=SHOP_BYNAME[it.name];if(e)it.name=isEn?e.en:e.zh;});\n  (S.doneList||[]).forEach(d=>{const e=DONE_BYNAME[d.name];if(e)d.name=isEn?e.en:e.zh;});\n  (S.categories||[]).forEach(c=>{const e=CAT_I18N[c.id];if(e&&(c.label===e.zh||c.label===e.en))c.label=isEn?e.en:e.zh;});\n  Object.keys(DEF_TAB_LABELS).forEach(k=>{const zh=DEF_TAB_LABELS[k],en=DEF_TAB_LABELS_EN[k];if(S.tabLabels[k]===zh||S.tabLabels[k]===en)S.tabLabels[k]=isEn?en:zh;});\n  if(S.charName==='ADVENTURER'||!S.charName)S.charName=S.charName||'ADVENTURER';\n}\n\n// ---- chrome dictionary (exact-match, zh -> en) ----\nconst DICT={\n'主题':'Theme','☀️ 经典白':'☀️ Classic','🌿 薄荷绿':'🌿 Mint','💜 薰衣草':'💜 Lavender','🏖 沙漠金':'🏖 Sand','🌹 玫瑰红':'🌹 Rose','🌸 樱花粉':'🌸 Sakura','🌙 深色':'🌙 Dark','🌲 森林':'🌲 Forest','🌊 深海':'🌊 Ocean',\n'📱 主屏图标背景色':'📱 Home-screen icon background','改色后重新「添加到主屏幕」生效':'Re-add to home screen to apply','字体大小':'Font size',\n'⋯ 更多':'⋯ More','📦 数据 / 导出':'📦 Data / Export','🔔 定时提醒':'🔔 Reminders','☁️ 云同步':'☁️ Cloud sync','🔔 开启系统通知':'🔔 Enable notifications',\n'🔴 红色 — 紧迫刺激':'🔴 Red — Urgent','🟡 黄色 — 无聊必要':'🟡 Yellow — Necessary','🔵 蓝色 — 放松充电':'🔵 Blue — Recharge','🟢 绿色 — 快乐成长':'🟢 Green — Growth',\n'🏷 分类 ▾':'🏷 Category ▾','全部':'All','+ 添加':'+ Add','+ 添加 ':'+ Add ',\n'☰ 菜单 ▾':'☰ Menu ▾','显示的标签':'Visible tabs','新建任务位置':'New task position','⬆️ 加到顶部':'⬆️ Add to top','⬇️ 加到底部':'⬇️ Add to bottom','快捷操作':'Quick actions','📂 全部展开':'📂 Show all','📌 仅显示必做+完成':'📌 Must-do + Done only','⚙️ 显示自定义':'⚙️ Custom','其他收起的标签':'Other hidden tabs',\n'▾ 添加任务':'▾ Add task','▴ 收起表单':'▴ Collapse',\n'待办':'To-do','习惯':'Habit','每日':'Daily','存档':'Archive','❗必做':'❗Must-do','❗最低:':'❗Min:','🔄 重复:':'🔄 Repeat:','不重复':'No repeat','每天':'Daily','每周':'Weekly','每2周':'Biweekly','每月':'Monthly','每年':'Yearly','每月:':'Monthly:','每年:':'Yearly:','无关紧要':'Trivial','简单':'Easy','中等':'Medium','困难':'Hard','截止:':'Due:','计数:':'Coun raw.replace(key,en);\n}\nfunction _trAttrs(el,rec){\n  ['placeholder','title'].forEach(a=>{\n    if(!el.hasAttribute(a))return;\n    const v=el.getAttribute(a),k=v.trim(),en=ATTR_DICT[k]||DICT[k];\n    if(en&&en!==v){if(rec)_i18nApplied.push({node:el,kind:a,orig:v});el.setAttribute(a,en);}\n  });\n}\nfunction localizeNode(root,rec){\n  if(!root)return;\n  if(root.nodeType===3){_trText(root,rec);return;}\n  if(root.nodeType!==1)return;\n  if(root.closest&&root.closest('#tutov'))return; // tutorial handled separately\n  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);\n  const nodes=[];let n;while(n=w.nextNode())nodes.push(n);\n  nodes.forEach(t=>{if(!(t.parentElement&&t.parentElement.closest&&t.parentElement.closest('#tutov')))_trText(t,rec);});\n  if(root.querySelectorAll){root.querySelectorAll('[placeholder],[title]').forEach(e=>_trAttrs(e,rec));_trAttrs(root,rec);}\n}\nfunction localizeDOM(){_i18nApplied=[];localizeNode(document.body,true);}\nfunction restoreZH(){_i18nApplied.forEach(a=>{try{if(a.kind==='t')a.node.nodeValue=a.orig;else a.node.setAttribute(a.kind,a.orig);}catch(e){}});_i18nApplied=[];}\n\nlet _i18nObs=null;\nfunction startI18nObserver(){\n  if(_i18nObs)return;\n  _i18nObs=new MutationObserver(muts=>{if(S.lang!=='en')return;muts.forEach(m=>m.addedNodes.forEach(nd=>localizeNode(nd,false)));});\n  _i18nObs.observe(document.body,{childList:true,subtree:true});\n}\nfunction toggleLang(){setLang(S.lang==='en'?'zh':'en');}\nfunction setLang(to){\n  const cur=S.lang||'zh';\n  if(to===cur){return;}\n  if(cur==='en')restoreZH();\n  S.lang=to;applySeedLang(to);save();\n  document.documentElement.lang=to==='en'?'en':'zh';\n  buildTabs();buildCatUI();updateStats();syncAddForm();render();\n  if(to==='en')localizeDOM();\n  updateLangBtn();\n  applyFontSize(S.fontSize||1);\n  refreshCalTriggers();\n  {const _cb=document.getElementById('cat-toggle-btn');if(_cb){const _open=document.getElementById('catpanel')&&document.getElementById('catpanel').classList.contains('open');const en=to==='en';_cb.textContent=en?(_open?'🏷 Category ▴':'🏷 Category ▾'):(_open?'🏷 分类 ▴':'🏷 分类 ▾');}}\n  if(document.getElementById('tutov').classList.contains('show'))tutRender();\n}\nfunction updateLangBtn(){const b=document.getElementById('lang-btn');if(!b)return;const en=S.lang==='en';const z=b.querySelector('.lt-zh'),e=b.querySelector('.lt-en');if(z&&e){z.classList.toggle('on',!en);e.classList.toggle('on',en);}}\n\n// init\nsetTheme(S.theme||'th-light');\napplyFontSize(S.fontSize||1);\nbuildTabs();buildCatUI();\nsyncAddForm();updateStats();render();\nstartI18nObserver();updateInstallBtn();\nif(S.lang==='en'){applySeedLang('en');document.documentElement.lang='en';buildTabs();buildCatUI();updateStats();syncAddForm();render();localizeDOM();}\nrefreshCalTriggers();\nupdateLangBtn();\nsetTimeout(updatePwaManifest,100);\n\n// ── First-run onboarding tutorial ──\nconst TUT_SLIDES=[\n  {e:'🗺️',\n   t:'欢迎来到 GO AHEAD',\n   b:'把每天要做的小事，变成一场轻松的冒险。<br><br>完成任务 → 获得 ✨经验 和 🪙金币、升级；<br>实在没做 → 只会掉一点点 ❤️血。<br><br><b>让生活变成游戏，地球online启动！🌍<\u002Fb>',\n   tEn:'Welcome to GO AHEAD',\n   bEn:'Turn the little things you do each day into a light adventure.<br><br>Finish a task → earn ✨XP &amp; 🪙gold, level up;<br>skip it → just lose a tiny bit of ❤️HP.<br><br><b>Turn life into a game — Earth online, booting up! 🌍<\u002Fb>'},\n  {e:'🎨',\n   t:'给任务“调”个颜色',\n   b:'用四种颜色一眼看出今天的节奏：<br><br>🔴 紧迫刺激　🟡 无聊但必要<br>🔵 放松充电　🟢 快乐成长<br><br>顶部色块可以筛选，怎么用都行。',\n   tEn:'Give tasks a “color”',\n   bEn:'Read today’s rhythm at a glance:<br><br>🔴 Urgent &amp; exciting　🟡 Dull but needed<br>🔵 Rest &amp; recharge　🟢 Happy growth<br><br>Tap the color bars on top to filter — use them however you like.'},\n  {e:'❗',\n   t:'必做 & “最低限度”',\n   b:'给最重要的几件事标上 <b>❗必做<\u002Fb>。<br><br>再给它设一个低到好笑的“最低限度”——<br>比如“<b>穿上跑鞋就算赢<\u002Fb>”。<br><br>只要迈出第一步，今天就赢了，其它都是 bonus。',\n   tEn:'Must-do & the “bare minimum”',\n   bEn:'Mark your few most important things as <b>❗Must-do<\u002Fb>.<br><br>Then set a laughably low “bare minimum” —<br>like “<b>putting your shoes on counts as a win<\u002Fb>”.<br><br>Take the first step and you’ve won today; the rest is bonus.'},\n  {e:'🪙',\n   t:'金币 → 心愿商店',\n   b:'完成任务攒下的 🪙金币，<br>可以去 <b>🛒商店<\u002Fb> 给自己兑换真实的奖励——<br>一场电影、一个 iPad、一台按摩椅……<br><br>让冲动消费先沉淀，让你的成就感看得见。',\n   tEn:'Gold → Wishlist shop',\n   bEn:'Spend the 🪙gold you earn in the <b>🛒Shop<\u002Fb><br>on real rewards for yourself —<br>a movie, an iPad, a massage chair…<br><br>Let impulse buys settle first, and make your sense of achievement visible.'},\n  {e:'🚀',\n   t:'开始你的冒险',\n   b:'这里已经放了一些<b>示例任务<\u002Fb>，<br>完成它们，或直接划掉换上你自己的。<br><br>点右下角 <b>＋<\u002Fb> 添加任务，<br>右上角 <b>🎨<\u002Fb> 换主题字号、<b>❓<\u002Fb> 重看本教程。',\n   tEn:'Start your adventure',\n   bEn:'We’ve added a few <b>sample tasks<\u002Fb>.<br>Finish them, or just clear them and add your own.<br><br>Tap <b>＋<\u002Fb> (bottom-right) to add a task;<br>use <b>🎨<\u002Fb> (top-right) for theme &amp; font, <b>❓<\u002Fb> to replay this guide.'},\n];\nlet tutIdx=0;\nfunction showTutorial(){tutIdx=0;document.getElementById('tutov').classList.add('show');tutRender();}\nfunction tutClose(){document.getElementById('tutov').classList.remove('show');if(!S.seenTutorial){S.seenTutorial=true;save();setTimeout(highlightFirstTask,360);}}\nfunction tutNext(){if(tutIdx>=TUT_SLIDES.length-1){tutClose();return;}tutIdx++;tutRender();}\nfunction tutGo(i){tutIdx=i;tutRender();}\nfunction tutRender(){\n  const s=TUT_SLIDES[tutIdx];const en=S.lang==='en';\n  document.getElementById('tut-emoji').textContent=s.e;\n  document.getElementById('tut-title').textContent=en?s.tEn:s.t;\n  document.getElementById('tut-body').innerHTML=en?s.bEn:s.b;\n  document.getElementById('tut-dots').innerHTML=TUT_SLIDES.map((_,i)=>`<span class=\"tut-dot${i===tutIdx?' on':''}\" onclick=\"tutGo(${i})\"><\u002Fspan>`).join('');\n  const last=tutIdx===TUT_SLIDES.length-1;\n  document.getElementById('tut-next').textContent=last?(en?'Start ✦':'开始冒险 ✦'):(en?'Next →':'下一步 →');\n  const sk=document.getElementById('tut-skip');sk.textContent=en?'Skip':'跳过';sk.style.visibility=last?'hidden':'visible';\n}\nfunction highlightFirstTask(){const first=document.querySelector('#tlist .titem');if(!first)return;const box=first.querySelector('.ibtn.ok')||first.querySelector('.chkbox')||first;box.classList.add('ga-pulse');setTimeout(()=>box.classList.remove('ga-pulse'),5400);}\nfunction toggleMoreMenu(){const p=document.getElementById('more-panel');if(p)p.classList.toggle('open');}\nfunction closeMoreMenu(){const p=document.getElementById('more-panel');if(p)p.classList.remove('open');}\ndocument.addEventListener('click',e=>{const w=document.getElementById('more-wrap');if(w&&!w.contains(e.target))closeMoreMenu();});\nif(!S.seenTutorial){setTimeout(showTutorial,400);}\n<\u002Fscript>\n\n<!-- GitHub Gist Sync Modal -->\n<div class=\"ov\" id=\"syncov\"><div class=\"ovbg\" onclick=\"closeOv('syncov')\"><\u002Fdiv><div class=\"ovbox\" style=\"width:min(440px,94vw)\">\n  <h3>☁️ GitHub Gist 同步<\u002Fh3>\n  <div id=\"sync-setup\" style=\"display:block\">\n    <p style=\"font-size:12px;color:var(--text2);margin-bottom:10px;line-height:1.6\">用 GitHub Gist 免费同步数据到云端，任何设备都能读取。<br>需要一个 GitHub 账号和 Personal Access Token。<\u002Fp>\n    <div style=\"margin-bottom:8px\">\n      <label style=\"font-size:11px;color:var(--text3);display:block;margin-bottom:4px\">GitHub Token（gist 权限即可）<\u002Flabel>\n      <div style=\"position:relative\">\n        <input class=\"ov-inp\" type=\"password\" id=\"sync-token\" placeholder=\"ghp_xxxxxxxxxxxx\" style=\"font-family:monospace;font-size:12px;padding-right:38px;margin-bottom:0\">\n        <button onclick=\"const i=document.getElementById('sync-token');i.type=i.type==='password'?'text':'password'\" style=\"position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:13px;padding:2px\">👁<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-bottom:12px\">\n      <label style=\"font-size:11px;color:var(--text3);display:block;margin-bottom:4px\">Gist ID（第一次留空，自动创建）<\u002Flabel>\n      <input class=\"ov-inp\" type=\"text\" id=\"sync-gist-id\" placeholder=\"留空自动创建\" style=\"font-family:monospace;font-size:12px\">\n    <\u002Fdiv>\n    <div style=\"font-size:11px;color:var(--text3);padding:8px 10px;border-radius:8px;background:rgba(124,108,248,.08);border:1px solid var(--brd);margin-bottom:12px;line-height:1.7\">\n      💡 获取 Token 步骤：<br>\n      1. 打开 github.com → 右上角头像 → Settings<br>\n      2. 左侧最底部 Developer settings → Personal access tokens → Tokens (classic)<br>\n      3. Generate new token → 勾选 <b>gist<\u002Fb> 权限 → 复制 token<br><br>\n      ⚠️ 出现 401 错误：确认 token 有 <b>gist<\u002Fb> 权限，且未过期。手机和电脑填写相同的 Token 和 Gist ID 即可同步。\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n      <button class=\"abtn\" onclick=\"syncSave()\">☁️ 推送到云端<\u002Fbutton>\n      <button class=\"abtn\" style=\"background:var(--surf2);color:var(--text2);border:1px solid var(--brd2)\" onclick=\"syncLoad()\">📥 从云端拉取<\u002Fbutton>\n      <button class=\"mbtn cancel\" onclick=\"closeOv('syncov')\" style=\"font-family:'Nunito',sans-serif;font-size:12px;padding:6px 12px;border-radius:8px;font-family:'Nunito',sans-serif\">关闭<\u002Fbutton>\n    <\u002Fdiv>\n    <div id=\"sync-status\" style=\"margin-top:10px;font-size:12px;color:var(--acc2);display:none\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n\n\n<!-- Pomodoro / Focus timer modal -->\n<div class=\"ov\" id=\"pomoov\" style=\"z-index:90\"><div class=\"ovbg\" onclick=\"stopPomoAndClose()\"><\u002Fdiv><div class=\"ovbox\" style=\"width:min(400px,94vw);text-align:center\">\n  <h3>🍅 专注计时<\u002Fh3>\n  <div class=\"pomo-wrap\">\n    <svg class=\"pomo-svg\" width=\"160\" height=\"160\" viewBox=\"0 0 160 160\">\n      <circle cx=\"80\" cy=\"80\" r=\"68\" fill=\"none\" stroke=\"var(--bar)\" stroke-width=\"10\"><\u002Fcircle>\n      <circle id=\"pomo-ring\" class=\"pomo-ring\" cx=\"80\" cy=\"80\" r=\"68\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-dasharray=\"427\" stroke-dashoffset=\"0\"><\u002Fcircle>\n    <\u002Fsvg>\n    <div style=\"margin-top:-100px;margin-bottom:90px\">\n      <div class=\"pomo-time\" id=\"pomo-display\">25:00<\u002Fdiv>\n      <div class=\"pomo-label\" id=\"pomo-phase\" onclick=\"editPomoPhaseLabel()\" style=\"cursor:pointer\" title=\"点击编辑文字\">专注时间<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pomo-task-name\" id=\"pomo-task-name\">自由专注<\u002Fdiv>\n  <div style=\"font-size:11px;color:var(--text3);margin-bottom:10px\">第 <span id=\"pomo-count\">1<\u002Fspan> 个番茄 🍅<\u002Fdiv>\n  <div style=\"display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:8px;flex-wrap:wrap\">\n    <span style=\"font-size:11px;color:var(--text3)\">预设:<\u002Fspan>\n    <select id=\"pomo-duration\" onchange=\"setPomoMins(this.value)\" style=\"padding:4px 8px;border-radius:8px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-family:'Nunito',sans-serif;font-size:12px;outline:none\">\n      <option value=\"5\">5 分钟<\u002Foption>\n      <option value=\"15\">15 分钟<\u002Foption>\n      <option value=\"25\" selected=\"\">25 分钟（标准）<\u002Foption>\n      <option value=\"45\">45 分钟<\u002Foption>\n      <option value=\"60\">60 分钟<\u002Foption>\n    <\u002Fselect>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:12px;flex-wrap:wrap\">\n    <span style=\"font-size:11px;color:var(--text3)\">自定义:<\u002Fspan>\n    <input type=\"number\" id=\"pomo-custom-mins\" min=\"1\" max=\"999\" value=\"25\" style=\"width:62px;padding:4px 8px;height:30px;border-radius:8px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-family:'Nunito',sans-serif;font-size:12px;outline:none;text-align:center\">\n    <span style=\"font-size:11px;color:var(--text3)\">分<\u002Fspan>\n    <button onclick=\"setCustomPomoMins()\" style=\"padding:4px 10px;height:30px;border-radius:8px;border:1px solid var(--brd2);background:var(--surf2);color:var(--text2);font-family:'Nunito',sans-serif;font-size:12px;cursor:pointer;transition:all .15s\" onmouseover=\"this.style.background='var(--acc)';this.style.color='#fff'\" onmouseout=\"this.style.background='var(--surf2)';this.style.color='var(--text2)'\">设定<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"pomo-btns\">\n    <button class=\"pomo-btn primary\" id=\"pomo-start-btn\" onclick=\"togglePomo()\">▶ 开始<\u002Fbutton>\n    <button class=\"pomo-btn\" onclick=\"resetPomo()\">↺ 重置<\u002Fbutton>\n    <button class=\"pomo-btn\" style=\"background:rgba(46,204,113,.15);color:#52c97a;border-color:rgba(46,204,113,.3)\" onclick=\"finishPomoSession()\" title=\"结束并记录\">✓ 结束<\u002Fbutton>\n    <button class=\"pomo-btn danger\" onclick=\"stopPomoAndClose()\">✕ 关闭<\u002Fbutton>\n  <\u002Fdiv>\n  <div id=\"pomo-done-msg\" style=\"display:none;margin-top:12px;padding:10px;border-radius:8px;background:rgba(46,204,113,.1);border:1px solid rgba(46,204,113,.25);font-size:12px;color:#52c97a\">🎉 番茄完成！正在计超时… 点「✓ 结束」保存总时长<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n\n<!-- Reminders Modal -->\n<div class=\"ov\" id=\"reminderov\"><div class=\"ovbg\" onclick=\"closeOv('reminderov')\"><\u002Fdiv><div class=\"ovbox\" style=\"width:min(480px,94vw)\">\n  <h3>🔔 定时提醒<\u002Fh3>\n  <div id=\"reminder-intro\" style=\"margin-bottom:10px;padding:9px 11px;border-radius:8px;background:rgba(124,108,248,.08);border:1px solid var(--brd);font-size:11px;color:var(--text2);line-height:1.7\"><\u002Fdiv>\n  <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap\">\n    <button onclick=\"requestNotifPerm()\" class=\"abtn\" id=\"notif-perm-btn\" style=\"font-size:12px\">🔔 开启系统通知<\u002Fbutton>\n    <span id=\"notif-status\" style=\"font-size:11px;color:var(--acc2);font-weight:700\"><\u002Fspan>\n  <\u002Fdiv>\n  <div id=\"reminder-list\"><\u002Fdiv>\n  <div style=\"padding:10px 12px;border-radius:10px;border:1px solid var(--brd2);background:var(--card);margin-top:8px\">\n    <div style=\"font-size:12px;font-weight:600;color:var(--text);margin-bottom:8px\" id=\"reminder-add-title\">+ 新增提醒<\u002Fdiv>\n    <div style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px\">\n      <input type=\"time\" id=\"reminder-time\" style=\"padding:4px 8px;height:31px;border-radius:8px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-size:12px;outline:none\">\n      <input type=\"text\" id=\"reminder-label\" placeholder=\"提醒内容（如：喝水、站起来动一动）\" style=\"flex:1;min-width:140px;padding:4px 8px;height:31px;border-radius:8px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-family:'Nunito',sans-serif;font-size:12px;outline:none\">\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center\">\n      <select id=\"reminder-task\" style=\"padding:4px 8px;height:31px;border-radius:8px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-size:12px;outline:none;flex:1;min-width:120px\"><\u002Fselect>\n      <button class=\"abtn\" onclick=\"addReminder()\">+ 添加提醒<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"text-align:right;margin-top:10px\"><button class=\"hbtn\" onclick=\"closeOv('reminderov')\">关闭<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
