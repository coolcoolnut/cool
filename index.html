r:var(--text);font-family:'Nunito',sans-serif;font-size:12px;outline:none\"><option value=\"1\">1月<\u002Foption><option value=\"2\">2月<\u002Foption><option value=\"3\">3月<\u002Foption><option value=\"4\">4月<\u002Foption><option value=\"5\">5月<\u002Foption><option value=\"6\">6月<\u002Foption><option value=\"7\">7月<\u002Foption><option value=\"8\">8月<\u002Foption><option value=\"9\">9月<\u002Foption><option value=\"10\">10月<\u002Foption><option value=\"11\">11月<\u002Foption><option value=\"12\">12月<\u002Foption><\u002Fselect><input type=\"number\" id=\"tyday\" min=\"1\" max=\"31\" placeholder=\"日\" value=\"1\" style=\"width:46px;height:31px;padding:4px 8px;border-radius:8px;border:1px solid var(--brd2);background:var(--inp);color:var(--text);font-family:'Nunito',sans-serif;font-size:12px;outline:none\"><\u002Fdiv>\n        <select id=\"tdiff\"><option value=\"trivial\">无关紧要<\u002Foption><option value=\"easy\">简单<\u002Foption><option value=\"medium\" selected=\"\">中等<\u002Foption><option value=\"hard\">困难<\u002Foption><\u002Fselect>\n        <select id=\"tcat\"><\u002Fselect>\n      <\u002Fdiv>\n      <div class=\"arow\">\n        <span class=\"albl\">截止:<\u002Fspan><button type=\"button\" class=\"cal-trigger empty\" id=\"tdl-btn\" data-cal-target=\"tdl\" data-noi18n=\"\" onclick=\"openCal('tdl','tdl-btn')\">选择日期<\u002Fbutton><input type=\"hidden\" id=\"tdl\">\n        <span class=\"albl\">计数:<\u002Fspan><input type=\"number\" id=\"tgoal\" min=\"1\" max=\"99999\" placeholder=\"目标\" style=\"width:58px\"><input type=\"text\" id=\"tgoalunit\" placeholder=\"单位\" style=\"width:46px\">\n        <button class=\"abtn\" onclick=\"addTask()\">+ 添加<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"global-ms-bar\" style=\"display:flex;align-items:center;gap:7px;margin-bottom:8px\">\n    <button class=\"multiselect-btn\" id=\"ms-btn\" onclick=\"toggleMultiselect()\">☑ 多选<\u002Fbutton>\n    <button class=\"multiselect-btn\" id=\"steps-btn\" onclick=\"toggleAllSteps()\" title=\"展开/收起所有任务的小步骤\">⊡ 拆解步骤<\u002Fbutton>\n    <div id=\"bulkbar\" class=\"bulk-bar\"><span id=\"bulkcount\">已选0项<\u002Fspan><button class=\"bbtn\" onclick=\"bulkComplete()\">✓完成<\u002Fbutton><button class=\"bbtn\" onclick=\"bulkArchive()\">📁存档<\u002Fbutton><button class=\"bbtn\" onclick=\"bulkMustdo(true)\">❗必做<\u002Fbutton><button class=\"bbtn\" onclick=\"bulkMustdo(false)\">取消必做<\u002Fbutton><button class=\"bbtn danger\" onclick=\"bulkDelete()\">🗑删除<\u002Fbutton><button class=\"bbtn\" onclick=\"disableMultiselect()\">✕取消<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"tlist\" id=\"tlist\"><\u002Fdiv>\n<\u002Fdiv>\n\n<script>\nconst SPRITES=['🧙','🧝','🧛','🦸','🥷','🧚','🧜','🤺','🧟','🐉'];\nconst LVNAMES=['ADVENTURER','APPRENTICE','WARRIOR','CHAMPION','HERO','LEGEND','MASTER','MYTHIC'];\nconst XPMAP={trivial:5,easy:10,medium:20,hard:40};\nconst GOLDMAP={trivial:3,easy:8,medium:15,hard:30};\nconst QUADXP={red:1.2,yellow:1.0,blue:0.8,green:1.3};\nconst DIFFLBL={trivial:'无关紧要',easy:'简单',medium:'中等',hard:'困难'};\nconst TYPELBL={habit:'习惯',daily:'每日',todo:'待办',archive:'存档'};\nconst RECURLBL={daily:'每天',weekly:'每周',biweekly:'每2周',monthly:'每月',yearly:'每年'};\nconst DEF_CATS=[{id:'工作',label:'💼 工作'},{id:'学习',label:'📚 学习'},{id:'健康',label:'💪 健康'},{id:'生活',label:'🏠 生活'},{id:'社交',label:'💬 社交'},{id:'创意',label:'🎨 创意'}];\nconst WEEKDAYS=['日','一','二','三','四','五','六'];\n\nfunction mkTask(o){\n  const isMT=o.type==='mustdo';\n  return{id:o.id,name:o.name||'',type:isMT?'todo':o.type||'todo',mustdo:o.mustdo!==undefined?!!o.mustdo:isMT,\n    quad:o.quad||'yellow',diff:o.diff||'medium',cat:o.cat||'',done:o.done||false,count:o.count||0,\n    counterGoal:o.counterGoal||0,counterUnit:o.counterUnit||'次',\n    minReq:o.minReq||0,minReqUnit:o.minReqUnit||'次',minReqDesc:o.minReqDesc||'',minReqDone:o.minReqDone||false,\n    recur:(o.type==='daily'?'daily':(o.recur||'')),recurDays:o.recurDays||[],\n    deadline:o.deadline||'',steps:o.steps||[],doneTime:o.doneTime||'',doneTs:o.doneTs||0,\n    fragCount:o.fragCount||0,fragTag:o.fragTag||false,recurMonthDay:o.recurMonthDay||1,\n    pomoMins:o.pomoMins||25,pomoLogs:o.pomoLogs||[],recurMonth:o.recurMonth||1,recurDay:o.recurDay||1};\n}\n\nconst DEF_TAB_ORDER=['all','today','mustdo','habit','daily','todo','archive','fragments','stats','shop','log','donelist','trash'];\nconst DEF_TAB_LABELS={all:'全部',today:'🌅今日',mustdo:'❗必做',habit:'习惯',daily:'每日',todo:'待办',archive:'存档',fragments:'⚡碎片',stats:'📈统计',shop:'🛒商店',log:'📊记录',donelist:'✅完成',trash:'🗑最近删除'};\n\nfunction defState(){\n  const t=(id,nm,tp,q,d,c,md,opts={})=>mkTask({id,name:nm,type:tp,quad:q,diff:d,cat:c,mustdo:md,...opts});\n  return{tasks:[\n    // 今天必须做（示例任务，随时删掉换上你自己的）\n    t(1,'喝一杯水','todo','blue','trivial','健康',true,{minReq:1,minReqUnit:'口',minReqDesc:'先喝一口就算赢'}),\n    t(2,'整理桌面 5 分钟','todo','green','easy','生活',true,{minReq:1,minReqUnit:'次',minReqDesc:'随手收拾一样东西'}),\n    t(3,'完成今天最重要的一件事','todo','red','hard','工作',true,{minReq:1,minReqUnit:'次',minReqDesc:'打开它，先做 2 分钟',steps:[{id:1,name:'写下它具体是什么',done:false},{id:2,name:'开始第一步',done:false}]}),\n    // 建议做 / 可选\n    t(4,'读书 20 分钟','todo','blue','medium','学习',false,{counterGoal:20,counterUnit:'分钟',recur:'daily'}),\n    t(5,'出门散步','todo','green','easy','健康',false),\n    t(6,'给一位朋友发条消息','todo','green','trivial','社交',false),\n    t(7,'写下今天的三件好事','todo','blue','easy','生活',false,{steps:[{id:3,name:'好事一',done:false},{id:4,name:'好事二',done:false},{id:5,name:'好事三',done:false}]}),\n    t(8,'学习一个新东西','todo','green','medium','学习',false),\n    // 存档（不着急做的）\n    t(9,'家里大扫除','archive','yellow','medium','生活',false,{steps:[{id:6,name:'客厅',done:false},{id:7,name:'厨房',done:false},{id:8,name:'卧室',done:false}]}),\n    t(10,'整理手机相册','archive','blue','easy','创意',false),\n    t(11,'列一份想读的书单','archive','blue','trivial','学习',false),\n    // 日常习惯 / 每日\n    t(12,'喝水打卡','habit','blue','easy','健康',false,{counterGoal:8,counterUnit:'杯',minReq:1,minReqUnit:'杯',minReqDesc:'先喝一杯',recur:'daily'}),\n    t(13,'运动 10 分钟','daily','green','medium','健康',true,{minReq:1,minReqUnit:'次',minReqDesc:'先换上运动鞋',recur:'daily'}),\n    t(14,'睡前不刷手机','habit','blue','easy','生活',false,{recur:'daily'}),\n  ],\n  doneList:[\n    {id:'d1',name:'按时起床',xp:10,gold:8,diff:'easy',cat:'健康',time:'今天 08:00',ts:Date.now()-3600000},\n    {id:'d2',name:'回复了一条消息',xp:5,gold:3,diff:'trivial',cat:'工作',time:'今天 10:30',ts:Date.now()-7200000},\n  ],\n  trash:[],\n  hp:100,maxHp:100,xp:0,maxXp:100,gold:0,level:1,\n  spriteIdx:0,charName:'ADVENTURER',\n  activeTab:'all',quadFilters:[],catFilter:'',logFilter:'',\n  categories:[...DEF_CATS],\n  tabOrder:[...DEF_TAB_ORDER],\n  tabLabels:{...DEF_TAB_LABELS},\n  shopItems:[\n    {id:'s1',name:'看一场电影',cost:80,bought:false},\n    {id:'s2',name:'买一本想读的书',cost:150,bought:false},\n    {id:'s3',name:'吃一顿大餐',cost:300,bought:false},\n    {id:'s4',name:'一台 iPad',cost:2000,bought:false},\n    {id:'s5',name:'一张按摩椅',cost:5000,bought:false},\n  ],\n  ledger:[],\n  dailySummaries:[],\n  nextId:50,nextStepId:300,lastReset:'',theme:'th-light',undoStack:[],taskOrder:[],\n  logSubTab:'diary',diaryEntries:[],syncToken:'',syncGistId:'',statPeriod:'week',\n  tabHidden:['daily','fragments','stats','log','trash'],tabMode:'custom',fontSize:1,addFormOpen:true,reminders:[],todayCollapsed:{mustdo:false,other:false,done:true},doneGroupCollapsed:{},tabDoneCollapsed:{section:false,today:false,past:true},pwaIconColor:'#ffffff',pwaBgColor:'#f5f4f0',seenTutorial:false,lang:'zh'\n};}\n\nlet S,editingId=null,bulkSel=new Set(),expandedDone=new Set(),collapsedSteps=new Set(),expandedSteps=new Set(),multiselect=false,shopEditId=null,renamingTab=null;\ntry{const sv=localStorage.getItem('ql_v10');S=sv?JSON.parse(sv):defState();}catch(e){S=defState();}\nS.tasks=S.tasks.map(t=>mkTask(t));\n['quadFilters','categories','tabOrder','tabLabels','shopItems','ledger','dailySummaries','trash'].forEach(k=>{if(!S[k])S[k]=defState()[k];});\nif(!S.catFilter)S.catFilter='';if(!S.logFilter)S.logFilter='';\nS.tasks.forEach(t=>{if(t.fragCount===undefined)t.fragCount=0;if(t.fragTag===undefined)t.fragTag=false;if(!t.pomoMins)t.pomoMins=25;if(!t.pomoLogs)t.pomoLogs=[];if(!t.recurMonthDay)t.recurMonthDay=1;});\nif(!S.logSubTab)S.logSubTab='diary';\nif(!S.diaryEntries)S.diaryEntries=[];\nif(!S.syncToken)S.syncToken='';\nif(!S.syncGistId)S.syncGistId='';\nif(!S.statPeriod)S.statPeriod='week';\nif(!S.tabHidden)S.tabHidden=[];\nif(!S.tabMode)S.tabMode='custom';\nif(S.fontSize===undefined)S.fontSize=1;\nif(S.addFormOpen===undefined)S.addFormOpen=true;\nif(!S.reminders)S.reminders=[];\nif(!S.todayCollapsed)S.todayCollapsed={mustdo:false,other:false,done:true};\nif(!S.doneGroupCollapsed)S.doneGroupCollapsed={};\nif(!S.tabDoneCollapsed)S.tabDoneCollapsed={section:false,today:false,past:true};\nif(!S.pwaIconColor)S.pwaIconColor='#ffffff';\nif(!S.pwaBgColor)S.pwaBgColor='#f5f4f0';\nif(!S.tabOrder||S.tabOrder.length<8)S.tabOrder=[...DEF_TAB_ORDER];\nS.tabOrder=S.tabOrder.filter(t=>t!=='focus'); // moved focus into log sub-tab\nif(S.activeTab==='focus'){S.activeTab='log';S.logSubTab='focus';}\nif(!S.taskOrder)S.taskOrder=[];\nif(!S.newTaskPos)S.newTaskPos='top';\nif(!S.tabLabels)S.tabLabels={...DEF_TAB_LABELS};\n\nfunction save(){try{localStorage.setItem('ql_v10',JSON.stringify(S));}catch(e){}}\n\nfunction addLedger(type,delta,desc,ts){const _ts=ts||Date.now();S.ledger.unshift({id:'l'+_ts,ts:_ts,type,delta,desc,time:nowStr()});if(S.ledger.length>500)S.ledger=S.ledger.slice(0,500);}\n\n// daily reset with recurrence\nfunction checkReset(){\n  const today=new Date().toDateString();if(S.lastReset===today)return;\n  const isFirst=!S.lastReset;S.lastReset=today;\n  const now=new Date();const dow=now.getDay();\n  S.tasks.forEach(t=>{\n    if(t.type==='daily'){\n      if(!isFirst&&!t.done&&t.minReq>0&&t.count<t.minReq){S.hp=Math.max(0,S.hp-8);addLedger('hp',-8,'\"'+t.name+'\"未达最低');showToast('💔 \"'+t.name+'\" 未达最低 -8HP');}\n      t.done=false;t.count=0;t.minReqDone=false;if(t.steps)t.steps.forEach(s=>s.done=false);\n    }\n    // recurrence reset\n    if(t.recur&&t.done){\n      let shouldReset=false;\n      if(t.recur==='daily')shouldReset=true;\n      else if(t.recur==='weekly'){const days=t.recurDays.length?t.recurDays:[1];shouldReset=days.includes(dow);}\n      else if(t.recur==='biweekly'){const wk=Math.floor((now-new Date(now.getFullYear(),0,1))/604800000);shouldReset=wk%2===0&&(t.recurDays.length?t.recurDays:[1]).includes(dow);}\n      else if(t.recur==='monthly')shouldReset=now.getDate()===1;\n      if(shouldReset){t.done=false;t.count=0;t.minReqDone=false;if(t.steps)t.steps.forEach(s=>s.done=false);}\n    }\n  });\n  if(!isFirst){const yd=new Date(Date.now()-86400000);document.getElementById('sum-date').textContent=yd.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})+'的回顾';document.getElementById('sum-input').value='';openOv('sumov');}\n  save();\n}\ncheckReset();setInterval(()=>{if(new Date().toDateString()!==S.lastReset)checkReset();},60000);\n\n// theme\nfunction _pwaIcon(size,bg,maskPad){\n  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');\n  const pad=maskPad?size*0.10:0; // safe zone for maskable\n  const o=pad,s=size-pad*2,r=maskPad?s*0.001:s*0.22;\n  if(maskPad){x.fillStyle=bg;x.fillRect(0,0,size,size);} // maskable: full bleed bg\n  x.fillStyle=bg;\n  x.beginPath();\n  if(x.roundRect)x.roundRect(o,o,s,s,r);else x.rect(o,o,s,s);\n  x.fill();\n  x.font='700 '+Math.floor(s*0.52)+'px serif';x.textAlign='center';x.textBaseline='middle';\n  x.fillText('⚔',size/2,size*0.55);\n  return c.toDataURL('image/png');\n}\nfunction updatePwaManifest(){\n  const bgColor=S.pwaBgColor||'#f5f4f0';\n  const apple=_pwaIcon(180,bgColor,false);\n  const i192=_pwaIcon(192,bgColor,false);\n  const i512=_pwaIcon(512,bgColor,false);\n  const i512m=_pwaIcon(512,bgColor,true);\n  const ael=document.getElementById('pwa-apple-icon');if(ael)ael.href=apple;\n  const en=(S.lang==='en');\n  const manifest={\n    id:'go-ahead-rpg',name:'GO AHEAD',short_name:'GO AHEAD',\n    description:en?'Turn daily tasks into a gentle RPG.':'把每天要做的小事，变成一场轻松的冒险。',\n    lang:en?'en':'zh',dir:'ltr',start_url:'.',scope:'.',display:'standalone',orientation:'portrait',\n    background_color:bgColor,theme_color:bgColor,categories:['productivity','lifestyle'],\n    icons:[\n      {src:i192,sizes:'192x192',type:'image/png',purpose:'any'},\n      {src:i512,sizes:'512x512',type:'image/png',purpose:'any'},\n      {src:i512m,sizes:'512x512',type:'image/png',purpose:'maskable'}\n    ]\n  };\n  const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});\n  const url=URL.createObjectURL(blob);\n  const el=document.getElementById('pwa-manifest');\n  if(el){if(el._prevUrl)URL.revokeObjectURL(el._prevUrl);el.href=url;el._prevUrl=url;}\n  const tc=document.getElementById('pwa-theme-color');\n  if(tc)tc.content=bgColor;\n  // Update pwa color pickers in panel\n  const bgPicker=document.getElementById('pwa-bg-picker');\n  if(bgPicker)bgPicker.value=bgColor;\n}\nfunction setPwaBgColor(val){\n  S.pwaBgColor=val;save();\n  updatePwaManifest();\n  showToast(S.lang==='en'?'📱 Icon background updated':'📱 图标背景已更新');\n}\n// ── PWA install ──\nlet _deferredPrompt=null;\nfunction _isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}\nwindow.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_deferredPrompt=e;updateInstallBtn();});\nwindow.addEventListener('appinstalled',()=>{_deferredPrompt=null;showToast(S.lang==='en'?'🎉 Installed! Find it on your home screen':'🎉 安装成功！去主屏幕看看吧');updateInstallBtn();});\nfunction updateInstallBtn(){const b=document.getElementById('install-menu-btn');if(!b)return;b.style.display=_isStandalone()?'none':'';}\nfunction installPWA(){\n  if(_deferredPrompt){_deferredPrompt.prompt();_deferredPrompt.userChoice.finally(()=>{_deferredPrompt=null;updateInstallBtn();});return;}\n  openInstallHelp();\n}\nfunction openInstallHelp(){\n  const en=S.lang==='en';\n  const ua=navigator.userAgent||'';\n  const iOS=/iPhone|iPad|iPod/i.test(ua);\n  const android=/Android/i.test(ua);\n  document.getElementById('install-title').textContent=en?'📲 Add to Home Screen':'📲 添加到主屏';\n  let steps;\n  if(iOS){\n    steps=en\n      ?['1． Tap the <b>Share<\u002Fb> button at the bottom of Safari.','2． Scroll down and tap <b>“Add to Home Screen”<\u002Fb>.','3． Tap <b>Add<\u002Fb> — GO AHEAD now has its own icon and opens full-screen, offline.']\n      :['1．点 Safari 底部的 <b>分享按钮<\u002Fb>。','2．下滑找到 <b>“添加到主屏幕”<\u002Fb>。','3．点 <b>添加<\u002Fb> — GO AHEAD 就有了自己的图标，全屏、离线打开。'];\n  }else if(android){\n    steps=en\n      ?['1． Tap the <b>⋮<\u002Fb> menu in your browser (top-right).','2． Tap <b>“Install app”<\u002Fb> or <b>“Add to Home screen”<\u002Fb>.','3． Confirm — it installs like a normal app and works offline.']\n      :['1．点浏览器右上角的 <b>⋮<\u002Fb> 菜单。','2．选择 <b>“安装应用”<\u002Fb> 或 <b>“添加到主屏幕”<\u002Fb>。','3．确认 — 像普通 App 一样安装，可离线使用。'];\n  }else{\n    steps=en\n      ?['Look for an <b>install icon<\u002Fb> in your browser’s address bar and click it.','Or open the browser menu and choose <b>“Install GO AHEAD”<\u002Fb>.','It opens in its own window and works offline.']\n      :['看浏览器地址栏里有没有 <b>安装图标<\u002Fb>，点它。','或打开浏览器菜单，选 <b>“安装 GO AHEAD”<\u002Fb>。','它会在独立窗口打开，可离线使用。'];\n  }\n  document.getElementById('install-body').innerHTML=steps.map(s=>'<div style=\"margin-bottom:9px\">'+s+'<\u002Fdiv>').join('');\n  openOv('installov');\n}\nfunction setTheme(th){\n  const root=document.documentElement;root.classList.add('ga-no-trans');\n  const fsCls=document.body.className.match(/fs-\\w+/);\n  document.body.className=th+(fsCls?' '+fsCls[0]:'');\n  S.theme=th;save();\n  const dark=th==='th-dark'||th==='th-forest'||th==='th-ocean';\n  document.getElementById('stars').style.display=dark?'block':'none';\n  document.querySelectorAll('input[name=th]').forEach(r=>r.checked=r.value===th);\n  void document.body.offsetHeight;\n  requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.remove('ga-no-trans')));\n}\nconst FS_LEVELS=['fs-sm','','fs-lg','fs-xl'];\nconst FS_LABELS=['小','中','大','特大'];\nconst FS_LABELS_EN=['S','M','L','XL'];\nfunction fsLabel(l){return (S&&S.lang==='en'?FS_LABELS_EN:FS_LABELS)[l];}\nfunction applyFontSize(lvl){\n  const l=Math.max(0,Math.min(3,lvl));\n  const cls=FS_LEVELS[l];\n  const th=S.theme||'th-light';\n  const fsCls=document.body.className.match(/fs-\\w+/);\n  if(fsCls)document.body.classList.remove(fsCls[0]);\n  if(cls)document.body.classList.add(cls);\n  const lbl=document.getElementById('fs-lbl');if(lbl)lbl.textContent=fsLabel(l);\n}\nfunction changeFontSize(delta){\n  S.fontSize=Math.max(0,Math.min(3,(S.fontSize||1)+delta));\n  applyFontSize(S.fontSize);save();showToast((S.lang==='en'?'Font: ':'字体: ')+fsLabel(S.fontSize));\n}\nfunction toggleTp(){document.getElementById('tp').classList.toggle('open');}\ndocument.addEventListener('click',e=>{const r=document.querySelector('.trow');if(r&&!r.contains(e.target))document.getElementById('tp').classList.remove('open');});\n(function(){const c=document.getElementById('stars');for(let i=0;i<100;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*2+.5;s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--dl:${Math.random()*5}s;opacity:${Math.random()*.5+.1}`;c.appendChild(s);}})();\n\nfunction showToast(msg){const c=document.getElementById('tw');const t=document.createElement('div');t.className='toast';t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),2200);}\nfunction confetti(){const cols=['#7c6cf8','#a78bfa','#f59e0b','#10b981','#ef4444','#3b82f6','#f472b6'];for(let i=0;i<60;i++){const el=document.createElement('div');el.className='cp';el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${cols[i%cols.length]};border-radius:${Math.random()>.5?'50%':'2px'};--dur:${1.5+Math.random()*1.5}s;--dl:${Math.random()*.8}s`;document.body.appendChild(el);setTimeout(()=>el.remove(),3000);}}\nfunction triggerLU(){confetti();document.getElementById('lusp').textContent=SPRITES[Math.min(S.spriteIdx,SPRITES.length-1)];document.getElementById('lulv').textContent='Lv. '+S.level;document.getElementById('luname').textContent=LVNAMES[Math.min(S.level-1,LVNAMES.length-1)];document.getElementById('luov').classList.add('show');}\nfunction closeLU(){document.getElementById('luov').classList.remove('show');}\nfunction openOv(id){document.getElementById(id).classList.add('show');}\nfunction closeOv(id){document.getElementById(id).classList.remove('show');}\nfunction openNameModal(){document.getElementById('nameinp').value=S.charName;openOv('nameov');setTimeout(()=>document.getElementById('nameinp').select(),50);}\nfunction saveName(){const v=document.getElementById('nameinp').value.trim().toUpperCase();if(v){S.charName=v;save();updateStats();}closeOv('nameov');}\ndocument.getElementById('nameinp').addEventListener('keydown',e=>{if(e.key==='Enter')saveName();});\nfunction cycleSpr(){S.spriteIdx=(S.spriteIdx+1)%SPRITES.length;save();updateStats();const el=document.getElementById('spr');el.style.transform='scale(1.3) rotate(15deg)';setTimeout(()=>el.style.transform='',200);}\n\n// recurrence day picker\nfunction updateAddRecurUI(){\n  const v=document.getElementById('trecur').value;\n  const wdSel=document.getElementById('weekday-sel');\n  if(wdSel)wdSel.style.display=(v==='weekly'||v==='biweekly')?'flex':'none';\n  const mSel=document.getElementById('monthly-day-sel');\n  if(mSel)mSel.style.display=v==='monthly'?'flex':'none';\n  const ySel=document.getElementById('yearly-sel');\n  if(ySel)ySel.style.display=v==='yearly'?'flex':'none';\n  // Auto type=daily when recur=daily\n  const ttype=document.getElementById('ttype');\n  if(ttype&&v==='daily')ttype.value='daily';\n}\ndocument.getElementById('trecur').addEventListener('change',updateAddRecurUI);\nfunction toggleDay(btn){btn.classList.toggle('on');}\n\n// stat edit\nfunction openStatEdit(key){const titles={gold:'修改金币',hp:'修改HP',level:'修改等级',xp:'修改XP'};document.getElementById('stat-title').textContent=titles[key];document.getElementById('statinp').value={gold:S.gold,hp:S.hp,level:S.level,xp:S.xp}[key]||0;document._statKey=key;openOv('statov');setTimeout(()=>document.getElementById('statinp').select(),50);}\nfunction saveStatEdit(){const v=parseInt(document.getElementById('statinp').value);if(isNaN(v))return;const k=document._statKey;if(k==='gold'){addLedger('gold',v-S.gold,'手动调整');S.gold=Math.max(0,v);}else if(k==='hp'){addLedger('hp',v-S.hp,'手动调整');S.hp=Math.max(0,Math.min(S.maxHp,v));}else if(k==='xp'){addLedger('xp',v-S.xp,'手动调整');S.xp=Math.max(0,v);}else if(k==='level'){S.level=Math.max(1,v);S.maxXp=Math.round(100*Math.pow(1.4,S.level-1));S.maxHp=100+20*(S.level-1);S.hp=S.maxHp;}save();updateStats();closeOv('statov');}\ndocument.getElementById('statinp').addEventListener('keydown',e=>{if(e.key==='Enter')saveStatEdit();});\n\n// export\nfunction doExport(){const j=JSON.stringify(S,null,2);document.getElementById('expta').value=j;try{navigator.clipboard.writeText(j);showToast('✅ 已复制');}catch(e){}const a=document.createElement('a');a.href='data:text/json;charset=utf-8,'+encodeURIComponent(j);a.download='goahead_'+new Date().toISOString().slice(0,10)+'.json';a.click();}\nfunction doImport(){const txt=document.getElementById('expta').value.trim();if(!txt){showToast('❌ 请先粘贴数据');return;}if(!confirm(S.lang==='en'?'Full import will OVERWRITE all current data (gold, level, records). Continue?':'完整导入会覆盖当前所有数据（金币、等级、记录）。确定继续？'))return;try{const p=JSON.parse(txt);if(!p.tasks)throw 0;S=p;S.tasks=S.tasks.map(t=>mkTask(t));['quadFilters','categories','tabOrder','tabLabels','shopItems','ledger','dailySummaries','trash'].forEach(k=>{if(!S[k])S[k]=defState()[k];});if(!S.logFilter)S.logFilter='';save();setTheme(S.theme||'th-light');buildTabs();buildCatUI();updateStats();render();showToast('✅ 导入成功');closeOv('expov');}catch(e){showToast('❌ 格式错误');}}\nfunction mergeImport(){const en=S.lang==='en';const txt=document.getElementById('expta').value.trim();if(!txt){showToast(en?'❌ Paste data first':'❌ 请先粘贴数据');return;}let p;try{p=JSON.parse(txt);}catch(e){showToast(en?'❌ Invalid format':'❌ 格式错误');return;}const incoming=Array.isArray(p)?p:(p&&Array.isArray(p.tasks)?p.tasks:null);if(!incoming){showToast(en?'❌ No tasks found':'❌ 没找到任务数据');return;}const have=new Set(S.tasks.map(t=>t.id));let added=0;incoming.forEach(rt=>{if(rt&&rt.id!==undefined&&!have.has(rt.id)){S.tasks.push(mkTask(rt));have.add(rt.id);added++;}});const maxId=S.tasks.reduce((mx,t)=>(typeof t.id==='number'&&t.id>mx)?t.id:mx,0);if((S.nextId||0)<=maxId)S.nextId=maxId+1;save();buildCatUI();render();showToast(en?('✅ Added '+added+' task'+(added===1?'':'s')):('✅ 已追加 '+added+' 个任务'));if(added>0)closeOv('expov');}\nfunction exportTxt(range){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),d=now.getDate();const lbl={day:'今日',month:'本月',year:'本年'}[range];const inR=ts=>{if(!ts)return false;const dt=new Date(ts);if(range==='day')return dt.getFullYear()===y&&dt.getMonth()===m&&dt.getDate()===d;if(range==='month')return dt.getFullYear()===y&&dt.getMonth()===m;return dt.getFullYear()===y;};let txt=`GO AHEAD — ${lbl}总结\\n${now.toLocaleString('zh-CN')}\\n${'='.repeat(36)}\\n\\n【任务清单】\\n`;S.tasks.forEach(t=>{txt+=`${t.done?'[✓]':'[ ]'} ${t.mustdo?'❗':''}${t.name}  [${TYPELBL[t.type]||t.type}][${t.cat||'-'}][${DIFFLBL[t.diff]}]${t.count>0?' 计数:'+t.count+(t.counterUnit||''):''}${t.recur?' 重复:'+RECURLBL[t.recur]:''}${t.doneTime?' 完成:'+t.doneTime:''}\\n`;});const dl=S.doneList.filter(e=>inR(e.ts));txt+=`\\n【${lbl}完成记录 (${dl.length}项)】\\n`;dl.forEach((e,i)=>{txt+=`${i+1}. ${e.name}  ${e.time||''}  +${e.xp}XP +${e.gold}金\\n`;});const sums=S.dailySummaries.filter(s=>inR(s.ts));if(sums.length){txt+=`\\n【日记】\\n`;sums.forEach(s=>{txt+=`${s.date}\\n${s.text}\\n\\n`;});}const a=document.createElement('a');a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);a.download=`goahead_${range}_${now.toISOString().slice(0,10)}.txt`;a.click();showToast(`✅ ${lbl}总结已导出`);}\n\n// categories\nfunction buildCatUI(){\n  const panel=document.getElementById('cat-chips');\n  let h=`<span class=\"catf${S.catFilter===''?' active':''}\" data-cat=\"\" onclick=\"setCatFilter('')\">全部<\u002Fspan>`;\n  S.categories.forEach(c=>{h+=`<span class=\"catf${S.catFilter===c.id?' active':''}\" data-cat=\"${c.id}\" onclick=\"setCatFilter('${c.id}')\">${c.label}<span onclick=\"event.stopPropagation();deleteCategory('${c.id}')\" style=\"margin-left:4px;opacity:.5;font-size:10px;cursor:pointer\">×<\u002Fspan><\u002Fspan>`;});\n  panel.innerHTML=h;\n  const sel=document.getElementById('tcat');if(sel){let o=`<option value=\"\">无分类<\u002Foption>`;S.categories.forEach(c=>{o+=`<option value=\"${c.id}\">${c.label}<\u002Foption>`;});sel.innerHTML=o;}\n}\nfunction toggleCatPanel(){const p=document.getElementById('catpanel');const b=document.getElementById('cat-toggle-btn');const open=p.classList.toggle('open');const en=(S.lang==='en');b.textContent=en?(open?'🏷 Category ▴':'🏷 Category ▾'):(open?'🏷 分类 ▴':'🏷 分类 ▾');}\nfunction setCatFilter(cat){S.catFilter=cat;const badge=document.getElementById('cat-active-badge');const c=S.categories.find(x=>x.id===cat);if(cat&&badge){badge.textContent='● '+(c?c.label:cat);badge.style.display='inline';}else if(badge){badge.style.display='none';}save();render();buildCatUI();}\nfunction addCategoryInline(){const name=document.getElementById('newcatname2').value.trim();const emoji=document.getElementById('newcatemoji2').value.trim()||'📌';if(!name)return;if(S.categories.find(c=>c.id===name)){showToast('分类已存在');return;}S.categories.push({id:name,label:emoji+' '+name});document.getElementById('newcatname2').value='';document.getElementById('newcatemoji2').value='';save();buildCatUI();showToast('✅ 分类已添加');}\nfunction addCategory(){const name=document.getElementById('newcatname').value.trim();const emoji=document.getElementById('newcatemoji').value.trim()||'📌';if(!name)return;if(S.categories.find(c=>c.id===name)){showToast('分类已存在');return;}S.categories.push({id:name,label:emoji+' '+name});save();buildCatUI();closeOv('catov');showToast('✅ 分类已添加');}\nfunction deleteCategory(id){if(!confirm('删除分类\"'+id+'\"？'))return;S.categories=S.categories.filter(c=>c.id!==id);if(S.catFilter===id)S.catFilter='';save();buildCatUI();render();}\n\n// tabs - draggable + renameable + menu system\nconst FIXED_TABS=['shop','log','donelist','trash'];\nconst MINI_TABS=['mustdo','donelist'];\n\nfunction getVisibleTabs(){\n  if(S.tabMode==='expand')return S.tabOrder;\n  if(S.tabMode==='mini')return S.tabOrder.filter(t=>MINI_TABS.includes(t));\n  // custom: filter out hidden\n  return S.tabOrder.filter(t=>!(S.tabHidden||[]).includes(t));\n}\n\nfunction buildTabs(){\n  const el=document.getElementById('tabs');\n  const visible=getVisibleTabs();\n  let h='';\n  visible.forEach(tab=>{\n    const lbl=S.tabLabels[tab]||tab;\n    const isActive=S.activeTab===tab;\n    const canRename=!FIXED_TABS.includes(tab);\n    if(renamingTab===tab){\n      h+=`<input class=\"tab-rename-inp\" id=\"rename-inp-${tab}\" value=\"${lbl}\" onblur=\"finishRename('${tab}')\" onkeydown=\"if(event.key==='Enter')finishRename('${tab}');if(event.key==='Escape'){renamingTab=null;buildTabs();}\">`;\n    } else {\n      h+=`<button class=\"tab${isActive?' active':''}\" draggable=\"true\" data-tab=\"${tab}\"\n        onclick=\"switchTab('${tab}')\"\n        ondblclick=\"${canRename?`startRename('${tab}')`:''}\"\n        ondragstart=\"tabDragStart(event,'${tab}')\"\n        ondragover=\"tabDragOver(event,'${tab}')\"\n        ondrop=\"tabDrop(event,'${tab}')\"\n        ondragleave=\"this.classList.remove('drag-over')\"\n        ondragend=\"document.querySelectorAll('.tab').forEach(t=>t.classList.remove('dragging','drag-over'))\"\n        title=\"${canRename?'双击重命名，拖动排序':''}\">${lbl}<\u002Fbutton>`;\n    }\n  });\n  el.innerHTML=h;\n  if(renamingTab){const inp=document.getElementById('rename-inp-'+renamingTab);if(inp){inp.focus();inp.select();}}\n  buildTabMenu();\n}\n\nfunction buildTabMenu(){\n  const vl=document.getElementById('tmenu-visible-list');\n  const hl=document.getElementById('tmenu-hidden-list');\n  if(!vl||!hl)return;\n  const hidden=S.tabHidden||[];\n  let vh='',hh='';\n  S.tabOrder.forEach(tab=>{\n    const lbl=S.tabLabels[tab]||tab;\n    const isHid=hidden.includes(tab);\n    if(!isHid){\n      vh+=`<div class=\"tmenu-row\"><label><input type=\"checkbox\" checked onchange=\"toggleTabHide('${tab}',this.checked)\"> ${lbl}<\u002Flabel><\u002Fdiv>`;\n    } else {\n      hh+=`<div class=\"tmenu-row\"><label><input type=\"checkbox\" onchange=\"toggleTabHide('${tab}',this.checked)\"> ${lbl}<\u002Flabel><\u002Fdiv>`;\n    }\n  });\n  vl.innerHTML=vh||'<div style=\"font-size:11px;color:var(--text3);padding:4px 6px\">无<\u002Fdiv>';\n  hl.innerHTML=hh||'<div style=\"font-size:11px;color:var(--text3);padding:4px 6px\">全部显示中<\u002Fdiv>';\n  syncNtpRadios();\n}\nfunction setNewTaskPos(p){S.newTaskPos=p;save();syncNtpRadios();showToast(p==='top'?'⬆️ 新任务加到顶部':'⬇️ 新任务加到底部');}\nfunction syncNtpRadios(){document.querySelectorAll('input[name=ntp]').forEach(r=>{r.checked=(r.value===(S.newTaskPos||'top'));});}\n\nfunction toggleTabMenu(){\n  const p=document.getElementById('tab-menu-panel');\n  const wasOpen=p.classList.contains('open');\n  p.classList.toggle('open');\n  if(!wasOpen)buildTabMenu();\n}\ndocument.addEventListener('click',e=>{\n  const wrap=document.getElementById('tab-menu-wrap');\n  if(wrap&&!wrap.contains(e.target))document.getElementById('tab-menu-panel')?.classList.remove('open');\n});\n\nfunction toggleTabHide(tab,checked){\n  if(checked){S.tabHidden=(S.tabHidden||[]).filter(t=>t!==tab);}\n  else{if(!(S.tabHidden||[]).includes(tab))(S.tabHidden=S.tabHidden||[]).push(tab);}\n  S.tabMode='custom';\n  save();buildTabs();\n}\n\nfunction setTabMode(mode){\n  S.tabMode=mode;\n  if(mode==='mini')S.tabHidden=S.tabOrder.filter(t=>!MINI_TABS.includes(t));\n  if(mode==='expand')S.tabHidden=[];\n  save();buildTabs();\n  document.getElementById('tab-menu-panel')?.classList.remove('open');\n  // If active tab is now hidden, switch to first visible\n  const vis=getVisibleTabs();\n  if(!vis.includes(S.activeTab))switchTab(vis[0]||'all');\n}\nfunction startRename(tab){renamingTab=tab;buildTabs();}\nfunction finishRename(tab){const inp=document.getElementById('rename-inp-'+tab);if(inp&&inp.value.trim())S.tabLabels[tab]=inp.value.trim();renamingTab=null;save();buildTabs();}\nlet dragTab=null;\nfunction tabDragStart(e,tab){dragTab=tab;e.target.classList.add('dragging');e.dataTransfer.effectAllowed='move';}\nfunction tabDragOver(e,tab){e.preventDefault();e.dataTransfer.dropEffect='move';if(tab!==dragTab)document.querySelector(`[data-tab=\"${tab}\"]`)?.classList.add('drag-over');}\nfunction tabDrop(e,tab){e.preventDefault();if(!dragTab||dragTab===tab)return;const from=S.tabOrder.indexOf(dragTab),to=S.tabOrder.indexOf(tab);if(from>-1&&to>-1){S.tabOrder.splice(from,1);S.tabOrder.splice(to,0,dragTab);}save();buildTabs();}\n\n// ── Mobile touch drag for tasks ──\n// ── Unified touch drag-to-reorder (tasks / fragments / shop / tabs) ──\nlet _tsState=null;\nfunction _arrMove(arr,fromId,toId,getId){\n  const fi=arr.findIndex(x=>getId(x)===fromId),ti=arr.findIndex(x=>getId(x)===toId);\n  if(fi<0||ti<0||fi===ti)return false;\n  const [m]=arr.splice(fi,1);arr.splice(ti,0,m);return true;\n}\nfunction _tsClone(el){\n  const r=el.getBoundingClientRect();\n  const c=el.cloneNode(true);\n  c.style.cssText='position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;margin:0;opacity:.88;z-index:9999;pointer-events:none;box-shadow:0 14px 32px rgba(0,0,0,.28);';\n  document.body.appendChild(c);return c;\n}\nfunction initTouchSort(){\n  const HANDLE=[\n    {item:'.titem',     id:'id',  cast:v=>parseInt(v), arr:()=>S.tasks,     getId:x=>x.id},\n    {item:'.frag-card', id:'fid', cast:v=>parseInt(v), arr:()=>S.tasks,     getId:x=>x.id},\n    {item:'.shop-item', id:'sid', cast:v=>v,           arr:()=>S.shopItems, getId:x=>x.id, skip:el=>el.classList.contains('donefade')},\n  ];\n  const clearOver=sel=>document.querySelectorAll(sel).forEach(i=>i.classList.remove('drag-over-task','drag-over'));\n\n  document.addEventListener('touchstart',e=>{\n    const t=e.touches[0];\n    const handle=e.target.closest('.drag-handle');\n    if(handle){\n      for(const cfg of HANDLE){\n        const item=handle.closest(cfg.item);\n        if(item){\n          if(cfg.skip&&cfg.skip(item))return;\n          _tsState={cfg,item,sel:cfg.item,sx:t.clientX,sy:t.clientY,clone:_tsClone(item),moved:true,tab:false};\n          item.classList.add('dragging-mobile');e.preventDefault();return;\n        }\n      }\n    }\n    const tab=e.target.closest('.tab[draggable]');\n    if(tab){_tsState={cfg:null,item:tab,sel:'.tab',sx:t.clientX,sy:t.clientY,clone:null,moved:false,tab:true};}\n  },{passive:false});\n\n  document.addEventListener('touchmove',e=>{\n    if(!_tsState)return;const t=e.touches[0],st=_tsState;\n    if(st.tab&&!st.moved){\n      if(Math.abs(t.clientX-st.sx)+Math.abs(t.clientY-st.sy)<10)return;\n      st.moved=true;st.clone=_tsClone(st.item);st.item.classList.add('dragging-mobile');\n    }\n    if(!st.moved)return;\n    if(st.clone){st.clone.style.left=(t.clientX-st.clone.offsetWidth/2)+'px';st.clone.style.top=(t.clientY-22)+'px';st.clone.style.display='none';}\n    const el=document.elementFromPoint(t.clientX,t.clientY);\n    if(st.clone)st.clone.style.display='';\n    clearOver(st.sel);\n    const over=el&&el.closest(st.sel);\n    if(over&&over!==st.item)over.classList.add(st.tab?'drag-over':'drag-over-task');\n    e.preventDefault();\n  },{passive:false});\n\n  document.addEventListener('touchend',e=>{\n    if(!_tsState)return;const st=_tsState;_tsState=null;\n    if(st.clone)st.clone.remove();\n    st.item.classList.remove('dragging-mobile');\n    clearOver(st.sel);\n    if(!st.moved)return; // a tap → let the normal click (tab switch) fire\n    const t=e.changedTouches[0];\n    const el=document.elementFromPoint(t.clientX,t.clientY);\n    const target=el&&el.closest(st.sel);\n    if(target&&target!==st.item){\n      if(st.tab){\n        if(_arrMove(S.tabOrder,st.item.dataset.tab,target.dataset.tab,x=>x)){save();buildTabs();}\n      }else{\n        const cfg=st.cfg;\n        if(_arrMove(cfg.arr(),cfg.cast(st.item.dataset[cfg.id]),cfg.cast(target.dataset[cfg.id]),cfg.getId)){save();render();}\n      }\n    }\n    if(st.tab){const sup=ev=>{ev.stopPropagation();ev.preventDefault();document.removeEventListener('click',sup,true);};document.addEventListener('click',sup,true);setTimeout(()=>document.removeEventListener('click',sup,true),360);}\n  });\n}\ninitTouchSort();\n\nfunction switchTab(tab){\n  S.activeTab=tab;disableMultiselect();\n  buildTabs();syncAddForm();\n  if(tab==='mustdo'){const tm=document.getElementById('tmustdo');if(tm)tm.checked=true;document.getElementById('afw').style.display='block';}\n  if(['habit','daily','todo','archive'].includes(tab)){const ts=document.getElementById('ttype');if(ts)ts.value=tab;}\n  save();render();\n}\n\n// multiselect\nfunction toggleMultiselect(){multiselect=!multiselect;if(!multiselect){bulkSel.clear();}document.getElementById('ms-btn').classList.toggle('on',multiselect);document.getElementById('bulkbar').classList.toggle('visible',multiselect&&bulkSel.size>0);render();}\nfunction disableMultiselect(){multiselect=false;bulkSel.clear();document.getElementById('ms-btn').classList.remove('on');document.getElementById('bulkbar').classList.remove('visible');render();}\nfunction toggleBulk(id){if(!multiselect)return;if(bulkSel.has(id))bulkSel.delete(id);else bulkSel.add(id);document.getElementById('bulkcount').textContent='已选'+bulkSel.size+'项';document.getElementById('bulkbar').classList.toggle('visible',bulkSel.size>0);render();}\nfunction bulkComplete(){bulkSel.forEach(id=>{const t=S.tasks.find(x=>x.id===id);if(t&&!t.done){t.done=true;t.doneTime=nowStr();t.doneTs=Date.now();gainRewards(t,id,true);}});save();disableMultiselect();render();}\nfunction bulkArchive(){bulkSel.forEach(id=>{const t=S.tasks.find(x=>x.id===id);if(t){t.type='archive';t.mustdo=false;}});save();disableMultiselect();render();}\nfunction bulkMustdo(v){bulkSel.forEach(id=>{const t=S.tasks.find(x=>x.id===id);if(t)t.mustdo=v;});save();disableMultiselect();render();}\nfunction toggleDoneBulk(id){if(bulkSel.has(id))bulkSel.delete(id);else bulkSel.add(id);render();}\nfunction bulkDeleteDone(){if(!bulkSel.size||!confirm(\"删除选中的\"+bulkSel.size+\"条完成记录？\"))return;bulkSel.forEach(id=>{S.doneList=S.doneList.filter(x=>x.id!==id);});bulkSel.clear();disableMultiselect();save();render();}\nfunction bulkDelete(){if(!confirm('确定删除'+bulkSel.size+'项？'))return;bulkSel.forEach(id=>softDelete(id));save();disableMultiselect();render();}\n\n// FAB\nfunction focusAdd(){\n  const hideForm=['donelist','shop','log','trash','today','stats','fragments','focus'].includes(S.activeTab);\n  if(hideForm)S.activeTab='all';\n  S.addFormOpen=true;\n  save();\n  buildTabs();\n  syncAddForm();\n  const afw=document.getElementById('afw');if(afw)afw.style.display='block';\n  setTimeout(()=>{\n    const inp=document.getElementById('ti');\n    if(inp){inp.focus();inp.scrollIntoView({behavior:'smooth',block:'center'});}\n  },80);\n  if(hideForm)render();\n}\nfunction toggleAddForm(){\n  S.addFormOpen=!S.addFormOpen;\n  save();\n  syncAddForm();\n}\nfunction syncAddForm(){\n  const el=document.getElementById('aform-el');\n  const btn=document.getElementById('aform-toggle-btn');\n  const afw=document.getElementById('afw');\n  const hideTab=['donelist','shop','log','trash','today','stats','fragments','focus'].includes(S.activeTab);\n  if(afw)afw.style.display=hideTab?'none':'block';\n  if(el)el.style.display=(!hideTab&&S.addFormOpen)?'block':'none';\n  if(btn)btn.textContent=S.addFormOpen?'▴ 收起表单':'▾ 添加任务';\n}\n\n// add task\nfunction addTask(){\n  const name=document.getElementById('ti').value.trim();if(!name)return;\n  const recurSel=document.getElementById('trecur').value;\n  const recurDays=[...document.querySelectorAll('.day-btn.on')].map(b=>parseInt(b.dataset.d));\n  let ttype=document.getElementById('ttype').value;\n  // Auto-sync: daily type <-> daily recur\n  if(recurSel==='daily')ttype='daily';\n  if(ttype==='daily'&&recurSel!=='daily'){document.getElementById('trecur').value='daily';}\n  const _newTask=mkTask({id:S.nextId++,name,type:ttype,quad:document.getElementById('tquad').value,diff:document.getElementById('tdiff').value,cat:document.getElementById('tcat').value,mustdo:!!(document.getElementById('tmustdo')&&document.getElementById('tmustdo').checked),counterGoal:parseInt(document.getElementById('tgoal').value)||0,counterUnit:document.getElementById('tgoalunit').value.trim()||'次',minReq:parseInt(document.getElementById('treq').value)||0,minReqUnit:document.getElementById('trequnit').value.trim()||'次',minReqDesc:document.getElementById('treqdesc').value.trim(),deadline:document.getElementById('tdl').value,recur:recurSel,recurDays,recurMonthDay:parseInt(document.getElementById('tmonthday')?.value)||1,recurMonth:parseInt(document.getElementById('tymonth')?.value)||1,recurDay:parseInt(document.getElementById('tyday')?.value)||1});if((S.newTaskPos||'top')==='bottom'){S.tasks.push(_newTask);}else{S.tasks.unshift(_newTask);}\n  ['ti','treqdesc','treq','trequnit','tdl','tgoal','tgoalunit'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});\n  refreshCalTriggers();\n  document.getElementById('trecur').value='';document.getElementById('weekday-sel').style.display='none';document.getElementById('monthly-day-sel').style.display='none';document.getElementById('yearly-sel').style.display='none';\n  document.querySelectorAll('.day-btn.on').forEach(b=>b.classList.remove('on'));\n  const tm=document.getElementById('tmustdo');if(tm)tm.checked=false;\n  save();render();\n}\n\n// steps\nfunction addStep(tid){const inp=document.getElementById('sinp-'+tid);const name=inp?inp.value.trim():'';if(!name)return;const t=S.tasks.find(x=>x.id===tid);if(!t)return;if(!t.steps)t.steps=[];t.steps.push({id:S.nextStepId++,name,done:false});expandedSteps.add(tid);inp.value='';save();render();}\nfunction toggleStep(tid,sid){const t=S.tasks.find(x=>x.id===tid);if(!t)return;const s=(t.steps||[]).find(x=>x.id===sid);if(s)s.done=!s.done;save();render();}\nfunction deleteStep(tid,sid){const t=S.tasks.find(x=>x.id===tid);if(!t)return;t.steps=t.steps.filter(x=>x.id!==sid);save();render();}\nfunction toggleMinReqDone(tid){const t=S.tasks.find(x=>x.id===tid);if(!t||t.done)return;t.minReqDone=!t.minReqDone;save();render();}\n\n// ── Custom bilingual date picker ──\nfunction fmtDateTime(ts){if(!ts)return '';const dt=new Date(ts);const loc=S.lang==='en'?'en-US':'zh-CN';const opt=S.lang==='en'?{month:'short',day:'numeric',weekday:'short'}:{month:'numeric',day:'numeric',weekday:'short'};return dt.toLocaleDateString(loc,opt)+' '+dt.toLocaleTimeString(loc,{hour:'2-digit',minute:'2-digit'});}\nconst CAL_MONTHS_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];\nconst CAL_WD_EN=['Su','Mo','Tu','We','Th','Fr','Sa'];\nconst CAL_WD_ZH=['日','一','二','三','四','五','六'];\nlet calState=null;\nfunction fmtCalLabel(iso){\n  const en=S.lang==='en';\n  if(!iso)return en?'mm/dd/yyyy':'年/月/日';\n  const p=iso.split('-').map(Number);if(p.length<3)return iso;\n  const[y,m,d]=p;const pad=n=>String(n).padStart(2,'0');\n  return en?`${pad(m)}/${pad(d)}/${y}`:`${y}/${pad(m)}/${pad(d)}`;\n}\nfunction refreshCalTriggers(){\n  document.querySelectorAll('.cal-trigger[data-cal-target]').forEach(b=>{\n    const inp=document.getElementById(b.getAttribute('data-cal-target'));\n    const iso=inp?inp.value:'';\n    b.textContent=fmtCalLabel(iso);\n    b.classList.toggle('empty',!iso);\n  });\n}\nfunction openCal(targetId,btnId){\n  const inp=document.getElementById(targetId);\n  const iso=inp&&inp.value?inp.value:'';\n  const base=iso?new Date(iso+'T00:00'):new Date();\n  calState={target:targetId,btn:btnId,vy:base.getFullYear(),vm:base.getMonth(),sel:iso};\n  renderCalPop();\n}\nfunction calNav(delta){calState.vm+=delta;if(calState.vm<0){calState.vm=11;calState.vy--;}if(calState.vm>11){calState.vm=0;calState.vy++;}renderCalPop();}\nfunction calPick(iso){\n  const inp=document.getElementById(calState.target);if(inp)inp.value=iso;\n  const b=document.getElementById(calState.btn);if(b){b.textContent=fmtCalLabel(iso);b.classList.toggle('empty',!iso);}\n  closeCal();\n}\nfunction calClear(){calPick('');}\nfunction calToday(){const n=new Date();const iso=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;calPick(iso);}\nfunction closeCal(){const bd=document.getElementById('cal-backdrop');if(bd)bd.remove();calState=null;}\nfunction renderCalPop(){\n  const en=S.lang==='en';\n  let bd=document.getElementById('cal-backdrop');\n  if(!bd){bd=document.createElement('div');bd.id='cal-backdrop';bd.className='cal-backdrop';bd.onclick=e=>{if(e.target===bd)closeCal();};document.body.appendChild(bd);}\n  const y=calState.vy,m=calState.vm;\n  const startDow=new Date(y,m,1).getDay();\n  const days=new Date(y,m+1,0).getDate();\n  const n2=new Date();const todayIso=`${n2.getFullYear()}-${String(n2.getMonth()+1).padStart(2,'0')}-${String(n2.getDate()).padStart(2,'0')}`;\n  const title=en?`${CAL_MONTHS_EN[m]} ${y}`:`${y}年${m+1}月`;\n  const wd=en?CAL_WD_EN:CAL_WD_ZH;\n  let cells='';\n  for(let i=0;i<startDow;i++)cells+=`<button class=\"cal-day other\" disabled><\u002Fbutton>`;\n  for(let d=1;d<=days;d++){\n    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;\n    const cls=['cal-day'];if(iso===calState.sel)cls.push('sel');if(iso===todayIso)cls.push('today');\n    cells+=`<button class=\"${cls.join(' ')}\" onclick=\"calPick('${iso}')\">${d}<\u002Fbutton>`;\n  }\n  bd.innerHTML=`<div class=\"cal-card\" onclick=\"event.stopPropagation()\">\n    <div class=\"cal-hd\"><button class=\"cal-nav\" onclick=\"calNav(-1)\">‹<\u002Fbutton><div class=\"cal-title\">${title}<\u002Fdiv><button class=\"cal-nav\" onclick=\"calNav(1)\">›<\u002Fbutton><\u002Fdiv>\n    <div class=\"cal-grid\">${wd.map(w=>`<div class=\"cal-wd\">${w}<\u002Fdiv>`).join('')}${cells}<\u002Fdiv>\n    <div class=\"cal-ft\"><button class=\"clr\" onclick=\"calClear()\">${en?'Clear':'清除'}<\u002Fbutton><button onclick=\"calToday()\">${en?'Today':'今天'}<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction toggleSteps(tid){if(expandedSteps.has(tid))expandedSteps.delete(tid);else expandedSteps.add(tid);render();}\nfunction toggleAllSteps(){const ids=getVisibleTaskIds();const anyCollapsed=ids.some(id=>!expandedSteps.has(id));if(anyCollapsed)ids.forEach(id=>expandedSteps.add(id));else ids.forEach(id=>expandedSteps.delete(id));const b=document.getElementById('steps-btn');if(b)b.classList.toggle('on',anyCollapsed);render();}\n\n// counter\nfunction bump(tid,delta){const t=S.tasks.find(x=>x.id===tid);if(!t)return;const inp=document.getElementById('csi-'+tid);const step=inp?Math.max(1,parseInt(inp.value)||1):1;t.count=Math.max(0,t.count+(delta>0?step:-step));if(t.minReq>0&&t.count>=t.minReq&&!t.minReqDone)t.minReqDone=true;if(t.counterGoal>0&&t.count>=t.counterGoal&&!t.done){t.done=true;t.doneTime=nowStr();t.doneTs=Date.now();gainRewards(t,tid);}save();render();}\n\n// complete/undo/delete\nfunction completeTask(id){const t=S.tasks.find(x=>x.id===id);if(!t||t.done)return;pushUndo(t);t.done=true;t.doneTime=nowStr();t.doneTs=Date.now();gainRewards(t,id);save();render();}\nfunction undoTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;const idx=S.undoStack.findIndex(u=>u.id===id);if(idx>-1){const snap=S.undoStack.splice(idx,1)[0];Object.assign(t,snap);}else{t.done=false;t.doneTime='';t.minReqDone=false;}const xp=Math.round((XPMAP[t.diff]||10)*(QUADXP[t.quad]||1));const gold=GOLDMAP[t.diff]||8;S.xp=Math.max(0,S.xp-xp);S.gold=Math.max(0,S.gold-gold);addLedger('xp',-xp,'撤销: '+t.name);addLedger('gold',-gold,'撤销: '+t.name);S.doneList=S.doneList.filter(d=>d.taskId!==id);updateStats();save();render();showToast('↩ 已恢复到未完成');}\nfunction pushUndo(t){S.undoStack.push(JSON.parse(JSON.stringify(t)));if(S.undoStack.length>40)S.undoStack.shift();}\nfunction softDelete(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;S.trash.unshift({...t,deletedAt:nowStr(),deletedTs:Date.now()});if(S.trash.length>50)S.trash=S.trash.slice(0,50);S.tasks=S.tasks.filter(x=>x.id!==id);}\nfunction deleteTask(id){if(!confirm('确定删除？（可在\"最近删除\"中恢复）'))return;softDelete(id);save();render();}\nfunction restoreFromTrash(id){const item=S.trash.find(x=>x.id===id);if(!item)return;const{deletedAt,deletedTs,...task}=item;S.tasks.push(mkTask(task));S.trash=S.trash.filter(x=>x.id!==id);save();render();showToast('✅ 已恢复');}\nfunction permDelete(id){if(!confirm('永久删除？无法恢复'))return;S.trash=S.trash.filter(x=>x.id!==id);save();render();}\nfunction gainRewards(t,id,silent=false){const xp=Math.round((XPMAP[t.diff]||10)*(QUADXP[t.quad]||1));const gold=GOLDMAP[t.diff]||8;S.xp+=xp;S.gold+=gold;addLedger('xp',xp,'完成: '+t.name);addLedger('gold',gold,'完成: '+t.name);S.doneList.unshift({id:'d'+Date.now(),taskId:id,name:t.name,xp,gold,diff:t.diff,cat:t.cat,time:nowStr(),ts:Date.now()});if(S.doneList.length>300)S.doneList=S.doneList.slice(0,300);let lv=false;while(S.xp>=S.maxXp){S.xp-=S.maxXp;S.level++;S.maxXp=Math.round(S.maxXp*1.4);S.maxHp+=20;S.hp=S.maxHp;lv=true;}if(lv)triggerLU();else if(!silent)showToast('+'+xp+' XP  +'+gold+(S.lang==='en'?' gold':' 金币'));flashTask(id);save();updateStats();}\nfunction flashTask(id){const el=document.querySelector(`[data-id=\"${id}\"]`);if(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}}\nfunction nowStr(){return new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}\n\n// stats\nfunction updateStats(){document.getElementById('gv').textContent=S.gold;const hv=document.getElementById('hpv');if(hv)hv.textContent=S.hp;document.getElementById('lv').textContent='Lv.'+S.level;document.getElementById('hpt').textContent=S.hp+'/'+S.maxHp;document.getElementById('xpt').textContent=S.xp+'/'+S.maxXp;document.getElementById('hpb').style.width=Math.round(S.hp/S.maxHp*100)+'%';document.getElementById('xpb').style.width=Math.round(S.xp/S.maxXp*100)+'%';document.getElementById('cname').textContent=S.charName||'ADVENTURER';document.getElementById('lvb').textContent='Lv. '+S.level;document.getElementById('spr').textContent=SPRITES[Math.min(S.spriteIdx,SPRITES.length-1)];}\nfunction fmtDL(d){if(!d)return null;const diff=Math.ceil((new Date(d+' 00:00')-new Date())/864e5);if(diff<0)return{text:'已过期',urg:true};if(diff===0)return{text:'今天到期',urg:true};if(diff<=3)return{text:diff+'天后到期',urg:true};return{text:diff+'天后',urg:false};}\n\n// edit task\nfunction toggleEdit(id){editingId=editingId===id?null:id;render();}\nfunction saveEdit(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;const g=k=>document.getElementById(k+id);if(g('en-')&&g('en-').value.trim())t.name=g('en-').value.trim();if(g('ety-'))t.type=g('ety-').value;const emd=document.getElementById('emd-'+id);if(emd)t.mustdo=emd.checked;if(g('eq-'))t.quad=g('eq-').value;if(g('ed-'))t.diff=g('ed-').value;if(g('ec-'))t.cat=g('ec-').value;if(g('edl-'))t.deadline=g('edl-').value;if(g('ego-'))t.counterGoal=parseInt(g('ego-').value)||0;if(g('egou-'))t.counterUnit=g('egou-').value.trim()||'次';if(g('ereq-'))t.minReq=parseInt(g('ereq-').value)||0;if(g('erequ-'))t.minReqUnit=g('erequ-').value.trim()||'次';if(g('ereqd-'))t.minReqDesc=g('ereqd-').value.trim();const er=document.getElementById('erecur-'+id);if(er){t.recur=er.value;// Auto-sync daily type <-> daily recur\nif(t.recur==='daily')t.type='daily';else if(t.type==='daily'&&t.recur!=='daily')t.recur='daily';}// Save weekday selections\nconst dayBtns=document.querySelectorAll(`.day-btn[data-eid='${id}']`);if(dayBtns.length)t.recurDays=[...dayBtns].filter(b=>b.classList.contains('on')).map(b=>parseInt(b.dataset.d));// Save monthly date\nconst md=document.getElementById('erecur-md-'+id);if(md)t.recurMonthDay=parseInt(md.value)||1;const ym=document.getElementById('erecur-ym-'+id);if(ym)t.recurMonth=parseInt(ym.value)||1;const yd=document.getElementById('erecur-yd-'+id);if(yd)t.recurDay=parseInt(yd.value)||1;const eft=document.getElementById('eft-'+id);if(eft!==null)t.fragTag=eft.checked;editingId=null;save();render();}\n\n// done list\nfunction toggleDoneGroup(key){\n  if(!S.doneGroupCollapsed)S.doneGroupCollapsed={};\nif(!S.tabDoneCollapsed)S.tabDoneCollapsed={section:false,today:false,past:true};\nif(!S.pwaIconColor)S.pwaIconColor='#ffffff';\nif(!S.pwaBgColor)S.pwaBgColor='#f5f4f0';\n  // Determine current state (default: collapsed for non-today)\n  const now_=new Date();\n  const todayKey_=now_.toDateString();\n  const defaultCollapsed=key!==todayKey_;\n  const current=S.doneGroupCollapsed[key]!==undefined?S.doneGroupCollapsed[key]:defaultCollapsed;\n  S.doneGroupCollapsed[key]=!current;\n  save();render();\n}\nfunction collapseAllDoneGroups(){\n  if(!S.doneGroupCollapsed)S.doneGroupCollapsed={};\nif(!S.tabDoneCollapsed)S.tabDoneCollapsed={section:false,today:false,past:true};\nif(!S.pwaIconColor)S.pwaIconColor='#ffffff';\nif(!S.pwaBgColor)S.pwaBgColor='#f5f4f0';\n  // Collapse all except today\n  S.doneList.forEach(d=>{\n    if(!d.ts)return;\n    const k=new Date(d.ts).toDateString();\n    const todayKey_=new Date().toDateString();\n    if(k!==todayKey_)S.doneGroupCollapsed[k]=true;\n  });\n  save();render();\n}\nfunction expandAllDoneGroups(){\n  if(!S.doneGroupCollapsed)S.doneGroupCollapsed={};\nif(!S.tabDoneCollapsed)S.tabDoneCollapsed={section:false,today:false,past:true};\nif(!S.pwaIconColor)S.pwaIconColor='#ffffff';\nif(!S.pwaBgColor)S.pwaBgColor='#f5f4f0';\n  S.doneList.forEach(d=>{\n    if(!d.ts)return;\n    S.doneGroupCollapsed[new Date(d.ts).toDateString()]=false;\n  });\n  save();render();\n}\nfunction toggleDoneExpand(id){if(expandedDone.has(id))expandedDone.delete(id);else expandedDone.add(id);render();}\nfunction saveDoneEdit(id){const e=S.doneList.find(x=>x.id===id);if(!e)return;const g=k=>document.getElementById(k+id);if(g('den-')&&g('den-').value.trim())e.name=g('den-').value.trim();if(g('ded-'))e.diff=g('ded-').value;if(g('dec-'))e.cat=g('dec-').value;if(g('det-')&&g('det-').value){const d=new Date(g('det-').value);e.ts=d.getTime();e.time=d.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}save();render();showToast('✅ 已保存');}\nfunction undoDoneEntry(id){const e=S.doneList.find(x=>x.id===id);if(!e)return;if(e.taskId){const t=S.tasks.find(x=>x.id===e.taskId);if(t&&t.done){undoTask(e.taskId);return;}}S.doneList=S.doneList.filter(x=>x.id!==id);save();render();showToast('↩ 已从记录移除');}\nfunction addDoneEntry(){const name=document.getElementById('dename').value.trim();if(!name)return;const diff=document.getElementById('dediff').value;const xp=XPMAP[diff]||10;const gold=GOLDMAP[diff]||8;S.doneList.unshift({id:'d'+Date.now(),name,xp,gold,diff,cat:document.getElementById('decat').value,time:nowStr(),ts:Date.now()});S.xp+=xp;S.gold+=gold;addLedger('xp',xp,'手动: '+name);addLedger('gold',gold,'手动: '+name);let lv=false;while(S.xp>=S.maxXp){S.xp-=S.maxXp;S.level++;S.maxXp=Math.round(S.maxXp*1.4);S.maxHp+=20;S.hp=S.maxHp;lv=true;}if(lv)triggerLU();else showToast('+'+xp+' XP  +'+gold);document.getElementById('dename').value='';updateStats();save();render();}\n\n// summary\nfunction skipSummary(){closeOv('sumov');}\nfunction saveSummary(){const text=document.getElementById('sum-input').value.trim();const date=document.getElementById('sum-date').textContent.replace('的回顾','');if(text){const ts=Date.now();S.dailySummaries.unshift({id:'sum'+ts,date,text,ts});S.xp+=20;S.gold+=10;addLedger('xp',20,'日记');addLedger('gold',10,'日记');while(S.xp>=S.maxXp){S.xp-=S.maxXp;S.level++;S.maxXp=Math.round(S.maxXp*1.4);S.maxHp+=20;S.hp=S.maxHp;}updateStats();save();showToast(S.lang==='en'?'📝 +20XP +10 gold':'📝 +20XP +10金');}closeOv('sumov');}\n\n// shop\nfunction openShopEdit(id){shopEditId=id;const item=S.shopItems.find(x=>x.id===id);if(!item)return;document.getElementById('se-name').value=item.name;document.getElementById('se-cost').value=item.cost;openOv('shopEditOv');}\nfunction saveShopEdit(){const item=S.shopItems.find(x=>x.id===shopEditId);if(!item)return;const name=document.getElementById('se-name').value.trim();const cost=parseInt(document.getElementById('se-cost').value)||0;if(name)item.name=name;if(cost>0)item.cost=cost;save();render();closeOv('shopEditOv');}\nfunction addShopItem(){const name=document.getElementById('shop-name').value.trim();const cost=parseInt(document.getElementById('shop-cost').value)||0;if(!name||cost<=0)return;S.shopItems.push({id:'s'+Date.now(),name,cost,bought:false});document.getElementById('shop-name').value='';document.getElementById('shop-cost').value='';save();render();}\nfunction buyShopItem(id){const item=S.shopItems.find(x=>x.id===id);if(!item||item.bought)return;if(S.gold<item.cost){showToast('❌ 金币不足！还差'+(item.cost-S.gold));return;}if(!confirm('花费 '+item.cost+' 金币购买\"'+item.name+'\"？'))return;S.gold-=item.cost;const buyTime=nowStr();const buyTs=Date.now();addLedger('gold',-item.cost,'购买: '+item.name,buyTs);item.bought=true;item.boughtAt=buyTime;item.boughtTs=buyTs;S.doneList.unshift({id:'d'+buyTs,name:'🛒 购买：'+item.name,xp:0,gold:-item.cost,diff:'easy',cat:'生活',time:buyTime,ts:buyTs});updateStats();save();render();showToast('🎉 购买成功！-'+item.cost);confetti();}\nfunction deleteShopItem(id){S.shopItems=S.shopItems.filter(x=>x.id!==id);save();render();}\n\n// render\nfunction render(){\n  const list=document.getElementById('tlist');\n  {const _gmb=document.getElementById('global-ms-bar');if(_gmb)_gmb.style.display=['all','today','mustdo','habit','daily','todo','archive'].includes(S.activeTab)?'flex':'none';}\n\n\n  if(S.activeTab==='today'){\n    const now=new Date();const todayStr=now.toDateString();\n    const urgent=S.tasks.filter(t=>!t.done&&t.deadline&&fmtDL(t.deadline)?.urg);\n    const daily=S.tasks.filter(t=>!t.done&&t.type==='daily');\n    const mustdo=S.tasks.filter(t=>!t.done&&t.mustdo);\n    const recurToday=S.tasks.filter(t=>!t.done&&t.recur&&t.type!=='daily'&&!t.mustdo);\n    const allToday=[...new Set([...urgent,...daily,...mustdo,...recurToday])];\n    let h=`<div style=\"font-size:12px;color:var(--text2);margin-bottom:12px\">📅 ${now.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}<\u002Fdiv>`;\n    // Today: 今日必做 + 其它今日\n    const todayMustdo=S.tasks.filter(t=>!t.done&&t.mustdo);\n    const todayDOW=now.getDay();\n    const todayDate=now.getDate();\n    const todayMidnight=new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59,59,999).getTime();\n    const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0,0,0).getTime();\n\n    function matchesRecurToday(t){\n      if(!t.recur)return false;\n      if(t.recur==='daily')return true;\n      if(t.recur==='weekly')return !t.recurDays||!t.recurDays.length||t.recurDays.includes(todayDOW);\n      if(t.recur==='biweekly'){\n        const dayOk=!t.recurDays||!t.recurDays.length||t.recurDays.includes(todayDOW);\n        if(!dayOk)return false;\n        const jan1=new Date(now.getFullYear(),0,1);\n        const wk=Math.ceil(((now-jan1)/86400000+jan1.getDay()+1)/7);\n        return wk%2===0;\n      }\n      if(t.recur==='monthly')return (t.recurMonthDay||1)===todayDate;\n      if(t.recur==='yearly')return (t.recurMonth||1)-1===now.getMonth()&&(t.recurDay||1)===todayDate;\n      return false;\n    }\n\n    function deadlineIsToday(t){\n      if(!t.deadline)return false;\n      // deadline date string, compare as YYYY-MM-DD\n      return t.deadline===now.toISOString().slice(0,10);\n    }\n    function deadlineIsPast(t){\n      if(!t.deadline)return false;\n      return t.deadline<now.toISOString().slice(0,10);\n    }\n\n    // 其它今日: recurring today OR deadline today/past — includes ALL types (even archive for reminders)\n    const todayOther=S.tasks.filter(t=>{\n      if(t.done||t.mustdo)return false;\n      return matchesRecurToday(t)||deadlineIsToday(t)||deadlineIsPast(t);\n    });\n\n    const todayAll=[...new Set([...todayMustdo,...todayOther])];\n    const tc=S.todayCollapsed||{mustdo:false,other:false,done:true};\n    if(!todayAll.length){h+='<div class=\"empty\">🎉 今日任务全部完成！<\u002Fdiv>';}\n    else{\n      if(todayMustdo.length){\n        const col=tc.mustdo;\n        h+=`<div class=\"today-section\">\n          <div class=\"today-section-hdr collapsible-hdr\" onclick=\"toggleTodaySection('mustdo')\" style=\"cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px\">\n            <span style=\"font-size:11px;color:var(--acc2);transition:transform .2s;display:inline-block;transform:rotate(${col?'-90':'0'}deg)\">▾<\u002Fspan>\n            ❗ 今日必做 <span style=\"font-size:11px;color:var(--text3)\">(${todayMustdo.length})<\u002Fspan>\n          <\u002Fdiv>`;\n        if(!col)todayMustdo.forEach(t=>h+=taskHtml(t));\n        h+=`<\u002Fdiv>`;\n      }\n      if(todayOther.length){\n        const col=tc.other;\n        h+=`<div class=\"today-section\">\n          <div class=\"today-section-hdr collapsible-hdr\" onclick=\"toggleTodaySection('other')\" style=\"cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px\">\n            <span style=\"font-size:11px;color:var(--acc2);transition:transform .2s;display:inline-block;transform:rotate(${col?'-90':'0'}deg)\">▾<\u002Fspan>\n            📅 其它今日 <span style=\"font-size:11px;color:var(--text3)\">(${todayOther.length}) 重复/截止今天<\u002Fspan>\n          <\u002Fdiv>`;\n        if(!col)todayOther.forEach(t=>h+=taskHtml(t));\n        h+=`<\u002Fdiv>`;\n      }\n      // Done today: use doneTs (numeric) for reliable same-day check\n      const todayMidnightTs=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();\n      const doneToday=S.tasks.filter(t=>t.done&&(t.doneTs>=todayMidnightTs));\n      if(doneToday.length){\n        const col=tc.done;\n        h+=`<div class=\"today-section\" style=\"opacity:.8\">\n          <div class=\"today-section-hdr collapsible-hdr\" onclick=\"toggleTodaySection('done')\" style=\"cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;color:var(--text3)\">\n            <span style=\"font-size:11px;color:var(--text3);transition:transform .2s;display:inline-block;transform:rotate(${col?'-90':'0'}deg)\">▾<\u002Fspan>\n            ✅ 今日已完成 <span style=\"font-size:11px\">(${doneToday.length})<\u002Fspan>\n          <\u002Fdiv>`;\n        if(!col)doneToday.forEach(t=>h+=taskHtml(t));\n        h+=`<\u002Fdiv>`;\n      }\n    }\n    list.innerHTML=h;return;\n  }\n\n  if(S.activeTab==='fragments'){\n    // Tasks: either marked with fragTag, or trivial/easy without archive\n    const frags=S.tasks.filter(t=>!t.done&&(t.fragTag||(t.diff==='trivial'||t.diff==='easy'))&&t.type!=='archive');\n    const sopSteps=[\n      {icon:'📵',name:'放下手机',desc:'把手机屏幕朝下放'},\n      {icon:'🌬️',name:'深呼吸3次',desc:'吸4秒，呼6秒'},\n      {icon:'👀',name:'扫一眼碎片清单',desc:'选一件5分钟内能做的'},\n      {icon:'⚡',name:'立刻开始',desc:'不思考，直接动手'},\n    ];\n    let h=`<div style=\"padding:12px 14px;border-radius:12px;border:1px solid var(--brd);background:var(--card);margin-bottom:12px\">\n      <div style=\"font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px\">⚡ 碎片时间 SOP<\u002Fdiv>\n      <div style=\"font-size:11px;color:var(--text3);margin-bottom:10px\">拿起手机不知做什么？按这个流程来：<\u002Fdiv>\n      <div style=\"display:flex;gap:0;flex-direction:column;gap:6px\">`;\n    sopSteps.forEach((s,i)=>{h+=`<div style=\"display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;background:var(--surf2)\">\n        <span style=\"font-size:18px;flex-shrink:0\">${s.icon}<\u002Fspan>\n gs.slice(0,50).forEach(log=>{\n        const rs=log.setMins*60,actual=log.totalSecs||0;\n        const m=Math.floor(actual/60),s=actual%60;\n        const durStr=m>0?m+'分'+s+'秒':s+'秒';\n        const setStr=log.setMins+'分钟';\n        h+=`<div class=\"focus-log-item\"><span class=\"fli-icon\">🍅<\u002Fspan><div class=\"fli-info\"><div class=\"fli-name\">${log.taskName}<\u002Fdiv><div class=\"fli-meta\">${log.time||''} · 设定 ${setStr}<\u002Fdiv><\u002Fdiv><div class=\"fli-dur\">${durStr}<\u002Fdiv><\u002Fdiv>`;\n      });\n    }\n\n    if(sub==='shop'){\n      const shopLogs=S.ledger.filter(e=>(e.desc||'').startsWith('购买')).sort((a,b)=>(b.ts||0)-(a.ts||0));\n      const totalSpent=shopLogs.reduce((a,b)=>a+Math.abs(b.delta),0);\n      h+=`<div style=\"padding:9px 12px;border-radius:10px;background:var(--card);border:1px solid var(--brd);margin-bottom:10px;display:flex;gap:10px;align-items:center\">\n        <span style=\"font-size:20px\">🛒<\u002Fspan>\n        <div><div style=\"font-size:13px;font-weight:600;color:var(--text)\">累计消费<\u002Fdiv>\n        <div style=\"font-family:'Press Start 2P',monospace;font-size:10px;color:#e8a020\">${totalSpent} 🪙<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>`;\n      if(!shopLogs.length)h+='<div class=\"empty\">还没有购买记录<\u002Fdiv>';\n      else shopLogs.forEach(e=>{\n        const name=(e.desc||'').replace('购买: ','');\n        h+=`<div class=\"log-entry\" style=\"flex-direction:column;align-items:flex-start;gap:2px\">\n          <div style=\"display:flex;align-items:center;gap:6px;width:100%\">\n            <span class=\"le-icon\">🛒<\u002Fspan>\n            <span class=\"le-desc\" style=\"flex:1\">${name}<\u002Fspan>\n            <span class=\"le-val neg\">${e.delta}🪙<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:10px;color:var(--text3);padding-left:22px\">${e.time||''}<\u002Fdiv>\n        <\u002Fdiv>`;\n      });\n    }\n    if(sub==='ledger'){\n      const filters=[{k:'',l:'全部'},{k:'xp',l:'✨XP'},{k:'gold',l:'🪙金币'},{ ,lastweek:'上周',month:'本月',lastmonth:'上月',year:'本年',lastyear:'去年'};\n  const lbl=periods[period]||period;\n  const now=new Date();\n  function getPeriodRange(p){\n    const n=new Date();\n    if(p==='week'){const wd=n.getDay()||7;const mon=new Date(n);mon.setDate(n.getDate()-wd+1);mon.setHours(0,0,0,0);const sun=new Date(mon);sun.setDate(mon.getDate()+6);sun.setHours(23,59,59,999);return{start:mon.getTime(),end:sun.getTime()};}\n    if(p==='lastweek'){const wd=n.getDay()||7;const mon=new Date(n);mon.setDate(n.getDate()-wd-6);mon.setHours(0,0,0,0);const sun=new Date(mon);sun.setDate(mon.getDate()+6);sun.setHours(23,59,59,999);return{start:mon.getTime(),end:sun.getTime()};}\n    if(p==='month'){const s=new Date(n.getFullYear(),n.getMonth(),1);const e=new Date(n.getFullYear(),n.getMonth()+1,0,23,59,59,999);return{start:s.getTime(),end:e.getTime()};}\n    if(p==='lastmonth'){const s=new Date(n.getFullYear(),n.getMonth()-1,1);const e=new Date(n.getFullYear(),n.getMonth(),0,23,59,59,999);return{start:s.getTime(),end:e.getTime()};}\n    if(p==='year'){const s=new Date(n.getFullYear(),0,1);const e=new Date(n.getFullYear(),11,31,23,59,59,999);return{start:s.getTime(),end:e.getTime()};}\n    if(p==='lastyear'){const s=new Date(n.getFullYear()-1,0,1);const e=new Date(n.getFullYear()-1,11,31,23,59,59,999);return{start:s.getTime(),end:e.getTime()};}\n    return{start:Date.now()-7*864e5,end:Date.now()};\n  }\n  const range=getPeriodRange(period);\n  const inRange=ts=>ts>=range.start&&ts<=range.end;\n  const done=S.doneList.filter(d=>d.ts&&inRange(d.ts)&&d.gold>=0);\n  const xpTotal=S.ledger.filter(e=>e.ts&&inRange(e.ts)&&e.type==='xp'&&e.delta>0).reduce((a,b)=>a+b.delta,0);\n  const goldTotal=S.ledger.filter(e=>e.ts&&inRange(e.ts)&&e.type==='gold'&&e.delta>0).reduce((a,b)=>a+b.delta,0);\n  const pomoLogs=[];S.tasks.forEach(t=>{(t.pomoLogs||[]).forEach(l=>{if(inRange(l.ts))pomoLogs.push({...l,taskName:t.name});});});\n  const pomoSecs=pomoLogs.reduce((a,b)=>a+(b.totalSecs||b.setMins*60||0),0);\n  const diaryInRange=[...(S.diaryEntries||[]),...(S.dailySummaries||[])].filter(d=>d.ts&&inRange(d.ts)).sort((a,b)=>b.ts-a.ts);\n  let txt=`GO AHEAD — ${lbl}统计报告\n生成时间：${now.toLocaleString('zh-CN')}\n${'='.repeat(40)}\n\n`;\n  txt+=`【概览】\n完成任务：${done.length}项\n获得XP：+${xpTotal}\n获得金币：+${goldTotal}\n🍅番茄：${pomoLogs.length}次，共${Math.floor(pomoSecs/3600)}h${Math.floor((pomoSecs%3600)/60)}m\n\n`;\n  txt+=`【完成记录（${done.length}条）】\n`;\n  done.forEach((d,i)=>{txt+=`${i+1}. ${d.name}  ${d.time||''}  +${d.xp}XP +${d.gold}金\n`;});\n  if(pomoLogs.length){txt+=`\n【专注记录（${pomoLogs.length}条）】\n`;pomoLogs.forEach((l,i)=>{const m=Math.floor((l.totalSecs||l.setMins*60)/60);txt+=`${i+1}. ${l.taskName}  ${l.time||''}  ${m}分钟\n`;});}\n  if(diaryInRange.length){txt+=`\n【日记（${diaryInRange.length}条）】\n`;diaryInRange.forEach(d=>{txt+=`--- ${d.date} ---\n${d.text}\n\n`;});}\n  const a=document.createElement('a');a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);\n  a.download=`goahead_${period}_${now.toISOString().slice(0,10)}.txt`;a.click();\n  showToast('✅ '+lbl+'统计已导出');\n}\nfunction toggleTabDone(key){\n  if(!S.tabDoneCollapsed)S.tabDoneCollapsed={section:false,today:false,past:true};\nif(!S.pwaIconColor)S.pwaIconColor='#ffffff';\nif(!S.pwaBgColor)S.pwaBgColor='#f5f4f0';\n  S.tabDoneCollapsed[key]=!S.tabDoneCollapsed[key];\n  save();render();\n}\nfunction toggleTodaySection(key){\n  if(!S.todayCollapsed)S.todayCollapsed={mustdo:false,other:false,done:true};\nif(!S.doneGroupCollapsed)S.doneGroupCollapsed={};\nif(!S.tabDoneCollapsed)S.tabDoneCollapsed={section:false,today:false,past:true};\nif(!S.pwaIconColor)S.pwaIconColor='#ffffff';\nif(!S.pwaBgColor)S.pwaBgColor='#f5f4f0';\n  S.todayCollapsed[key]=!S.todayCollapsed[key];\n  save();render();\n}\nfunction setLogSubTab(sub){S.logSubTab=sub;save();render();}\nlet fragEditId=null,fragBulkSel=new Set(),fragMultiselect=false,fragDragTaskId=null;\nconst fragExpanded=new Set();\nfunction startFragEdit(tid){fragEditId=t
